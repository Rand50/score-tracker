<svg xmlns="http://www.w3.org/2000/svg" width="420" height="520" viewBox="0 0 420 520">
  <defs>
    <linearGradient id="f7Bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f5c6b"/>
      <stop offset="55%" stop-color="#083440"/>
      <stop offset="100%" stop-color="#041b24"/>
    </linearGradient>
    <radialGradient id="f7Glow" cx="50%" cy="38%" r="54%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity=".30"/>
      <stop offset="60%" stop-color="#2dd4bf" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="f7Gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="f7Ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="100%" stop-color="#f1e4c6"/>
    </linearGradient>
    <linearGradient id="f7Teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="f7Coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="f7Sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".58"/>
    </filter>
  </defs>

  <rect width="420" height="520" fill="url(#f7Bg)"/>
  <rect width="420" height="520" fill="url(#f7Glow)"/>
  <rect x="16" y="16" width="388" height="488" rx="18" fill="none" stroke="url(#f7Gold)" stroke-width="2" opacity=".72"/>
  <rect x="24" y="24" width="372" height="472" rx="13" fill="none" stroke="#fef08a" stroke-width="1" opacity=".26"/>

  <!-- Left fanned card: 12 (Coral / Sunburst) -->
  <g filter="url(#f7Sh)" transform="translate(130 250) rotate(-20)">
    <rect x="-68" y="-104" width="136" height="208" rx="14" fill="url(#f7Ivory)" stroke="url(#f7Gold)" stroke-width="2.8"/>
    <rect x="-58" y="-94" width="116" height="188" rx="9" fill="none" stroke="#f43f5e" stroke-width="1.4" opacity=".45"/>
    <text x="-50" y="-66" fill="#be123c" font-family="Georgia, serif" font-weight="700" font-size="24">12</text>
    <circle cx="0" cy="6" r="40" fill="url(#f7Coral)" opacity=".14"/>
    <text x="0" y="26" text-anchor="middle" fill="#be123c" font-family="Georgia, serif" font-weight="700" font-size="60">12</text>
  </g>

  <!-- Right fanned card: +4 Modifier (Coastal Teal) -->
  <g filter="url(#f7Sh)" transform="translate(290 250) rotate(20)">
    <rect x="-68" y="-104" width="136" height="208" rx="14" fill="url(#f7Ivory)" stroke="url(#f7Gold)" stroke-width="2.8"/>
    <rect x="-58" y="-94" width="116" height="188" rx="9" fill="none" stroke="#0f766e" stroke-width="1.4" opacity=".45"/>
    <text x="-50" y="-66" fill="#0f766e" font-family="Georgia, serif" font-weight="700" font-size="24">+4</text>
    <circle cx="0" cy="6" r="40" fill="url(#f7Teal)" opacity=".16"/>
    <text x="0" y="25" text-anchor="middle" fill="#0f766e" font-family="Georgia, serif" font-weight="700" font-size="56">+4</text>
  </g>

  <!-- Center Hero Card: Lucky 7 -->
  <g filter="url(#f7Sh)" transform="translate(210 226)">
    <rect x="-76" y="-114" width="152" height="228" rx="14" fill="url(#f7Ivory)" stroke="url(#f7Gold)" stroke-width="3.2"/>
    <rect x="-65" y="-103" width="130" height="206" rx="9" fill="none" stroke="#0f766e" stroke-width="1.6" opacity=".55"/>
    <text x="-53" y="-71" fill="#0f766e" font-family="Georgia, serif" font-weight="700" font-size="28">7</text>
    <text x="38" y="92" fill="#0f766e" font-family="Georgia, serif" font-weight="700" font-size="28">7</text>
    <!-- Sculpted coastal teal & gold medallion -->
    <circle cx="0" cy="6" r="50" fill="url(#f7Teal)" stroke="url(#f7Gold)" stroke-width="3.5"/>
    <circle cx="0" cy="6" r="42" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="4 4" opacity=".65"/>
    <text x="0" y="34" text-anchor="middle" fill="url(#f7Gold)" stroke="#062e36" stroke-width="1.6" font-family="Georgia, serif" font-weight="700" font-size="82">7</text>
    <!-- Tiny retro sparkles -->
    <path d="M-38 -52 L-35 -44 L-27 -41 L-35 -38 L-38 -30 L-41 -38 L-49 -41 L-41 -44 Z" fill="url(#f7Gold)"/>
    <path d="M38 56 L40 62 L46 64 L40 66 L38 72 L36 66 L30 64 L36 62 Z" fill="url(#f7Gold)"/>
  </g>

  <!-- Top gold diamond accent (matches Hearts, Oh Hell, Nertz) -->
  <path d="M120 56 H196 M224 56 H300" stroke="url(#f7Gold)" stroke-width="1.5" opacity=".72"/>
  <rect x="206" y="52" width="8" height="8" fill="url(#f7Gold)" transform="rotate(45 210 56)"/>
</svg>

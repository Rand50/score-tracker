<!-- =========================================================================
     7 Wonders — Option 3: Illuminated Papyrus Ledger (#sw-shell)
     Mount inside <section id="view-active" class="view"> in v3/shell.html.
     Only visible when body.theme-seven-wonders is active.
     Category-by-category scoring for 3-7 players. Zero emojis; custom SVGs.
     ========================================================================= -->
<div id="sw-shell" data-cat="military">
  <!-- Reusable custom inline SVG icon symbols (7 base + 3 expansions + laurel) -->
  <svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <!-- Corner Greek-key filigree -->
      <symbol id="sw-ico-corner" viewBox="0 0 36 36">
        <path d="M2 34V2h32M6 34V6h28M6 12h8v-6M12 6v8H6M2 22h10v-6H8v3h2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
      </symbol>

      <!-- Laurel wreath (for #1 leader) -->
      <symbol id="sw-ico-laurel" viewBox="0 0 24 24">
        <path d="M8.5 19.5C5.2 17.6 3.5 14.3 4 10.2c.3-2.5 1.5-4.7 3.4-6.2M15.5 19.5c3.3-1.9 5-5.2 4.5-9.3-.3-2.5-1.5-4.7-3.4-6.2M9.5 20.5h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M4.2 14.5l2.5-.6M4 11l2.6.2M5.2 7.5l2.3 1M19.8 14.5l-2.5-.6M20 11l-2.6.2M18.8 7.5l-2.3 1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </symbol>

      <!-- 1. Military (Crimson shield + crossed swords) -->
      <symbol id="sw-ico-military" viewBox="0 0 28 28">
        <path d="M14 2.5L23 6v7.5c0 5.6-3.9 9.7-9 12-5.1-2.3-9-6.4-9-12V6l9-3.5z" fill="#a62b22" stroke="#5c1611" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M9.2 9.2l9.6 9.6M18.8 9.2l-9.6 9.6M8.5 16.5l3 3M19.5 16.5l-3 3" stroke="#fdf6ea" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>

      <!-- 2. Treasury Coins (Gold coin + classical temple) -->
      <symbol id="sw-ico-treasury" viewBox="0 0 28 28">
        <circle cx="14" cy="14" r="11" fill="#d9a538" stroke="#7d5610" stroke-width="1.6"/>
        <circle cx="14" cy="14" r="8.2" fill="none" stroke="#8f6314" stroke-width="1"/>
        <path d="M8.5 12L14 8.6 19.5 12h-11zM10 12v6M14 12v6M18 12v6M8.5 18.5h11" fill="none" stroke="#5c3e08" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>

      <!-- 3. Wonder (Terracotta stepped pyramid) -->
      <symbol id="sw-ico-wonder" viewBox="0 0 28 28">
        <polygon points="14,4 25,23 3,23" fill="#c77a38" stroke="#6e3a12" stroke-width="1.5" stroke-linejoin="round"/>
        <polygon points="14,4 25,23 14,23" fill="#a85c27" opacity="0.55"/>
        <path d="M9.8 12h8.4M7.2 16.5h13.6M5 20.5h18" stroke="#6e3a12" stroke-width="1.2" opacity="0.7"/>
      </symbol>

      <!-- 4. Civilian (Cobalt blue Greek column) -->
      <symbol id="sw-ico-civilian" viewBox="0 0 28 28">
        <rect x="6" y="4.5" width="16" height="3.5" rx="1.5" fill="#3a72ab" stroke="#1e3d5e" stroke-width="1.4"/>
        <rect x="9" y="8" width="10" height="13" fill="#2b5a8a" stroke="#1e3d5e" stroke-width="1.4"/>
        <path d="M12 8.5v12M16 8.5v12" stroke="#9ac2eb" stroke-width="1.2"/>
        <rect x="6.5" y="21" width="15" height="3" rx="1" fill="#3a72ab" stroke="#1e3d5e" stroke-width="1.4"/>
      </symbol>

      <!-- 5. Commercial (Ochre golden amphora) -->
      <symbol id="sw-ico-commercial" viewBox="0 0 28 28">
        <path d="M11 5h6l-.8 3.5c2.6 1.5 4.3 4.3 4.3 7.5 0 3.7-2.2 6.5-5.5 7.5h-2c-3.3-1-5.5-3.8-5.5-7.5 0-3.2 1.7-6 4.3-7.5L11 5z" fill="#d9a12b" stroke="#75520d" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M10.5 7.5C7 7.5 6 10 7.8 12.2M17.5 7.5c3.5 0 4.5 2.5 2.7 4.7M9.5 23.5h9" fill="none" stroke="#75520d" stroke-width="1.5" stroke-linecap="round"/>
      </symbol>

      <!-- 6. Guilds (Plum purple Corinthian helm) -->
      <symbol id="sw-ico-guilds" viewBox="0 0 28 28">
        <path d="M14 4.5c4.6 0 7.5 3.2 7.5 7.8 0 4.5-1.8 8.7-4.5 11.2l-1.5-5.5h-3L11 23.5c-2.7-2.5-4.5-6.7-4.5-11.2 0-4.6 2.9-7.8 7.5-7.8z" fill="#774182" stroke="#3f1e47" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M10 12.5h3v2.5h-3zM15 12.5h3v2.5h-3z" fill="#f3e8d1"/>
      </symbol>

      <!-- 7. Science (Emerald tablet + compass + gear) -->
      <symbol id="sw-ico-science" viewBox="0 0 28 28">
        <rect x="4" y="5" width="12" height="17" rx="2" fill="#2d6f45" stroke="#184227" stroke-width="1.5"/>
        <path d="M7 9.5h6M7 13h6M7 16.5h4" stroke="#e9f5ec" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="19.5" cy="18.5" r="4.8" fill="#3a8a57" stroke="#184227" stroke-width="1.4"/>
        <circle cx="19.5" cy="18.5" r="1.6" fill="#f3e8d1"/>
        <path d="M19.5 6l-3.2 7.5M19.5 6l3.2 7.5" stroke="#184227" stroke-width="1.5" stroke-linecap="round"/>
      </symbol>

      <!-- Science sub-symbols -->
      <symbol id="sw-ico-tablet" viewBox="0 0 16 16">
        <rect x="3" y="2" width="10" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M5.5 5.5h5M5.5 8h5M5.5 10.5h3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </symbol>
      <symbol id="sw-ico-compass" viewBox="0 0 16 16">
        <circle cx="8" cy="3.2" r="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M7.3 4.6L4 13.5M8.7 4.6L12 13.5M5.2 10.2h5.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </symbol>
      <symbol id="sw-ico-gear" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M12.2 3.8l-1.4 1.4M5.2 10.8l-1.4 1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </symbol>
      <symbol id="sw-ico-wild" viewBox="0 0 16 16">
        <polygon points="8,1.8 9.8,6.2 14.5,6.5 10.8,9.5 12,14.2 8,11.6 4,14.2 5.2,9.5 1.5,6.5 6.2,6.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      </symbol>

      <!-- Expansion 1: Leaders (Ivory/bronze crown & scroll) -->
      <symbol id="sw-ico-leaders" viewBox="0 0 28 28">
        <circle cx="14" cy="10" r="4.5" fill="#9c9689" stroke="#47433b" stroke-width="1.5"/>
        <path d="M6.5 23c.8-4.2 3.8-6.5 7.5-6.5s6.7 2.3 7.5 6.5H6.5z" fill="#827c70" stroke="#47433b" stroke-width="1.5" stroke-linejoin="round"/>
      </symbol>

      <!-- Expansion 2: Cities (Obsidian-slate citadel mask) -->
      <symbol id="sw-ico-cities" viewBox="0 0 28 28">
        <path d="M6 23V10l3-4 2.5 3h5L19 6l3 4v13H6z" fill="#464b54" stroke="#1f2228" stroke-width="1.5" stroke-linejoin="round"/>
        <rect x="11.5" y="15" width="5" height="8" rx="2.5" fill="#f3e8d1"/>
      </symbol>

      <!-- Expansion 3: Armada (Aegean teal trireme) -->
      <symbol id="sw-ico-armada" viewBox="0 0 28 28">
        <path d="M14 5v11M14 6.5l8 5.5-8 2.5" fill="#2c8c9b" stroke="#13454d" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M4.5 18.5h19l-2.5 4.5H7l-2.5-4.5z" fill="#1f6c78" stroke="#13454d" stroke-width="1.5" stroke-linejoin="round"/>
      </symbol>
    </defs>
  </svg>

  <div class="sw-folio">
    <!-- Subtle bronze-ink corner accents -->
    <svg class="sw-corner tl" aria-hidden="true"><use href="#sw-ico-corner"/></svg>
    <svg class="sw-corner tr" aria-hidden="true"><use href="#sw-ico-corner"/></svg>
    <svg class="sw-corner bl" aria-hidden="true"><use href="#sw-ico-corner"/></svg>
    <svg class="sw-corner br" aria-hidden="true"><use href="#sw-ico-corner"/></svg>

    <!-- MASTHEAD -->
    <header class="sw-head">
      <div class="sw-head-top">
        <button type="button" id="sw-btn-back" class="sw-back-btn" onclick="window.goHome ? goHome() : (window.showView && showView('new'))">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          <span>Games</span>
        </button>

        <button type="button" id="sw-exp-toggle" class="sw-exp-toggle" aria-expanded="false" aria-controls="sw-exp-bar" onclick="window.swToggleExpansionsDrawer && swToggleExpansionsDrawer()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M3 12h18"/></svg>
          <span>Expansions</span>
          <span id="sw-exp-badge" class="sw-exp-badge" hidden></span>
        </button>
      </div>

      <h1 class="sw-title">7 Wonders</h1>
      <div class="sw-flourish" aria-hidden="true">
        <span class="sw-flourish-line"></span>
        <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor"><path d="M7 0l2.2 5L7 10 4.8 5 7 0zM1 5l2-1.5L3 6.5 1 5zm12 0l-2-1.5v3L13 5z"/></svg>
        <span class="sw-flourish-line"></span>
      </div>
      <p class="sw-subtitle">Illuminated Papyrus Ledger</p>
    </header>

    <!-- OPTIONAL EXPANSIONS DRAWER (Leaders / Cities / Armada, OFF by default) -->
    <div id="sw-exp-bar" class="sw-exp-bar" hidden role="region" aria-label="7 Wonders expansions">
      <label class="sw-exp-chip" data-exp="leaders">
        <input type="checkbox" id="sw-exp-leaders" onchange="window.swToggleExpansion && swToggleExpansion('leaders', this.checked)">
        <svg aria-hidden="true"><use href="#sw-ico-leaders"/></svg>
        <span>Leaders</span>
      </label>
      <label class="sw-exp-chip" data-exp="cities">
        <input type="checkbox" id="sw-exp-cities" onchange="window.swToggleExpansion && swToggleExpansion('cities', this.checked)">
        <svg aria-hidden="true"><use href="#sw-ico-cities"/></svg>
        <span>Cities</span>
      </label>
      <label class="sw-exp-chip" data-exp="armada">
        <input type="checkbox" id="sw-exp-armada" onchange="window.swToggleExpansion && swToggleExpansion('armada', this.checked)">
        <svg aria-hidden="true"><use href="#sw-ico-armada"/></svg>
        <span>Armada</span>
      </label>
    </div>

    <!-- COMPACT LIVE RANKED LEADERBOARD (3-7 players) -->
    <section id="sw-leaderboard" class="sw-leaderboard" data-count="4" aria-label="Live standings"></section>

    <!-- CATEGORY-BY-CATEGORY STRIP -->
    <div class="sw-section-rule">
      <span class="sw-section-label">Score Breakdown</span>
    </div>

    <div id="sw-cat-tabs" class="sw-cat-tabs" role="tablist" aria-label="Scoring categories">
      <button type="button" class="sw-cat-tab is-active" role="tab" aria-selected="true" data-cat="military" onclick="window.swSelectCategory && swSelectCategory('military')">
        <span class="sw-cat-tab-ico"><svg aria-hidden="true"><use href="#sw-ico-military"/></svg></span>
        <span>Military</span>
      </button>
      <button type="button" class="sw-cat-tab" role="tab" aria-selected="false" data-cat="treasury" onclick="window.swSelectCategory && swSelectCategory('treasury')">
        <span class="sw-cat-tab-ico"><svg aria-hidden="true"><use href="#sw-ico-treasury"/></svg></span>
        <span>Treasury</span>
      </button>
      <button type="button" class="sw-cat-tab" role="tab" aria-selected="false" data-cat="wonder" onclick="window.swSelectCategory && swSelectCategory('wonder')">
        <span class="sw-cat-tab-ico"><svg aria-hidden="true"><use href="#sw-ico-wonder"/></svg></span>
        <span>Wonder</span>
      </button>
      <button type="button" class="sw-cat-tab" role="tab" aria-selected="false" data-cat="civilian" onclick="window.swSelectCategory && swSelectCategory('civilian')">
        <span class="sw-cat-tab-ico"><svg aria-hidden="true"><use href="#sw-ico-civilian"/></svg></span>
        <span>Civilian</span>
      </button>
      <button type="button" class="sw-cat-tab" role="tab" aria-selected="false" data-cat="commercial" onclick="window.swSelectCategory && swSelectCategory('commercial')">
        <span class="sw-cat-tab-ico"><svg aria-hidden="true"><use href="#sw-ico-commercial"/></svg></span>
        <span>Commerce</span>
      </button>
      <button type="button" class="sw-cat-tab" role="tab" aria-selected="false" data-cat="guilds" onclick="window.swSelectCategory && swSelectCategory('guilds')">
        <span class="sw-cat-tab-ico"><svg aria-hidden="true"><use href="#sw-ico-guilds"/></svg></span>
        <span>Guilds</span>
      </button>
      <button type="button" class="sw-cat-tab" role="tab" aria-selected="false" data-cat="science" onclick="window.swSelectCategory && swSelectCategory('science')">
        <span class="sw-cat-tab-ico"><svg aria-hidden="true"><use href="#sw-ico-science"/></svg></span>
        <span>Science</span>
      </button>
      <button type="button" class="sw-cat-tab" role="tab" aria-selected="false" data-cat="leaders" hidden onclick="window.swSelectCategory && swSelectCategory('leaders')">
        <span class="sw-cat-tab-ico"><svg aria-hidden="true"><use href="#sw-ico-leaders"/></svg></span>
        <span>Leaders</span>
      </button>
      <button type="button" class="sw-cat-tab" role="tab" aria-selected="false" data-cat="cities" hidden onclick="window.swSelectCategory && swSelectCategory('cities')">
        <span class="sw-cat-tab-ico"><svg aria-hidden="true"><use href="#sw-ico-cities"/></svg></span>
        <span>Cities</span>
      </button>
      <button type="button" class="sw-cat-tab" role="tab" aria-selected="false" data-cat="armada" hidden onclick="window.swSelectCategory && swSelectCategory('armada')">
        <span class="sw-cat-tab-ico"><svg aria-hidden="true"><use href="#sw-ico-armada"/></svg></span>
        <span>Armada</span>
      </button>
    </div>

    <!-- ACTIVE CATEGORY LEDGER CARD -->
    <section id="sw-cat-card" class="sw-cat-card" data-cat="military" aria-live="polite">
      <header class="sw-cat-head">
        <div id="sw-cat-icon" class="sw-cat-icon" aria-hidden="true">
          <svg><use href="#sw-ico-military"/></svg>
        </div>
        <div class="sw-cat-meta">
          <h2 id="sw-cat-title" class="sw-cat-title">Military Conflicts</h2>
          <p id="sw-cat-hint" class="sw-cat-hint">Sum victory &amp; defeat tokens (−6 to +18 VP)</p>
        </div>
        <span id="sw-cat-step" class="sw-cat-step">1 / 7</span>
      </header>

      <div id="sw-player-rows" class="sw-player-rows"></div>
    </section>

    <!-- FOOTER CONTROLS -->
    <footer class="sw-footer">
      <div class="sw-nav-row">
        <button type="button" id="sw-btn-prev" class="sw-nav-btn" onclick="window.swStepCategory && swStepCategory(-1)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          <span>Prev</span>
        </button>

        <button type="button" id="sw-btn-undo" class="sw-nav-btn is-undo" onclick="window.swUndo && swUndo()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
          <span>Undo</span>
        </button>

        <button type="button" id="sw-btn-next" class="sw-nav-btn is-next" onclick="window.swStepCategory && swStepCategory(1)">
          <span id="sw-btn-next-label">Next Category</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>

      <button type="button" id="sw-btn-finish" class="sw-finish-btn" onclick="window.openEndGameModal && openEndGameModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M16 20c-4.5-2.5-7-6.8-6.5-12.5.2-1.8.8-3.4 1.8-4.5M9.5 14l3.5-.8M9.5 10.2l3.4.3M10.5 6.8l2.8 1.2"/></svg>
        <span>Finish Game</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 20c4.5-2.5 7-6.8 6.5-12.5-.2-1.8-.8-3.4-1.8-4.5M14.5 14l-3.5-.8M14.5 10.2l-3.4.3M13.5 6.8l-2.8 1.2"/></svg>
      </button>
    </footer>
  </div>
</div>

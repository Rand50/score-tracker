<div id="v262-ctl" class="v262-ctl" role="toolbar" aria-label="Game controls" hidden>
  <div class="v262-ctl-in">
    <button type="button" id="v262-leave" class="v262-btn v262-leave" aria-label="Leave game and go to Play" onclick="window.TallyItV262 && TallyItV262.leave()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      <span>Leave</span>
    </button>
    <button type="button" id="v262-log" class="v262-btn v262-log" aria-label="Log game to History" onclick="window.TallyItV262 && TallyItV262.log()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
      <span>Log</span>
    </button>

    </button>
  </div>
</div>

<div id="v262-del-modal" class="v262-del-modal" role="dialog" aria-modal="true" aria-labelledby="v262-del-title" hidden>
  <div class="v262-del-scrim" onclick="window.TallyItV262 && TallyItV262.closeDelete()"></div>
  <div class="v262-del-card">
    <h2 id="v262-del-title" class="v262-del-title">Delete this game?</h2>
    <p id="v262-del-sub" class="v262-del-sub">It will not be saved to History.</p>
    <div class="v262-del-actions">
      <button type="button" id="v262-del-cancel" class="v262-del-btn" onclick="window.TallyItV262 && TallyItV262.closeDelete()">Keep game</button>
      <button type="button" id="v262-del-confirm" class="v262-del-btn v262-del-danger" onclick="window.TallyItV262 && TallyItV262.confirmDelete()">Delete game</button>
    </div>
  </div>
</div>

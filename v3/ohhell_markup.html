<!-- TallyIt v23 — Oh Hell: Ivory & Emerald Ledger (#oh-shell) -->
<div id="oh-shell" class="oh-shell" aria-label="Oh Hell Score Ledger">
  <div class="oh-ledger-frame">
    <!-- Top playing-card corner suit pips (decorative emerald & charcoal) -->
    <div class="oh-corner-pips oh-corner-tl" aria-hidden="true">
      <svg viewBox="0 0 36 42" fill="none">
        <path d="M9 2.5C9 2.5 3.5 6.8 3.5 9.6A2.8 2.8 0 0 0 8.2 11.4L7.2 13.5h3.6l-1-2.1A2.8 2.8 0 0 0 14.5 9.6C14.5 6.8 9 2.5 9 2.5Z" fill="#115539"/>
        <path d="M25 2.5C25 2.5 19.5 6.8 19.5 9.6A2.8 2.8 0 0 0 24.2 11.4l-1 2.1h3.6l-1-2.1A2.8 2.8 0 0 0 30.5 9.6C30.5 6.8 25 2.5 25 2.5Z" fill="#115539"/>
        <path d="M9 16.5C9 16.5 3.5 20.8 3.5 23.6A2.8 2.8 0 0 0 8.2 25.4L7.2 27.5h3.6l-1-2.1A2.8 2.8 0 0 0 14.5 23.6C14.5 20.8 9 16.5 9 16.5Z" fill="#115539"/>
        <path d="M25 16.5C25 16.5 19.5 20.8 19.5 23.6A2.8 2.8 0 0 0 24.2 25.4l-1 2.1h3.6l-1-2.1A2.8 2.8 0 0 0 30.5 23.6C30.5 20.8 25 16.5 25 16.5Z" fill="#115539"/>
        <line x1="3" y1="31.5" x2="18" y2="31.5" stroke="#4F4A44" stroke-width="1.2"/>
        <line x1="3" y1="35" x2="14" y2="35" stroke="#4F4A44" stroke-width="1"/>
      </svg>
    </div>
    <div class="oh-corner-pips oh-corner-tr" aria-hidden="true">
      <svg viewBox="0 0 36 42" fill="none">
        <path d="M9 2.5C9 2.5 3.5 6.8 3.5 9.6A2.8 2.8 0 0 0 8.2 11.4L7.2 13.5h3.6l-1-2.1A2.8 2.8 0 0 0 14.5 9.6C14.5 6.8 9 2.5 9 2.5Z" fill="#23201D"/>
        <path d="M25 2.5C25 2.5 19.5 6.8 19.5 9.6A2.8 2.8 0 0 0 24.2 11.4l-1 2.1h3.6l-1-2.1A2.8 2.8 0 0 0 30.5 9.6C30.5 6.8 25 2.5 25 2.5Z" fill="#23201D"/>
        <path d="M9 16.5C9 16.5 3.5 20.8 3.5 23.6A2.8 2.8 0 0 0 8.2 25.4L7.2 27.5h3.6l-1-2.1A2.8 2.8 0 0 0 14.5 23.6C14.5 20.8 9 16.5 9 16.5Z" fill="#23201D"/>
        <circle cx="25" cy="19.5" r="2.7" fill="#115539"/>
        <circle cx="22.1" cy="23.2" r="2.6" fill="#115539"/>
        <circle cx="27.9" cy="23.2" r="2.6" fill="#115539"/>
        <path d="M24 23.8l-1 3.7h4l-1-3.7h-2Z" fill="#115539"/>
        <line x1="18" y1="31.5" x2="33" y2="31.5" stroke="#4F4A44" stroke-width="1.2"/>
        <line x1="22" y1="35" x2="33" y2="35" stroke="#4F4A44" stroke-width="1"/>
      </svg>
    </div>

    <!-- Top utility bar: Back/Home + Undo + Universal End Game -->
    <div class="oh-topbar">
      <button type="button" id="oh-btn-home" class="oh-top-btn" onclick="showView('new')" aria-label="Back to Play">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        <span>Play</span>
      </button>
      <div class="oh-top-actions">
        <button type="button" id="oh-btn-undo" class="oh-top-btn" onclick="window.OhHellUI && window.OhHellUI.undoRound()" aria-label="Undo last round" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 14 4 9l5-5"/>
            <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>
          </svg>
          <span>Undo</span>
        </button>
        <button type="button" id="oh-btn-end" class="oh-top-btn oh-top-btn-end" onclick="window.openEndGameModal && openEndGameModal()" aria-label="End or pause game">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
            <line x1="4" y1="22" x2="4" y2="15"/>
          </svg>
          <span>End</span>
        </button>
      </div>
    </div>

    <!-- Ledger Header -->
    <header class="oh-header">
      <div class="oh-title-row">
        <svg class="oh-title-pip" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 14S2 9.8 2 5.6A3.4 3.4 0 0 1 8 3.5a3.4 3.4 0 0 1 6 2.1C14 9.8 8 14 8 14Z" fill="#115539"/>
        </svg>
        <h1 class="oh-title">Oh Hell</h1>
        <svg class="oh-title-pip" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 14S2 9.8 2 5.6A3.4 3.4 0 0 1 8 3.5a3.4 3.4 0 0 1 6 2.1C14 9.8 8 14 8 14Z" fill="#115539"/>
        </svg>
      </div>
      <div class="oh-ornament-rule" aria-hidden="true">
        <span class="oh-rule-line"></span>
        <span class="oh-rule-diamond"></span>
        <span class="oh-rule-line"></span>
      </div>
      <div class="oh-round-row">
        <span class="oh-rule-diamond-sm" aria-hidden="true"></span>
        <span class="oh-rule-line-sm" aria-hidden="true"></span>
        <span id="oh-round-label" class="oh-round-label">Round 1</span>
        <span class="oh-rule-line-sm" aria-hidden="true"></span>
        <span class="oh-rule-diamond-sm" aria-hidden="true"></span>
      </div>
    </header>

    <!-- Info boxes: Cards Dealt & Trump Suit -->
    <section class="oh-meta-grid" aria-label="Round information">
      <div class="oh-meta-box">
        <span class="oh-meta-label">Cards Dealt:</span>
        <span id="oh-cards-dealt" class="oh-meta-val">1</span>
      </div>

      <button type="button" id="oh-trump-btn" class="oh-meta-box oh-meta-btn" onclick="window.OhHellUI && window.OhHellUI.cycleTrump()" aria-label="Change trump suit">
        <span id="oh-trump-icon" class="oh-trump-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16"><path d="M8 1.5C8 1.5 2.5 6.1 2.5 9.4A3.1 3.1 0 0 0 7.1 11.8L6.1 14.5h3.8l-1-2.7a3.1 3.1 0 0 0 4.6-2.4C13.5 6.1 8 1.5 8 1.5Z" fill="#115539"/></svg>
        </span>
        <span class="oh-meta-label">Trump:</span>
        <span id="oh-trump-name" class="oh-meta-val">Spades</span>
      </button>
    </section>

    <!-- Live Bid & Tricks Tally Strip -->
    <div id="oh-round-status" class="oh-status-bar" role="status" aria-live="polite">
      <span id="oh-bids-tally" class="oh-status-chip">Total Bids: 0 / 1</span>
      <span id="oh-tricks-tally" class="oh-status-chip oh-status-total">Tricks Won: 0 / 1</span>
    </div>

    <!-- Player Ledger Rows (rendered dynamically by Oh Hell engine) -->
    <section id="oh-player-rows" class="oh-player-rows" aria-label="Player scores, bids, and tricks won"></section>

    <!-- Bottom Playing-Card Accent + Special Rules Panel -->
    <section class="oh-specials" aria-label="Oh Hell rules and bonuses">
      <!-- Vintage Ace of Spades Card Accent -->
      <div class="oh-card-emblem" aria-hidden="true">
        <svg viewBox="0 0 74 108" fill="none">
          <rect x="1.5" y="1.5" width="71" height="105" rx="6" fill="#FCF9F2" stroke="#5E5850" stroke-width="1.3"/>
          <rect x="6" y="6" width="62" height="96" rx="3.5" fill="none" stroke="#C4CDBF" stroke-width="0.9"/>
          <!-- Top-left A & Spade -->
          <text x="10" y="19" fill="#1F1C18" font-family="Georgia,serif" font-size="13" font-weight="700">A</text>
          <path d="M14.5 22.5C14.5 22.5 10.5 26 10.5 28.1a2.1 2.1 0 0 0 3.5 1.4l-.6 1.5h2.2l-.6-1.5a2.1 2.1 0 0 0 3.5-1.4c0-2.1-4-5.6-4-5.6Z" fill="#1F1C18"/>
          <!-- Ornate Center Ace of Spades -->
          <path d="M37 32C37 32 19 46.5 19 57.5a9.8 9.8 0 0 0 15.8 7.5L32 76h10l-2.8-11A9.8 9.8 0 0 0 55 57.5C55 46.5 37 32 37 32Z" fill="#1F1C18"/>
          <path d="M37 39.5c0 0-9.2 8.2-9.2 14.6a4.8 4.8 0 0 0 9.2 2 4.8 4.8 0 0 0 9.2-2c0-6.4-9.2-14.6-9.2-14.6Z" fill="none" stroke="#FCF9F2" stroke-width="1.2"/>
          <circle cx="37" cy="53" r="3" fill="#115539"/>
          <!-- Bottom-right inverted A & Spade -->
          <g transform="rotate(180 37 54)">
            <text x="10" y="19" fill="#1F1C18" font-family="Georgia,serif" font-size="13" font-weight="700">A</text>
            <path d="M14.5 22.5C14.5 22.5 10.5 26 10.5 28.1a2.1 2.1 0 0 0 3.5 1.4l-.6 1.5h2.2l-.6-1.5a2.1 2.1 0 0 0 3.5-1.4c0-2.1-4-5.6-4-5.6Z" fill="#1F1C18"/>
          </g>
        </svg>
      </div>

      <!-- Right Stacked Rule Cards -->
      <div class="oh-special-stack">
        <!-- Screw the Dealer live callout + toggle -->
        <div class="oh-special-row">
          <div id="oh-screw-card" class="oh-special-card">
            <svg class="oh-sp-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 1.5C8 1.5 2.5 6.1 2.5 9.4A3.1 3.1 0 0 0 7.1 11.8L6.1 14.5h3.8l-1-2.7a3.1 3.1 0 0 0 4.6-2.4C13.5 6.1 8 1.5 8 1.5Z" fill="#1F1C18"/>
            </svg>
            <div class="oh-sp-text">
              <div class="oh-sp-title">Screw the Dealer</div>
              <div id="oh-screw-sub" class="oh-sp-sub">(Dealer cannot bid 1)</div>
            </div>
          </div>
          <label class="oh-switch" aria-label="Toggle Screw the Dealer rule">
            <input type="checkbox" id="oh-screw-toggle" checked onchange="window.OhHellUI && window.OhHellUI.toggleScrewDealer(this.checked)">
            <span class="oh-switch-track"><span class="oh-switch-thumb"></span></span>
          </label>
        </div>

        <!-- Exact Bid Bonus summary card -->
        <div id="oh-bonus-card" class="oh-special-card oh-bonus-card">
          <svg class="oh-sp-icon" viewBox="0 0 24 24" fill="none" stroke="#115539" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="7"/>
            <line x1="12" y1="2" x2="12" y2="6"/>
            <line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="2" y1="12" x2="6" y2="12"/>
            <line x1="18" y1="12" x2="22" y2="12"/>
            <circle cx="12" cy="12" r="2" fill="#115539"/>
          </svg>
          <div class="oh-sp-text">
            <div class="oh-sp-title">Exact Bid Bonus</div>
            <div id="oh-bonus-sub" class="oh-sp-sub">(+10 + tricks won)</div>
          </div>
          <svg class="oh-bonus-heart" viewBox="0 0 24 24" fill="none" stroke="#2D4A3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20.5S4 15.2 4 9.6A4.6 4.6 0 0 1 12 6.8a4.6 4.6 0 0 1 8 2.8c0 5.6-8 10.9-8 10.9Z"/>
          </svg>
        </div>
      </div>
    </section>

    <!-- Validation error notice (hidden when valid) -->
    <div id="oh-error-msg" class="oh-error-msg" role="alert" hidden></div>

    <!-- Primary Emerald CTA: Score Round -->
    <div class="oh-cta-wrap">
      <button type="button" id="oh-btn-score" class="oh-cta-btn" onclick="window.OhHellUI && window.OhHellUI.scoreRound()">
        <svg class="oh-sparkle" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1 9.8 6.2 15 8 9.8 9.8 8 15 6.2 9.8 1 8 6.2 6.2 8 1Z" fill="currentColor"/>
        </svg>
        <span>Score Round</span>
        <svg class="oh-sparkle" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1 9.8 6.2 15 8 9.8 9.8 8 15 6.2 9.8 1 8 6.2 6.2 8 1Z" fill="currentColor"/>
        </svg>
      </button>
    </div>

    <!-- Collapsible Round History Drawer -->
    <details id="oh-history-drawer" class="oh-history-drawer">
      <summary class="oh-history-summary">
        <span>Round History</span>
        <span id="oh-history-count" class="oh-history-count">0 rounds</span>
      </summary>
      <div id="oh-history-list" class="oh-history-list">
        <div class="oh-history-empty">No rounds recorded yet.</div>
      </div>
    </details>

    <!-- Bottom Vintage Suit Ornament Footer -->
    <div class="oh-bottom-ornament" aria-hidden="true">
      <svg class="oh-foot-pip" viewBox="0 0 16 16"><path d="M8 14S2 9.8 2 5.6A3.4 3.4 0 0 1 8 3.5a3.4 3.4 0 0 1 6 2.1C14 9.8 8 14 8 14Z" fill="#115539"/></svg>
      <span class="oh-foot-line"></span>
      <svg class="oh-foot-pip-center" viewBox="0 0 16 16"><path d="M8 14S2 9.8 2 5.6A3.4 3.4 0 0 1 8 3.5a3.4 3.4 0 0 1 6 2.1C14 9.8 8 14 8 14Z" fill="#115539"/></svg>
      <span class="oh-foot-line"></span>
      <svg class="oh-foot-pip" viewBox="0 0 16 16"><path d="M8 1.5C8 1.5 2.5 6.1 2.5 9.4A3.1 3.1 0 0 0 7.1 11.8L6.1 14.5h3.8l-1-2.7a3.1 3.1 0 0 0 4.6-2.4C13.5 6.1 8 1.5 8 1.5Z" fill="#23201D"/></svg>
    </div>
  </div>
</div>

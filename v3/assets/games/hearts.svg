<svg xmlns="http://www.w3.org/2000/svg" width="420" height="520" viewBox="0 0 420 520">
  <defs>
    <linearGradient id="htBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b0d17"/>
      <stop offset="55%" stop-color="#22070e"/>
      <stop offset="100%" stop-color="#110307"/>
    </linearGradient>
    <radialGradient id="htGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="htGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#926319"/>
    </linearGradient>
    <linearGradient id="htIvory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="100%" stop-color="#eee0c2"/>
    </linearGradient>
    <filter id="htSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".62"/>
    </filter>
  </defs>
  <rect width="420" height="520" fill="url(#htBg)"/>
  <rect width="420" height="520" fill="url(#htGlow)"/>
  <rect x="16" y="16" width="388" height="488" rx="18" fill="none" stroke="url(#htGold)" stroke-width="2" opacity=".68"/>
  <rect x="24" y="24" width="372" height="472" rx="13" fill="none" stroke="#fde68a" stroke-width="1" opacity=".24"/>

  <!-- Left card: Queen of Spades -->
  <g filter="url(#htSh)" transform="translate(158 242) rotate(-14)">
    <rect x="-76" y="-114" width="152" height="228" rx="14" fill="url(#htIvory)" stroke="url(#htGold)" stroke-width="3"/>
    <rect x="-66" y="-104" width="132" height="208" rx="9" fill="none" stroke="#c9a14a" stroke-width="1.2" opacity=".5"/>
    <text x="-55" y="-72" fill="#111827" font-family="Georgia, serif" font-weight="700" font-size="30">Q</text>
    <text x="-52" y="-48" fill="#111827" font-family="Georgia, serif" font-size="22">♠</text>
    <!-- Gold crown above spade -->
    <path d="M-24 -26 L-18 -46 L-6 -32 L0 -50 L6 -32 L18 -46 L24 -26 Z" fill="url(#htGold)" stroke="#6e4a12" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M0 -14 C-5 8 -30 24 -30 42 C-30 55 -20 63 -10 63 C-4 63 0 60 0 55 C0 60 4 63 10 63 C20 63 30 55 30 42 C30 24 5 8 0 -14 Z" fill="#111827"/>
    <path d="M0 50 C-2 62 -8 70 -16 75 L16 75 C8 70 2 62 0 50 Z" fill="#111827"/>
  </g>

  <!-- Right card: Ace of Hearts -->
  <g filter="url(#htSh)" transform="translate(262 232) rotate(12)">
    <rect x="-76" y="-114" width="152" height="228" rx="14" fill="url(#htIvory)" stroke="url(#htGold)" stroke-width="3"/>
    <rect x="-66" y="-104" width="132" height="208" rx="9" fill="none" stroke="#c9a14a" stroke-width="1.2" opacity=".5"/>
    <text x="-54" y="-72" fill="#be123c" font-family="Georgia, serif" font-weight="700" font-size="30">A</text>
    <text x="-52" y="-48" fill="#be123c" font-family="Georgia, serif" font-size="22">♥</text>
    <text x="34" y="92" fill="#be123c" font-family="Georgia, serif" font-weight="700" font-size="30">A</text>
    <!-- Bold sculpted crimson heart -->
    <path d="M0 58 C-4 54 -44 22 -44 -6 C-44 -26 -28 -40 -12 -40 C-3 -40 0 -32 0 -28 C0 -32 3 -40 12 -40 C28 -40 44 -26 44 -6 C44 22 4 54 0 58 Z" fill="#be123c" stroke="url(#htGold)" stroke-width="2.2"/>
    <path d="M-24 -18 C-28 -10 -26 2 -14 14" fill="none" stroke="#fda4af" stroke-width="3.5" stroke-linecap="round" opacity=".55"/>
  </g>

  <path d="M120 56 H196 M224 56 H300" stroke="url(#htGold)" stroke-width="1.5" opacity=".7"/>
  <rect x="206" y="52" width="8" height="8" fill="url(#htGold)" transform="rotate(45 210 56)"/>
</svg>

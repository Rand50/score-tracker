<svg xmlns="http://www.w3.org/2000/svg" width="420" height="520" viewBox="0 0 420 520">
  <defs>
    <linearGradient id="nzBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#102545"/>
      <stop offset="55%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#050c18"/>
    </linearGradient>
    <radialGradient id="nzGlow" cx="50%" cy="38%" r="54%">
      <stop offset="0%" stop-color="#e6c677" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#e6c677" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nzGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf0c4"/>
      <stop offset="50%" stop-color="#e4be67"/>
      <stop offset="100%" stop-color="#a87c24"/>
    </linearGradient>
    <linearGradient id="nzIvory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="100%" stop-color="#e9dab7"/>
    </linearGradient>
    <linearGradient id="nzCrimson" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b1f22"/>
      <stop offset="100%" stop-color="#580e10"/>
    </linearGradient>
    <linearGradient id="nzNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c3f75"/>
      <stop offset="100%" stop-color="#0c1f3d"/>
    </linearGradient>
    <filter id="nzSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".6"/>
    </filter>
  </defs>
  <rect width="420" height="520" fill="url(#nzBg)"/>
  <rect width="420" height="520" fill="url(#nzGlow)"/>
  <rect x="16" y="16" width="388" height="488" rx="18" fill="none" stroke="url(#nzGold)" stroke-width="2" opacity=".7"/>
  <rect x="24" y="24" width="372" height="472" rx="13" fill="none" stroke="#e6c677" stroke-width="1" opacity=".28"/>

  <!-- Left fanned deck back (Navy & Gold) -->
  <g filter="url(#nzSh)" transform="translate(135 245) rotate(-18)">
    <rect x="-72" y="-108" width="144" height="216" rx="14" fill="url(#nzNavy)" stroke="url(#nzGold)" stroke-width="3"/>
    <rect x="-60" y="-96" width="120" height="192" rx="8" fill="none" stroke="#e6c677" stroke-width="1.4" opacity=".8"/>
    <rect x="-52" y="-88" width="104" height="176" rx="5" fill="none" stroke="#e6c677" stroke-width="1" stroke-dasharray="4 4" opacity=".45"/>
    <path d="M0 -42 C14 -16 26 -6 46 0 C26 6 14 16 0 42 C-14 16 -26 6 -46 0 C-26 -6 -14 -16 0 -42 Z" fill="none" stroke="url(#nzGold)" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="10" fill="url(#nzGold)" opacity=".9"/>
  </g>

  <!-- Right fanned deck back (Crimson & Gold) -->
  <g filter="url(#nzSh)" transform="translate(285 245) rotate(18)">
    <rect x="-72" y="-108" width="144" height="216" rx="14" fill="url(#nzCrimson)" stroke="url(#nzGold)" stroke-width="3"/>
    <rect x="-60" y="-96" width="120" height="192" rx="8" fill="none" stroke="#e6c677" stroke-width="1.4" opacity=".8"/>
    <rect x="-52" y="-88" width="104" height="176" rx="5" fill="none" stroke="#e6c677" stroke-width="1" stroke-dasharray="4 4" opacity=".45"/>
    <path d="M0 -42 C14 -16 26 -6 46 0 C26 6 14 16 0 42 C-14 16 -26 6 -46 0 C-26 -6 -14 -16 0 -42 Z" fill="none" stroke="url(#nzGold)" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="10" fill="url(#nzGold)" opacity=".9"/>
  </g>

  <!-- Center Ace of Spades card -->
  <g filter="url(#nzSh)" transform="translate(210 225)">
    <rect x="-76" y="-114" width="152" height="228" rx="14" fill="url(#nzIvory)" stroke="url(#nzGold)" stroke-width="3"/>
    <rect x="-66" y="-104" width="132" height="208" rx="9" fill="none" stroke="#c9a14a" stroke-width="1.2" opacity=".55"/>
    <text x="-54" y="-72" fill="#0f1b2d" font-family="Georgia, serif" font-weight="700" font-size="30">A</text>
    <text x="-53" y="-48" fill="#0f1b2d" font-family="Georgia, serif" font-size="22">♠</text>
    <text x="35" y="92" fill="#0f1b2d" font-family="Georgia, serif" font-weight="700" font-size="30">A</text>
    <!-- Ornate center spade -->
    <path d="M0 -48 C-6 -20 -38 2 -38 26 C-38 42 -26 52 -13 52 C-5 52 0 48 0 42 C0 48 5 52 13 52 C26 52 38 42 38 26 C38 2 6 -20 0 -48 Z" fill="#0f1b2d" stroke="url(#nzGold)" stroke-width="2.4"/>
    <path d="M0 36 C-2 52 -10 62 -20 68 L20 68 C10 62 2 52 0 36 Z" fill="#0f1b2d" stroke="url(#nzGold)" stroke-width="2"/>
    <circle cx="0" cy="14" r="7" fill="url(#nzGold)"/>
  </g>

  <!-- Top gold diamond accent -->
  <path d="M120 56 H196 M224 56 H300" stroke="url(#nzGold)" stroke-width="1.5" opacity=".7"/>
  <rect x="206" y="52" width="8" height="8" fill="url(#nzGold)" transform="rotate(45 210 56)"/>
</svg>

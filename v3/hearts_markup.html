<!-- TallyIt v23 — Hearts: Ivory & Crimson Ledger (#ht-shell) -->
<div id="ht-shell" class="ht-shell" aria-label="Hearts Score Ledger">
  <div class="ht-ledger-frame">
    <!-- Top playing-card corner suit pips (decorative) -->
    <div class="ht-corner-pips ht-corner-tl" aria-hidden="true">
      <svg viewBox="0 0 36 42" fill="none">
        <path d="M9 12.2C9 12.2 3.5 8.5 3.5 5.2A3 3 0 0 1 9 3.6a3 3 0 0 1 5.5 1.6c0 3.3-5.5 7-5.5 7Z" fill="#9A1B22"/>
        <path d="M25 12.2C25 12.2 19.5 8.5 19.5 5.2A3 3 0 0 1 25 3.6a3 3 0 0 1 5.5 1.6c0 3.3-5.5 7-5.5 7Z" fill="#9A1B22"/>
        <path d="M9 26.2C9 26.2 3.5 22.5 3.5 19.2A3 3 0 0 1 9 17.6a3 3 0 0 1 5.5 1.6c0 3.3-5.5 7-5.5 7Z" fill="#9A1B22"/>
        <path d="M25 26.2C25 26.2 19.5 22.5 19.5 19.2A3 3 0 0 1 25 17.6a3 3 0 0 1 5.5 1.6c0 3.3-5.5 7-5.5 7Z" fill="#9A1B22"/>
        <line x1="3" y1="31.5" x2="18" y2="31.5" stroke="#4F4A44" stroke-width="1.2"/>
        <line x1="3" y1="35" x2="14" y2="35" stroke="#4F4A44" stroke-width="1"/>
      </svg>
    </div>
    <div class="ht-corner-pips ht-corner-tr" aria-hidden="true">
      <svg viewBox="0 0 36 42" fill="none">
        <path d="M9 2.5C9 2.5 3.5 6.8 3.5 9.6A2.8 2.8 0 0 0 8.2 11.4L7.2 13.5h3.6l-1-2.1A2.8 2.8 0 0 0 14.5 9.6C14.5 6.8 9 2.5 9 2.5Z" fill="#23201D"/>
        <path d="M25 2.5C25 2.5 19.5 6.8 19.5 9.6A2.8 2.8 0 0 0 24.2 11.4l-1 2.1h3.6l-1-2.1A2.8 2.8 0 0 0 30.5 9.6C30.5 6.8 25 2.5 25 2.5Z" fill="#23201D"/>
        <path d="M9 16.5C9 16.5 3.5 20.8 3.5 23.6A2.8 2.8 0 0 0 8.2 25.4L7.2 27.5h3.6l-1-2.1A2.8 2.8 0 0 0 14.5 23.6C14.5 20.8 9 16.5 9 16.5Z" fill="#23201D"/>
        <path d="M25 16.5C25 16.5 19.5 20.8 19.5 23.6A2.8 2.8 0 0 0 24.2 25.4l-1 2.1h3.6l-1-2.1A2.8 2.8 0 0 0 30.5 23.6C30.5 20.8 25 16.5 25 16.5Z" fill="#23201D"/>
        <line x1="18" y1="31.5" x2="33" y2="31.5" stroke="#4F4A44" stroke-width="1.2"/>
        <line x1="22" y1="35" x2="33" y2="35" stroke="#4F4A44" stroke-width="1"/>
      </svg>
    </div>

    <!-- Top utility bar: Back/Home + Undo + Universal End Game -->
    <div class="ht-topbar">
      <button type="button" id="ht-btn-home" class="ht-top-btn" onclick="showView('new')" aria-label="Back to Play">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        <span>Play</span>
      </button>
      <div class="ht-top-actions">
        <button type="button" id="ht-btn-undo" class="ht-top-btn" onclick="window.HeartsUI && window.HeartsUI.undoHand()" aria-label="Undo last hand" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 14 4 9l5-5"/>
            <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>
          </svg>
          <span>Undo</span>
        </button>
        <button type="button" id="ht-btn-end" class="ht-top-btn ht-top-btn-end" onclick="window.openEndGameModal && openEndGameModal()" aria-label="End or pause game">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
            <line x1="4" y1="22" x2="4" y2="15"/>
          </svg>
          <span>End</span>
        </button>
      </div>
    </div>

    <!-- Ledger Header -->
    <header class="ht-header">
      <div class="ht-title-row">
        <svg class="ht-title-pip" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 14S2 9.8 2 5.6A3.4 3.4 0 0 1 8 3.5a3.4 3.4 0 0 1 6 2.1C14 9.8 8 14 8 14Z" fill="#9A1B22"/>
        </svg>
        <h1 class="ht-title">Hearts</h1>
        <svg class="ht-title-pip" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 14S2 9.8 2 5.6A3.4 3.4 0 0 1 8 3.5a3.4 3.4 0 0 1 6 2.1C14 9.8 8 14 8 14Z" fill="#9A1B22"/>
        </svg>
      </div>
      <div class="ht-ornament-rule" aria-hidden="true">
        <span class="ht-rule-line"></span>
        <span class="ht-rule-diamond"></span>
        <span class="ht-rule-line"></span>
      </div>
      <div class="ht-hand-row">
        <span class="ht-rule-diamond-sm" aria-hidden="true"></span>
        <span class="ht-rule-line-sm" aria-hidden="true"></span>
        <span id="ht-hand-label" class="ht-hand-label">Hand 1</span>
        <span class="ht-rule-line-sm" aria-hidden="true"></span>
        <span class="ht-rule-diamond-sm" aria-hidden="true"></span>
      </div>
    </header>

    <!-- Info boxes: Target Score & Pass Direction -->
    <section class="ht-meta-grid" aria-label="Hand information">
      <div class="ht-meta-box">
        <div class="ht-meta-kicker">
          <svg class="ht-meta-svg" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 14S2 9.8 2 5.6A3.4 3.4 0 0 1 8 3.5a3.4 3.4 0 0 1 6 2.1C14 9.8 8 14 8 14Z" fill="#9A1B22"/>
          </svg>
          <span>Target Score</span>
        </div>
        <div id="ht-target-score" class="ht-meta-val">100</div>
      </div>

      <div class="ht-meta-box">
        <div class="ht-meta-kicker">
          <svg class="ht-meta-svg" viewBox="0 0 24 24" fill="none" stroke="#9A1B22" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="7"/>
            <line x1="12" y1="2" x2="12" y2="6"/>
            <line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="2" y1="12" x2="6" y2="12"/>
            <line x1="18" y1="12" x2="22" y2="12"/>
            <circle cx="12" cy="12" r="2" fill="#9A1B22"/>
          </svg>
          <span>Pass Direction</span>
        </div>
        <div class="ht-meta-val ht-pass-val">
          <svg class="ht-pass-pip" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 14S2 9.8 2 5.6A3.4 3.4 0 0 1 8 3.5a3.4 3.4 0 0 1 6 2.1C14 9.8 8 14 8 14Z" fill="#23201D"/>
          </svg>
          <span id="ht-pass-dir">Left</span>
        </div>
      </div>
    </section>

    <!-- Live Hand Validation / Tally Strip (0/26 pts, Hearts 0/13, Q-Spades status) -->
    <div id="ht-hand-status" class="ht-status-bar" role="status" aria-live="polite">
      <span id="ht-hearts-tally" class="ht-status-chip">Hearts: 0 / 13</span>
      <span id="ht-qs-status" class="ht-status-chip">Q&#x2660;: Unassigned</span>
      <span id="ht-points-tally" class="ht-status-chip ht-status-total">Hand: 0 / 26</span>
    </div>

    <!-- Player Ledger Rows (rendered dynamically by Hearts engine) -->
    <section id="ht-player-rows" class="ht-player-rows" aria-label="Player scores and current hand entry"></section>

    <!-- Bottom Playing-Card Accent + Special Rules Panel -->
    <section class="ht-specials" aria-label="Special scoring controls">
      <!-- Vintage Queen of Spades Card Accent -->
      <div class="ht-card-emblem" aria-hidden="true">
        <svg viewBox="0 0 74 108" fill="none">
          <rect x="1.5" y="1.5" width="71" height="105" rx="6" fill="#FCF9F2" stroke="#5E5850" stroke-width="1.3"/>
          <rect x="6" y="6" width="62" height="96" rx="3.5" fill="none" stroke="#CBBFA8" stroke-width="0.9"/>
          <!-- Top-left Q & Spade -->
          <text x="10" y="19" fill="#1F1C18" font-family="Georgia,serif" font-size="13" font-weight="700">Q</text>
          <path d="M14.5 22.5C14.5 22.5 10.5 26 10.5 28.1a2.1 2.1 0 0 0 3.5 1.4l-.6 1.5h2.2l-.6-1.5a2.1 2.1 0 0 0 3.5-1.4c0-2.1-4-5.6-4-5.6Z" fill="#1F1C18"/>
          <!-- Center Royal Crown + Ornate Spade -->
          <path d="M23 41l4-8 5 5 5-7 5 7 5-5 4 8H23Z" fill="#C99A3E" stroke="#5A3E12" stroke-width="1"/>
          <rect x="23" y="42" width="28" height="3.2" rx="1" fill="#8C161E"/>
          <path d="M37 48.5C37 48.5 25 57.5 25 64.2a6.2 6.2 0 0 0 10.4 4.3L33.8 74h6.4l-1.6-5.5A6.2 6.2 0 0 0 49 64.2c0-6.7-12-15.7-12-15.7Z" fill="#1F1C18"/>
          <path d="M37 54.5c0 0-5.2 4.3-5.2 7.5a2.7 2.7 0 0 0 5.2 1.1 2.7 2.7 0 0 0 5.2-1.1c0-3.2-5.2-7.5-5.2-7.5Z" fill="#8C161E"/>
          <!-- Bottom-right inverted Q & Spade -->
          <g transform="rotate(180 37 54)">
            <text x="10" y="19" fill="#1F1C18" font-family="Georgia,serif" font-size="13" font-weight="700">Q</text>
            <path d="M14.5 22.5C14.5 22.5 10.5 26 10.5 28.1a2.1 2.1 0 0 0 3.5 1.4l-.6 1.5h2.2l-.6-1.5a2.1 2.1 0 0 0 3.5-1.4c0-2.1-4-5.6-4-5.6Z" fill="#1F1C18"/>
          </g>
        </svg>
      </div>

      <!-- Right Stacked Feature Cards -->
      <div class="ht-special-stack">
        <!-- Queen of Spades (+13) quick status / toggle -->
        <div class="ht-special-row">
          <div class="ht-special-card">
            <svg class="ht-sp-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 1.5C8 1.5 2.5 6.1 2.5 9.4A3.1 3.1 0 0 0 7.1 11.8L6.1 14.5h3.8l-1-2.7a3.1 3.1 0 0 0 4.6-2.4C13.5 6.1 8 1.5 8 1.5Z" fill="#1F1C18"/>
            </svg>
            <div class="ht-sp-text">
              <div class="ht-sp-title">Queen of Spades</div>
              <div id="ht-qs-holder" class="ht-sp-sub">(+13) Tap Q&#x2660; on a player row</div>
            </div>
          </div>
          <label class="ht-switch" aria-label="Toggle Queen of Spades for selected player">
            <input type="checkbox" id="ht-qs-toggle" onchange="window.HeartsUI && window.HeartsUI.toggleQueenForSelected(this.checked)">
            <span class="ht-switch-track"><span class="ht-switch-thumb"></span></span>
          </label>
        </div>

        <!-- Shoot the Moon callout / toggle -->
        <button type="button" id="ht-moon-btn" class="ht-special-card ht-moon-card" onclick="window.HeartsUI && window.HeartsUI.toggleShootMoon()" aria-pressed="false">
          <svg class="ht-sp-icon" viewBox="0 0 24 24" fill="none" stroke="#9A1B22" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="7"/>
            <line x1="12" y1="2" x2="12" y2="6"/>
            <line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="2" y1="12" x2="6" y2="12"/>
            <line x1="18" y1="12" x2="22" y2="12"/>
            <circle cx="12" cy="12" r="2" fill="#9A1B22"/>
          </svg>
          <div class="ht-sp-text">
            <div class="ht-sp-title">Shoot the Moon</div>
            <div id="ht-moon-sub" class="ht-sp-sub">(+26 to all others)</div>
          </div>
          <svg class="ht-moon-heart" viewBox="0 0 24 24" fill="none" stroke="#5A3A3A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20.5S4 15.2 4 9.6A4.6 4.6 0 0 1 12 6.8a4.6 4.6 0 0 1 8 2.8c0 5.6-8 10.9-8 10.9Z"/>
          </svg>
        </button>

        <!-- Optional Jack of Diamonds (-10) banner (hidden unless house rule active) -->
        <div id="ht-jd-banner" class="ht-jd-banner" hidden>
          <svg class="ht-sp-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 1.5 13.5 8 8 14.5 2.5 8 8 1.5Z" fill="#9A1B22"/>
          </svg>
          <span id="ht-jd-status">Jack of Diamonds (&minus;10) active &mdash; tap J&#x2666; on a player row</span>
        </div>
      </div>
    </section>

    <!-- Validation error notice (hidden when valid) -->
    <div id="ht-error-msg" class="ht-error-msg" role="alert" hidden></div>

    <!-- Primary Crimson CTA: Record Hand -->
    <div class="ht-cta-wrap">
      <button type="button" id="ht-btn-record" class="ht-cta-btn" onclick="window.HeartsUI && window.HeartsUI.recordHand()">
        <svg class="ht-sparkle" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1 9.8 6.2 15 8 9.8 9.8 8 15 6.2 9.8 1 8 6.2 6.2 8 1Z" fill="currentColor"/>
        </svg>
        <span>Record Hand</span>
        <svg class="ht-sparkle" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1 9.8 6.2 15 8 9.8 9.8 8 15 6.2 9.8 1 8 6.2 6.2 8 1Z" fill="currentColor"/>
        </svg>
      </button>
    </div>

    <!-- Collapsible Hand History Drawer -->
    <details id="ht-history-drawer" class="ht-history-drawer">
      <summary class="ht-history-summary">
        <span>Hand History</span>
        <span id="ht-history-count" class="ht-history-count">0 hands</span>
      </summary>
      <div id="ht-history-list" class="ht-history-list">
        <div class="ht-history-empty">No hands recorded yet.</div>
      </div>
    </details>

    <!-- Bottom Vintage Suit Ornament Footer -->
    <div class="ht-bottom-ornament" aria-hidden="true">
      <svg class="ht-foot-pip" viewBox="0 0 16 16"><path d="M8 14S2 9.8 2 5.6A3.4 3.4 0 0 1 8 3.5a3.4 3.4 0 0 1 6 2.1C14 9.8 8 14 8 14Z" fill="#9A1B22"/></svg>
      <span class="ht-foot-line"></span>
      <svg class="ht-foot-pip-center" viewBox="0 0 16 16"><path d="M8 14S2 9.8 2 5.6A3.4 3.4 0 0 1 8 3.5a3.4 3.4 0 0 1 6 2.1C14 9.8 8 14 8 14Z" fill="#9A1B22"/></svg>
      <span class="ht-foot-line"></span>
      <svg class="ht-foot-pip" viewBox="0 0 16 16"><path d="M8 1.5C8 1.5 2.5 6.1 2.5 9.4A3.1 3.1 0 0 0 7.1 11.8L6.1 14.5h3.8l-1-2.7a3.1 3.1 0 0 0 4.6-2.4C13.5 6.1 8 1.5 8 1.5Z" fill="#23201D"/></svg>
    </div>
  </div>
</div>

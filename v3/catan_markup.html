    <!-- Catan board: only visible with body.theme-catan (layout from the approved rendering) -->
    <div id="catan-board">
      <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="cg-star-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe7a0"/><stop offset=".45" stop-color="#e8b84a"/><stop offset="1" stop-color="#b07a1c"/></linearGradient>
          <linearGradient id="cg-star-hi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6cf" stop-opacity=".95"/><stop offset="1" stop-color="#fff6cf" stop-opacity="0"/></linearGradient>
          <symbol id="cg-star" viewBox="0 0 24 24"><path d="M12 1.6l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.7l-6.4 3.5 1.4-7.1-5.3-5 7.2-.9z" fill="url(#cg-star-fill)" stroke="#7a5214" stroke-width="1.1" stroke-linejoin="round"/><path d="M12 4.4l2.2 4.7 5.1.6L12 12z" fill="url(#cg-star-hi)"/><path d="M12 12l-6.6-2.3 5.1-.6L12 4.4z" fill="#fff3c4" opacity=".35"/></symbol>
          <symbol id="cg-crown" viewBox="0 0 24 24"><path d="M3 18h18l-1.6-10-4.6 4.2L12 5 9.2 12.2 4.6 8z" fill="url(#cg-star-fill)" stroke="#7a5214" stroke-width="1.1" stroke-linejoin="round"/><rect x="3" y="18.2" width="18" height="2.6" rx=".8" fill="#b07a1c" stroke="#7a5214" stroke-width=".8"/></symbol>
        </defs>
      </svg>

      <header class="cg-frame cg-header">
        <div class="cg-parch cg-header-card">
          <h1 class="cg-title" id="catan-title">Score Tracker</h1>
          <div class="cg-divider" aria-hidden="true"><span></span><i></i><span></span></div>
          <p class="cg-sub" id="catan-sub">FIRST TO 10 VICTORY POINTS</p>
        </div>
      </header>

      <section class="cg-frame cg-board" aria-label="Victory points leaderboard">
        <div class="cg-ribbon"><span>Victory Points</span></div>
        <div class="cg-parch cg-leader-card">
          <div id="leaderboard" role="listbox" aria-label="Players"></div>
        </div>
      </section>

      <section class="cg-frame cg-adjust" id="pad" aria-label="Adjust victory points">
        <div class="cg-parch cg-adjust-card">
          <div class="cg-adjust-title">Adjust Victory Points</div>
          <div class="cg-adjust-row">
            <span class="cg-orn" aria-hidden="true"></span>
            <button type="button" class="cg-wood-btn" id="catan-minus" onclick="catanStep(-1)" aria-label="Subtract 1 VP">−</button>
            <div id="adj-val" class="cg-adj-val" aria-live="polite">0</div>
            <button type="button" class="cg-wood-btn" id="catan-plus" onclick="catanStep(1)" aria-label="Add 1 VP">+</button>
            <span class="cg-orn cg-orn-r" aria-hidden="true"></span>
          </div>
          <div class="cg-selected" id="pad-player-banner">Selected: —</div>
        </div>
      </section>

      <section class="cg-frame cg-actions" aria-label="Score a category">
        <div id="score-form" class="cg-action-list"></div>
      </section>

      <section class="cg-frame cg-footer">
        <button type="button" class="cg-reset" id="btn-reset-scores" onclick="resetCatanScores()"><span class="cg-reset-ic" aria-hidden="true">↻</span>Reset Scores</button>
        <div class="cg-footer-row">
          <button type="button" class="cg-wood-bar" id="btn-undo" onclick="undoLastRound()">Undo</button>
          <button type="button" class="cg-wood-bar cg-gold" id="btn-save-catan" onclick="endGame()">Save Game</button>
        </div>
      </section>
      <div id="cg-toast" class="cg-toast" role="status" aria-live="polite"></div>
    </div>

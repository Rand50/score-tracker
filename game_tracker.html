<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Score Tracker</title>
<style>
body { font-family: system-ui, sans-serif; background: #0b1220; color: #f1f5f9; margin: 0; }
.card { background: #151c2c; margin: 2rem auto; padding: 2rem; border-radius: 16px; max-width: 400px; text-align: center; }
.btn { padding: 0.8rem 1.5rem; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; width: 100%; margin: 0.5rem 0; }
.btn.google { background: white; color: #333; }
.btn.primary { background: #22d3ee; color: #0b1220; }
input { width: 100%; padding: 0.7rem; border-radius: 10px; border: 1px solid #333; background: #0b1220; color: white; }
.hidden { display: none; }
</style>
</head>
<body>
<div id="login-view" class="card">
  <h1>Score Tracker</h1>
  <p>Sign in to sync your games</p>
  <button class="btn google" onclick="signInWithGoogle()">Continue with Google</button>
  <input type="email" id="email" placeholder="Or enter email">
  <button class="btn primary" onclick="signInWithEmail()">Send magic link</button>
  <p id="login-msg"></p>
</div>

<div id="app-view" class="hidden">
  <header style="padding:1rem; display:flex; justify-content:space-between;">
    <h1>Score Tracker</h1>
    <button class="btn" onclick="signOut()">Sign out</button>
  </header>
  <div class="card">
    <h2>You're signed in</h2>
    <p>Game tracking UI will appear here once fully restored.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://lezfdnqqfejqyxqwlcfg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_HEGO45Fw5dl1s8sAbFnSkg_VzWU_guj';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('app-view').classList.remove('hidden');
  }
}

async function signInWithGoogle() {
  await sb.auth.signInWithOAuth({ provider: 'google' });
}

async function signInWithEmail() {
  const email = document.getElementById('email').value;
  const { error } = await sb.auth.signInWithOtp({ email });
  document.getElementById('login-msg').textContent = error ? error.message : 'Check your email';
}

async function signOut() {
  await sb.auth.signOut();
  location.reload();
}

checkSession();
sb.auth.onAuthStateChange(() => checkSession());
</script>
</body>
</html>

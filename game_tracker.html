<!-- ===================== NEUTRAL (GAME-AGNOSTIC) THEME ===================== -->
<style id="neutral-theme">
:root {
  --bg: #0b1220; --surface: #151c2c; --surface2: #1e293b; --text: #f1f5f9; --muted: #94a3b8;
  --accent: #22d3ee; --accent-dim: #0891b2; --success: #34d399; --danger: #f43f5e;
  --border: rgba(255,255,255,0.08); --radius: 16px; --shadow: 0 10px 30px rgba(0,0,0,0.4);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.hidden, [hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
body:not(:has(#app-shell[hidden])) { padding-bottom: 84px; }

/* ---------- Login (neutral navy) ---------- */
#login-view { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; padding: 1.5rem 1rem; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 20%, rgba(34,211,238,0.14), transparent 60%), linear-gradient(180deg, #0f172a 0%, var(--bg) 60%, #070c16 100%); }
#login-view:not([hidden]):not(.auth-hidden) { display: flex; }
#login-view[hidden], #login-view.auth-hidden, #app-shell[hidden], #app-shell.auth-hidden, .auth-hidden { display: none !important; }
.auth-card { width: 100%; max-width: 390px; background: var(--surface); border: 1px solid rgba(148,163,184,0.18); border-radius: 18px; padding: 1.9rem 1.5rem 1.5rem; box-shadow: 0 20px 45px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04); }
.auth-crest { width: 54px; height: 54px; margin: 0 auto 0.8rem; border-radius: 16px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(145deg, var(--accent), var(--accent-dim)); box-shadow: 0 6px 18px rgba(34,211,238,0.3); user-select: none; }
.auth-title { margin: 0; text-align: center; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.4px; color: var(--text); }
.auth-subtitle { margin: 0.35rem 0 1.4rem; text-align: center; font-size: 0.74rem; font-weight: 600; letter-spacing: 1.8px; text-transform: uppercase; color: var(--muted); }
.auth-btn { width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 0.8rem 1rem; border-radius: 12px; font: 600 0.98rem var(--font); cursor: pointer; transition: transform .08s ease, filter .15s ease, opacity .15s ease; }
.auth-btn:active:not(:disabled) { transform: translateY(1px); }
.auth-btn:disabled { opacity: .6; cursor: not-allowed; }
.auth-btn-google { background: #fff; color: #1f2937; border: 1px solid #e2e8f0; box-shadow: 0 2px 6px rgba(0,0,0,0.25); }
.auth-btn-google:hover:not(:disabled) { filter: brightness(0.97); }
.auth-btn-primary { margin-top: 0.7rem; border: none; color: #0b1220; background: linear-gradient(135deg, var(--accent), var(--accent-dim)); box-shadow: 0 4px 14px rgba(34,211,238,0.25); }
.auth-btn-primary:hover:not(:disabled) { filter: brightness(1.06); }
.auth-divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.15rem 0; color: var(--muted); font-size: 0.74rem; letter-spacing: 1.5px; text-transform: uppercase; }
.auth-divider::before, .auth-divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(148,163,184,0.35), transparent); }
.auth-label { display: block; font-size: 0.76rem; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
#login-view .auth-input { width: 100%; padding: 0.75rem 0.85rem; border: 1px solid rgba(148,163,184,0.25); border-radius: 12px; background: var(--bg); color: var(--text); font: 0.98rem var(--font); outline: none; }
#login-view .auth-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34,211,238,0.18); }
#login-msg { min-height: 1.25rem; margin: 0.9rem 0 0; text-align: center; font-size: 0.85rem; line-height: 1.35; color: var(--muted); }
#login-msg[data-tone="error"] { color: var(--danger); }
#login-msg[data-tone="success"] { color: var(--success); }

/* ---------- App shell (neutral navy) ---------- */
#app-shell { position: relative; z-index: 1; }
.app-header { padding: 1.1rem 1.1rem 0.6rem; display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto; }
.app-header h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
.view { display: none; padding: 0 1rem 1rem; max-width: 900px; margin: 0 auto; }
.view.active { display: block; }
.card { background: var(--surface); border-radius: var(--radius); padding: 1.2rem; margin-bottom: 1rem; border: 1px solid var(--border); box-shadow: var(--shadow); }
.card h2 { margin: 0 0 .6rem; font-size: 1.25rem; }
.card h3 { margin: 0 0 .5rem; font-size: 1rem; }
.btn { background: var(--surface2); color: var(--text); border: 1px solid var(--border); padding: 0.7rem 1.2rem; border-radius: 12px; font: 600 0.98rem var(--font); cursor: pointer; transition: transform .1s, filter .15s; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-dim)); color: #0b1220; border: none; }
.btn.success { background: var(--success); color: #0b1220; border: none; }
.btn.danger { background: var(--danger); color: #fff; border: none; }
.btn.sm { padding: 0.4rem 0.75rem; font-size: 0.85rem; }
.btn.block { width: 100%; }
input, select, textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.7rem; border-radius: 10px; width: 100%; font: 1rem var(--font); }
input[type="checkbox"] { width: auto; accent-color: var(--accent); }
label.small, .field-label { display: block; margin: 0.7rem 0 0.3rem; color: var(--muted); font-size: 0.85rem; }
.small { color: var(--muted); font-size: .85rem; }
.flex { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.space-between { justify-content: space-between; }
.hero { text-align: center; padding: 1.6rem 1rem; }
.hero .emoji { font-size: 3rem; margin-bottom: .4rem; }
.hero h2 { margin: 0 0 .35rem; }
.hero p { margin: 0 0 1.1rem; }
.hero .btn { width: 100%; max-width: 280px; padding: 0.95rem; }
#sync-status { margin: .6rem 0 0; font-size: .78rem; color: var(--muted); }
#sync-status[data-state="error"] { color: var(--danger); }
.recent-item { padding: .6rem 0; border-bottom: 1px solid var(--border); }
.recent-item:last-child { border-bottom: none; }

/* Choose game */
.game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.7rem; margin: 0.8rem 0 0.4rem; }
.game-card { position: relative; height: 150px; border-radius: 14px; overflow: hidden; cursor: pointer; background-color: var(--surface2); background-size: contain; background-repeat: no-repeat; background-position: center top; border: 2px solid transparent; transition: transform .15s, border-color .15s; }
.game-card:hover { transform: translateY(-2px); }
.game-card.selected { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34,211,238,0.2); }
.game-card .game-icon { position: absolute; inset: 0 0 34px 0; display: flex; align-items: center; justify-content: center; font-size: 2.6rem; color: var(--accent); }
.game-card .overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,.88)); padding: 1.1rem .5rem .55rem; color: #fff; font-weight: 600; font-size: .9rem; text-align: center; }
.player-list { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0; }
.player-chip { background: var(--surface2); padding: .4rem .7rem; border-radius: 20px; display: inline-flex; align-items: center; gap: .45rem; font-size: .92rem; border: 1px solid var(--border); }
.player-chip .chip-remove { background: none; border: none; color: var(--danger); font-size: 1.05rem; cursor: pointer; padding: 0 .1rem; line-height: 1; }

/* Generic active game */
.active-head { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }
.active-head h2 { margin: 0; }
.player-row { background: var(--surface2); border-radius: 14px; padding: 0.85rem 1rem; margin: 0.45rem 0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid transparent; }
.player-row.selected { border-color: var(--accent); }
.player-row.leader .p-score { color: var(--success); }
.rank { width: 28px; font-weight: 700; color: var(--muted); }
.p-score { font-size: 1.45rem; font-weight: 700; color: var(--accent); }
#gen-pad { margin-top: .9rem; padding-top: .9rem; border-top: 1px solid var(--border); }
.mode-toggle-n { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; margin: .5rem 0 .8rem; }
.mode-toggle-n button.active { background: var(--accent); color: #0b1220; border-color: var(--accent); }
.key { border-radius: 10px; padding: 0.8rem 0.3rem; text-align: center; font-weight: 700; font-size: 1.1rem; cursor: pointer; border: 1px solid #334155; color: #fff; user-select: none; }
.key.active { outline: 3px solid var(--accent); outline-offset: 1px; }
.key-grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 8px; }
.key-grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 10px; }
.form-row { display: flex; align-items: center; gap: .6rem; margin: .35rem 0; }
.form-row > span { flex: 1; }
.form-row input[type="number"] { width: 90px; flex: 0 0 90px; }
.preview { margin: .6rem 0; font-weight: 600; color: var(--accent); }
.action-bar { display: flex; gap: .5rem; margin-top: 1rem; }
.action-bar .btn { flex: 1; }

/* History */
.history-item { padding: .85rem 0; border-bottom: 1px solid var(--border); }
.history-item:last-child { border-bottom: none; }
.history-item .winner { color: var(--success); font-size: .85rem; }

/* Bottom nav (always neutral) */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; display: flex; justify-content: space-around;

/* Catan board is only shown when theme-catan is on */
#catan-board { display: none; }
body.theme-catan #catan-board { display: block; }

<!-- Login: starts hidden until getSession() resolves -->
<section id="login-view" class="auth-hidden" hidden aria-label="Sign in to Score Tracker">
  <div class="auth-card">
    <div class="auth-crest" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="4.5" fill="#0b1220" opacity=".9"/><circle cx="8" cy="8" r="1.6" fill="#22d3ee"/><circle cx="16" cy="8" r="1.6" fill="#22d3ee"/><circle cx="12" cy="12" r="1.6" fill="#22d3ee"/><circle cx="8" cy="16" r="1.6" fill="#22d3ee"/><circle cx="16" cy="16" r="1.6" fill="#22d3ee"/></svg>
    </div>
    <h1 class="auth-title">Score Tracker</h1>
    <p class="auth-subtitle">Sign in to sync your games</p>
    <button id="btn-google-signin" type="button" class="auth-btn auth-btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.96 10.71A5.41 5.41 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.04l3-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      <span>Continue with Google</span>
    </button>
    <div class="auth-divider"><span>or</span></div>
    <form id="magic-link-form" novalidate>
      <label class="auth-label" for="email">Email magic link</label>
      <input id="email" class="auth-input" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required>
      <button id="btn-email-signin" type="submit" class="auth-btn auth-btn-primary">Send magic link</button>
    </form>
    <p id="login-msg" role="status" aria-live="polite"></p>
  </div>
</section>

<div id="app-shell" class="hidden auth-hidden" hidden>
  <header class="app-header">
    <h1>Score Tracker</h1>
    <button class="btn sm" type="button" onclick="signOut()">Sign out</button>
  </header>

  <!-- HOME -->
  <section id="view-home" class="view">
    <div class="card hero">
      <div class="emoji" aria-hidden="true">🎲</div>
      <h2>Ready to play?</h2>
      <p class="small">Track scores live for any game night.</p>
      <button class="btn primary" type="button" onclick="showView('new')">Start a Game</button>
      <div><button id="btn-resume-game" class="btn hidden" type="button" style="margin-top:.6rem" hidden onclick="showView('active')">Resume Active Game</button></div>
      <p id="sync-status" role="status" aria-live="polite"></p>
    </div>
    <div class="card"><h3>Recent</h3><div id="recent-list"></div></div>
  </section>

  <!-- CHOOSE GAME -->
  <section id="view-new" class="view">
    <div class="card">
      <h2>Choose Game</h2>
      <div class="game-grid" id="game-grid"></div>
      <label class="small" for="version-select">Version / Scoring rules</label>
      <select id="version-select"></select>
      <h3 style="margin-top:1.1rem">Players</h3>
      <div class="player-list" id="player-chips"></div>
      <div class="flex" style="flex-wrap:nowrap">
        <input type="text" id="new-player-name" placeholder="Add player" autocomplete="off" style="flex:1">
        <button class="btn" type="button" id="btn-add-player" onclick="addPlayer()">+</button>
      </div>
      <button class="btn primary block" type="button" id="btn-start-game" style="margin-top:1.2rem" onclick="startGame()">Start Playing</button>
    </div>
  </section>

  <!-- ACTIVE GAME -->
  <section id="view-active" class="view">
    <!-- Neutral board for every game except Catan -->
    <div id="generic-board" class="card">
      <div class="active-head">
        <div><h2 id="gen-title"></h2><div id="gen-sub" class="small"></div></div>
        <button class="btn sm" type="button" title="Discard game" onclick="discardGame()">✕</button>
      </div>
      <div id="gen-leaderboard" style="margin-top:.7rem"></div>
      <p class="small" style="margin:.3rem 0 0;text-align:center">Tap a player to score</p>
      <div id="gen-pad" class="hidden"></div>
      <div class="action-bar">
        <button class="btn hidden" id="gen-undo" type="button" hidden onclick="undoLastRound()">Undo</button>
        <button class="btn success" id="gen-save" type="button" onclick="endGame()">Save Game</button>
      </div>
    </div>

    <!-- Catan board: only visible with body.theme-catan -->
    <div id="catan-board">
      <div class="parchment parchment-header">
        <h1 class="header-title" id="catan-title">Catan</h1>
        <p class="header-sub" id="catan-sub">FIRST TO 10 VICTORY POINTS</p>
      </div>
      <div class="parchment">
        <div class="section-title">Victory Points</div>
        <div id="leaderboard"></div>
        <p class="leaderboard-hint">Tap a player to adjust their Victory Points</p>
      </div>
      <div class="parchment" id="pad" style="display:none">
        <div class="section-title">Adjust Victory Points</div>
        <div id="pad-player-banner" class="pad-player-banner"></div>
        <div class="mode-toggle" role="tablist" aria-label="Scoring Mode">
          <button id="mode-simple" type="button" class="active" role="tab" aria-selected="true" onclick="setCatanMode('simple')">Simple</button>
          <button id="mode-detailed" type="button" role="tab" aria-selected="false" onclick="setCatanMode('detailed')">Detailed</button>
        </div>
        <div id="score-form"></div>
      </div>
      <div class="action-row">
        <button id="btn-undo" type="button" class="btn secondary btn-undo hidden" hidden onclick="undoLastRound()">Undo</button>
        <button id="btn-save-catan" type="button" class="btn" onclick="endGame()">Save Game</button>
      </div>
    </div>
  </section>

  <!-- HISTORY -->
  <section id="view-history" class="view">
    <div class="card"><h2>History</h2><div id="history-list"></div></div>
  </section>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button type="button" id="nav-home" onclick="showView('home')"><span class="icon">🏠</span>Home</button>
    <button type="button" id="nav-new" onclick="showView('new')"><span class="icon">➕</span>Play</button>
    <button type="button" id="nav-history" onclick="showView('history')"><span class="icon">📜</span>History</button>
    <button type="button" id="nav-signout" onclick="signOut()"><span class="icon">⎋</span>Exit</button>
  </nav>
</div>

<!-- Catan render helpers (window.ScoreTrackerUI) -->
<script>
window.ScoreTrackerUI = (function () {
  const SHIELD_COLORS = ['#b52b27', '#2b6cb0', '#2f7a4d', '#d48a1c', '#76418c', '#8c5230'];

  const CATEGORIES = [
    { key: 'settlement', label: 'Settlements',  vp: 1, iconClass: 'cat-icon--settlement' },
    { key: 'city',       label: 'Cities',       vp: 2, iconClass: 'cat-icon--city' },
    { key: 'road',       label: 'Longest Road', vp: 2, iconClass: 'cat-icon--road' },
    { key: 'army',       label: 'Largest Army', vp: 2, iconClass: 'cat-icon--army' },
    { key: 'vpcard',     label: 'VP Card',      vp: 1, iconClass: 'cat-icon--vpcard' }
  ];

  function escapeHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function shieldColor(idx) {
    return SHIELD_COLORS[idx % SHIELD_COLORS.length];
  }

  function shieldSvg(idx, name) {
    const color = shieldColor(idx);
    const initial = escapeHtml((name || '?').trim().charAt(0).toUpperCase());
    return `
      <svg width="34" height="38" viewBox="0 0 34 38" fill="none" aria-hidden="true">
        <path d="M17 2L31 7V18.5C31 27.2 24.8 33.4 17 36C9.2 33.4 3 27.2 3 18.5V7L17 2Z"
              fill="${color}" stroke="#d9a834" stroke-width="2.2"/>
        <path d="M17 5.2L27.8 9.2V18.3C27.8 25.1 23 30.1 17 32.3C11 30.1 6.2 25.1 6.2 18.3V9.2L17 5.2Z"
              fill="none" stroke="rgba(255,244,210,0.42)" stroke-width="1"/>
        <text x="17" y="23" text-anchor="middle" fill="#fdf6e4"
              font-family="Cinzel, Georgia, serif" font-size="13" font-weight="700">${initial}</text>
      </svg>
    `;
  }

  function crownSvg() {
    return `
      <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M3 18h18v2H3v-2zm0-2l2-9 5 4 2-6 2 6 5-4 2 9H3z"/>
      </svg>
    `;
  }

  function categoryIconSvg(key) {
    switch (key) {
      case 'settlement':
        return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fdf6e4" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 11l8-7 8 7v9H4v-9z" fill="rgba(255,245,220,0.22)"/>
          <path d="M10 20v-5h4v5"/>
        </svg>`;
      case 'city':
        return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fdf6e4" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 20V11l4-3 4 3v9H3z" fill="rgba(255,245,220,0.22)"/>
          <path d="M11 20V6l5-2 5 2v14H11z" fill="rgba(255,245,220,0.28)"/>
          <path d="M15 10h2M15 14h2"/>
        </svg>`;
      case 'road':
        return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fdf6e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19c2-5 5-6 8-7s6-2 8-7"/>
          <path d="M9 19c1.5-3.5 3.5-4.3 6-5.2"/>
          <circle cx="5" cy="18" r="1.5" fill="#fdf6e4"/>
          <circle cx="19" cy="6" r="1.5" fill="#fdf6e4"/>
        </svg>`;
      case 'army':
        return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fdf6e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 18L18 6M15 6h3v3"/>
          <path d="M18 18L6 6M9 6H6v3"/>
          <path d="M8 16l-2 2M16 16l2 2"/>
        </svg>`;
      case 'vpcard':
      default:
        return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fdf6e4" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="3" width="14" height="18" rx="2" fill="rgba(255,245,220,0.22)"/>
          <path d="M12 7.5l1.3 2.7 3 .4-2.2 2 .5 3-2.6-1.4-2.6 1.4.5-3-2.2-2 3-.4L12 7.5z" fill="#fdf6e4" stroke="none"/>
        </svg>`;
    }
  }

  function starsHtml(score, maxStars) {
    const max = maxStars || 10;
    const filled = Math.max(0, Math.min(Number(score) || 0, max));
    let out = '';
    for (let i = 0; i < max; i++) {
      out += i < filled
        ? '<span class="star-filled" aria-hidden="true">★</span>'
        : '<span class="star-empty" aria-hidden="true">☆</span>';
    }
    return `<div class="stars" aria-label="${filled} of ${max} victory points">${out}</div>`;
  }

  function renderLeaderboardRow(player, idx, isSelected) {
    const score = Number(player.score) || 0;
    const isWinner = score >= 10;
    const cls = ['player-row', isSelected ? 'selected' : '', isWinner ? 'winner' : ''].filter(Boolean).join(' ');
    return `
      <div class="${cls}" onclick="openPad(${idx})" role="button" tabindex="0">
        <div class="shield-wrap">${shieldSvg(idx, player.name)}</div>
        <div class="player-meta">
          <div class="player-name-line">
            <span class="player-name">${escapeHtml(player.name)}</span>
            ${isWinner ? `<span class="winner-badge">${crownSvg()} Winner</span>` : ''}
          </div>
          ${starsHtml(score, 10)}
        </div>
        <div class="vp-badge">
          <div class="vp-num">${score}</div>
          <div class="vp-label">VP</div>
        </div>
      </div>
    `;
  }

  function renderSimplePad(playerName, adjVal) {
    const val = Number(adjVal) || 1;
    const sign = val > 0 ? '+' : '';
    return `
      <div class="adj-box">
        <button type="button" class="adj-btn" onclick="adj(-1)" aria-label="Decrease points">−</button>
        <div id="adj-val">${sign}${val}</div>
        <button type="button" class="adj-btn" onclick="adj(1)" aria-label="Increase points">+</button>
      </div>
      <button type="button" class="btn gold" onclick="commitSimple()">Apply to ${escapeHtml(playerName)}</button>
    `;
  }

  function renderDetailedPad(playerName, counts, roundTotal) {
    const c = counts || {};
    const rows = CATEGORIES.map(cat => {
      const qty = Number(c[cat.key]) || 0;
      return `
        <div class="cat-row ${qty > 0 ? 'has-count' : ''}" onclick="addCat('${cat.key}', ${cat.vp})">
          <div class="cat-icon ${cat.iconClass}">${categoryIconSvg(cat.key)}</div>
          <div class="cat-info">
            <div class="cat-name">${cat.label}</div>
            <div class="cat-vp">+${cat.vp} VP</div>
          </div>
          <div class="cat-right">
            ${qty > 0 ? `<button type="button" class="cat-step-btn" onclick="event.stopPropagation(); addCat('${cat.key}', -${cat.vp})" aria-label="Remove ${cat.label}">−</button>` : ''}
            <span class="cat-count">${qty > 0 ? qty : ''}</span>
            <button type="button" class="cat-step-btn" onclick="event.stopPropagation(); addCat('${cat.key}', ${cat.vp})" aria-label="Add ${cat.label}">+</button>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="cat-list">${rows}</div>
      <div class="round-summary">
        <div id="round-total">Round Total: +${Number(roundTotal) || 0} VP</div>
        <button type="button" class="btn-link-reset" onclick="resetDetailed && resetDetailed()">Reset</button>
      </div>
      <button type="button" class="btn gold" onclick="commitDetailed()">Add to ${escapeHtml(playerName)}</button>
    `;
  }

  function renderPlayerChip(name, idx) {
    return `
      <span class="player-chip">
        <span class="player-chip-dot" style="background:${shieldColor(idx)}"></span>
        <span>${escapeHtml(name)}</span>
        <button type="button" class="player-chip-remove" onclick="removePlayer && removePlayer(${idx})" aria-label="Remove ${escapeHtml(name)}">×</button>
      </span>
    `;
  }

  function renderHistoryCard(game) {
    const dt = game.endTime ? new Date(game.endTime).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
    const sorted = [...(game.players || [])].sort((a, b) => (b.score || 0) - (a.score || 0));
    const topScore = sorted.length ? (sorted[0].score || 0) : 0;
    const pills = sorted.map(p => {
      const win = (p.score || 0) === topScore && topScore > 0;
      return `<span class="history-score-pill ${win ? 'winner' : ''}">${win ? '👑 ' : ''}${escapeHtml(p.name)}: ${p.score || 0} VP</span>`;
    }).join('');
    return `
      <div class="history-card">
        <div class="history-card-top">
          <span class="history-game-type">${escapeHtml(game.type || 'Catan')}</span>
          <span class="history-date">${escapeHtml(dt)}</span>
        </div>
        <div class="history-scores">${pills}</div>
      </div>
    `;
  }

  return {
    SHIELD_COLORS,
    CATEGORIES,
    escapeHtml,
    shieldColor,
    shieldSvg,
    crownSvg,
    categoryIconSvg,
    starsHtml,
    renderLeaderboardRow,
    renderSimplePad,
    renderDetailedPad,
    renderPlayerChip,
    renderHistoryCard
  };
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- App engine: defines window.onAuthReady / window.onAuthSignedOut before auth init -->
<script id="score-engine">
/* Score Tracker engine — game-agnostic shell, per-game scoring, Catan-only parchment theme. */
(function (global) {
  'use strict';

  const KEY_ACTIVE = 'gst_active';
  const KEY_CACHE = 'gst_cache';

  // ---------------- Games ----------------
  const GAMES = [
    { id: 'flip7', name: 'Flip 7', img: 'flip7.jpg', icon: '🃏',
      versions: ['Standard (to 200)', 'With a Vengeance', 'Thematic / Promo'],
      target: () => 200, detailedLabel: 'Card Pad' },
    { id: '7wonders', name: '7 Wonders', img: '7wonders.jpg', icon: '🏛️',
      versions: ['Base (1st/2nd Ed)', 'With Leaders', 'With Cities', 'With Armada', 'Other expansion'],
      target: () => null, detailedLabel: 'Categories' },
    { id: 'carcassonne', name: 'Carcassonne', img: '', icon: '🏰',
      versions: ['Classic (current scoring)', 'Older edition (small cities)', 'With Inns & Cathedrals', 'With other expansions'],
      target: () => null, detailedLabel: 'Features' },
    { id: 'catan', name: 'Catan', img: '', icon: '⬢',
      versions: ['Base (to 10 VP)', 'Cities & Knights (to 13 VP)', 'Seafarers (to 12 VP)', '5-6 Player (to 10 VP)'],
      target: (v) => { const m = /to (\d+)/i.exec(v || ''); return m ? Number(m[1]) : 10; } },
    { id: 'ohhell', name: 'Oh Hell', img: 'ohhell.jpg', icon: '♠️',
      versions: ['Exact: 10+bid (miss=0)', '1 per trick +10 if exact', 'Other variant'],
      target: () => null, detailedLabel: 'Bid & Tricks' },
    { id: 'hearts', name: 'Hearts', img: '', icon: '♥️', low: true,
      versions: ['Standard (to 100)', 'Short (to 50)', 'With Jack of Diamonds'],
      target: (v) => (/50/.test(v || '') ? 50 : 100), detailedLabel: 'Hand' },
    { id: 'nertz', name: 'Nertz', img: 'nertz.png', icon: '🂠',
      versions: ['Standard (+1/-2, optional bonus)', 'To 100', 'To 150', 'No bonus for calling'],
      target: (v) => (/150/.test(v || '') ? 150 : 100), detailedLabel: 'Round' },
    { id: 'other', name: 'Custom', img: '', icon: '✏️',
      versions: ['Custom rules'], target: () => null, detailedLabel: null }
  ];
  const gameById = (id) => GAMES.find((g) => g.id === id) || GAMES[GAMES.length - 1];

  const FLIP7_COLORS = {
    0: '#1a1a1a', 1: '#4a90d9', 2: '#f4d03f', 3: '#e74c3c', 4: '#27ae60', 5: '#2ecc71', 6: '#8e44ad',
    7: '#e67e22', 8: '#16a085', 9: '#d35400', 10: '#c0392b', 11: '#2c3e50', 12: '#7f8c8d'
  };

  const CATAN_CATS = [
    { key: 'settlements', label: 'Settlements',  vp: 1, max: 5, ui: 'settlement', icon: 'cat-icon--settlement' },
    { key: 'cities',      label: 'Cities',       vp: 2, max: 4, ui: 'city',       icon: 'cat-icon--city' },
    { key: 'longestRoad', label: 'Longest Road', vp: 2, max: 1, ui: 'road',       icon: 'cat-icon--road' },
    { key: 'largestArmy', label: 'Largest Army', vp: 2, max: 1, ui: 'army',       icon: 'cat-icon--army' },
    { key: 'vpCards',     label: 'VP Card',      vp: 1, max: 5, ui: 'vpcard',     icon: 'cat-icon--vpcard' }
  ];
  const emptyBreakdown = () => ({ settlements: 0, cities: 0, longestRoad: 0, largestArmy: 0, vpCards: 0 });
  const catanTotal = (d) => CATAN_CATS.reduce((s, c) => s + (Number(d[c.key]) || 0) * c.vp, 0);

  // ---------------- State ----------------
  let currentUser = null, initializedUserId = null;
  let players = [], history = [], pendingSync = false, syncInFlight = false;
  let currentGame = null, currentView = 'home';
  let selectedGame = 'flip7', selectedVersion = null;
  const deselected = new Set();
  let scoringPlayer = null, padMode = 'simple';
  let catanAdj = 1, catanDraft = emptyBreakdown();
  let flip = null;

  // ---------------- Utils ----------------
  const byId = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const num = (id) => { const el = byId(id); return el ? (Number(el.value) || 0) : 0; };
  const checked = (id) => { const el = byId(id); return !!(el && el.checked); };
  const signed = (n) => (n > 0 ? '+' + n : String(n));
  function setHidden(el, hide) { if (!el) return; el.hidden = !!hide; el.classList.toggle('hidden', !!hide); }
  const isCatan = () => !!(currentGame && currentGame.type === 'catan');

  // ---------------- Persistence ----------------
  function persistActive() {
    try { currentGame ? localStorage.setItem(KEY_ACTIVE, JSON.stringify(currentGame)) : localStorage.removeItem(KEY_ACTIVE); }
    catch (e) { console.warn('[tracker] persist failed', e); }
  }
  function loadActive() {
    try {
      const raw = localStorage.getItem(KEY_ACTIVE);
      if (!raw) return null;
      const g = JSON.parse(raw);
      if (!g || !Array.isArray(g.players)) return null;
      g.rounds = Array.isArray(g.rounds) ? g.rounds : [];
      g.players.forEach((p) => { p.score = Number(p.score) || 0; if (g.type === 'catan') p.breakdown = { ...emptyBreakdown(), ...(p.breakdown || {}) }; });
      if (g.type === 'catan' && !g.targetVp) g.targetVp = gameById('catan').target(g.version);
      return g;
    } catch (_) { return null; }
  }
  function saveCache(pending) {
    if (typeof pending === 'boolean') pendingSync = pending;
    try {
      localStorage.setItem(KEY_CACHE, JSON.stringify({ userId: currentUser ? currentUser.id : null, players, history, pendingSync, updatedAt: new Date().toISOString() }));
    } catch (e) { console.warn('[tracker] cache failed', e); }
  }
  function loadCache(userId) {
    try {
      const c = JSON.parse(localStorage.getItem(KEY_CACHE) || 'null');
      if (!c || (c.userId && userId && c.userId !== userId)) return null;
      return { players: Array.isArray(c.players) ? c.players : [], history: Array.isArray(c.history) ? c.history : [], pendingSync: !!c.pendingSync };
    } catch (_) { return null; }
  }
  function mergePlayers(a, b) {
    const seen = new Set(), out = [];
    [...(a || []), ...(b || [])].forEach((n) => { n = String(n || '').trim(); if (n && !seen.has(n.toLowerCase())) { seen.add(n.toLowerCase()); out.push(n); } });
    return out;
  }
  function mergeHistory(local, remote) {
    const map = new Map(), k = (g) => g && (g.id || g.endTime || JSON.stringify(g));
    (remote || []).forEach((g) => g && map.set(k(g), g));
    (local || []).forEach((g) => g && map.set(k(g), g));
    return [...map.values()].sort((a, b) => (Date.parse(b.endTime || b.startTime || 0) || 0) - (Date.parse(a.endTime || a.startTime || 0) || 0));
  }
  function syncStatus(text, isErr) { const el = byId('sync-status'); if (el) { el.textContent = text || ''; el.dataset.state = isErr ? 'error' : 'ok'; } }
  const sb = () => global.sb || null;

  async function loadData() {
    const user = currentUser;
    const cached = loadCache(user ? user.id : null);
    if (cached) { players = [...cached.players]; history = [...cached.history]; pendingSync = cached.pendingSync; }
    const client = sb();
    if (!user || !client) return;
    try {
      const { data, error } = await client.from('score_history').select('*').eq('user_id', user.id).maybeSingle();
      if (error) { syncStatus('Offline — using local data', true); return; }
      const rp = data && Array.isArray(data.players) ? data.players : [];
      const rh = data && Array.isArray(data.history) ? data.history : [];
      if (pendingSync) { players = mergePlayers(players, rp); history = mergeHistory(history, rh); saveCache(true); await saveData(); }
      else if (data) { players = rp; history = rh; saveCache(false); syncStatus('Synced', false); }
      else { saveCache(false); if (players.length || history.length) await saveData(); }
    } catch (e) { syncStatus('Offline — using local data', true); }
  }
  async function saveData() {
    saveCache(true);
    const client = sb();
    if (!currentUser || !client) { syncStatus('Saved locally', false); return; }
    if (syncInFlight) return;
    syncInFlight = true;
    try {
      const { error } = await client.from('score_history').upsert({ user_id: currentUser.id, players, history, updated_at: new Date().toISOString() });
      if (error) { syncStatus('Saved locally (sync pending)', true); return; }
      saveCache(false); syncStatus('Synced', false);
    } catch (e) { syncStatus('Saved locally (sync pending)', true); }
    finally { syncInFlight = false; }
  }

  // ---------------- Auth lifecycle ----------------
  async function onAuthReady(user) {
    if (!user) return;
    if (initializedUserId === user.id) { if (pendingSync) await saveData(); return; }
    currentUser = user; initializedUserId = user.id;
    currentGame = loadActive();
    showView(currentGame ? 'active' : 'home');
    await loadData();
    if (initializedUserId === user.id) showView(currentView);
  }
  function onAuthSignedOut() {
    currentUser = null; initializedUserId = null; players = []; history = []; currentGame = null; pendingSync = false;
    scoringPlayer = null; currentView = 'home';
    document.body.classList.remove('theme-catan');
    document.querySelectorAll('#app-shell .view').forEach((el) => el.classList.remove('active'));
    ['gen-leaderboard', 'gen-pad', 'leaderboard', 'score-form', 'history-list', 'recent-list', 'player-chips'].forEach((id) => { const el = byId(id); if (el) el.innerHTML = ''; });
  }

  // ---------------- Theme + navigation ----------------
  function applyTheme() {
    const on = currentView === 'active' && isCatan();
    document.body.classList.toggle('theme-catan', on);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', on ? '#180f08' : '#0b1220');
  }
  function showView(v) {
    if (!byId('view-' + v)) v = 'home';
    currentView = v;
    document.querySelectorAll('#app-shell .view').forEach((el) => el.classList.toggle('active', el.id === 'view-' + v));
    document.querySelectorAll('.bottom-nav button').forEach((b) => b.classList.toggle('active', b.id === 'nav-' + v));
    applyTheme();
    if (v === 'home') renderHome();
    if (v === 'new') renderNew();
    if (v === 'history') renderHistory();
    if (v === 'active') renderActive();
    window.scrollTo(0, 0);
  }

  // ---------------- Home ----------------
  function gameLabel(g) { return gameById(g.type).name; }
  function renderHome() {
    setHidden(byId('btn-resume-game'), !currentGame);
    const el = byId('recent-list');
    if (!el) return;
    el.innerHTML = history.length
      ? history.slice(0, 5).map((g) => `<div class="recent-item"><strong>${esc(gameLabel(g))}</strong> · ${esc(g.winner || '—')}
          <div class="small">${esc(new Date(g.endTime || g.startTime || Date.now()).toLocaleDateString())} · ${(g.players || []).map((p) => esc(p.name) + ' ' + p.score).join(', ')}</div></div>`).join('')
      : '<p class="small">No games yet — tap Play to start.</p>';
  }

  // ---------------- Choose game ----------------
  function renderNew() {
    const grid = byId('game-grid');
    grid.innerHTML = GAMES.map((g) => `
      <div class="game-card ${g.id === selectedGame ? 'selected' : ''}" data-game="${g.id}" role="button" tabindex="0" onclick="selectGame('${g.id}')"
           style="${g.img ? `background-image:url('${g.img}')` : ''}">
        ${g.img ? '' : `<div class="game-icon" aria-hidden="true">${g.icon}</div>`}
        <div class="overlay">${esc(g.name)}</div>
      </div>`).join('');
    const g = gameById(selectedGame);
    if (!selectedVersion || !g.versions.includes(selectedVersion)) selectedVersion = g.versions[0];
    const sel = byId('version-select');
    sel.innerHTML = g.versions.map((v) => `<option ${v === selectedVersion ? 'selected' : ''}>${esc(v)}</option>`).join('');
    sel.onchange = () => { selectedVersion = sel.value; };
    byId('player-chips').innerHTML = players.length
      ? players.map((p, i) => `<label class="player-chip"><input type="checkbox" data-player="${i}" ${deselected.has(p) ? '' : 'checked'} onchange="togglePlayer(${i}, this.checked)"> ${esc(p)}
          <button type="button" class="chip-remove" aria-label="Remove ${esc(p)}" onclick="event.preventDefault(); removePlayer(${i})">×</button></label>`).join('')
      : '<span class="small">Add players below</span>';
  }
  function selectGame(id) { selectedGame = id; selectedVersion = null; renderNew(); }
  function togglePlayer(i, on) { const n = players[i]; if (n === undefined) return; on ? deselected.delete(n) : deselected.add(n); }
  function addPlayer() {
    const input = byId('new-player-name');
    const name = (input.value || '').trim();
    input.value = '';
    if (!name || players.some((p) => p.toLowerCase() === name.toLowerCase())) return;
    players.push(name); renderNew(); saveData();
  }
  function removePlayer(i) {
    if (players[i] === undefined) return;
    deselected.delete(players[i]); players.splice(i, 1); renderNew(); saveData();
  }
  function startGame() {
    const chosen = players.filter((p) => !deselected.has(p));
    if (!chosen.length) { alert('Add and select at least one player'); return null; }
    if (currentGame && !confirm('Replace the current ' + gameLabel(currentGame) + ' game?')) return null;
    const g = gameById(selectedGame);
    const version = selectedVersion || g.versions[0];
    currentGame = {
      id: g.id + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      type: g.id, version, target: g.target(version), startTime: new Date().toISOString(), endTime: null, winner: null,
      players: chosen.map((name) => (g.id === 'catan' ? { name, score: 0, breakdown: emptyBreakdown() } : { name, score: 0 })),
      rounds: []
    };
    if (g.id === 'catan') currentGame.targetVp = currentGame.target;
    scoringPlayer = null; padMode = 'simple';
    persistActive();
    showView('active');
    return currentGame;
  }
  function discardGame() {
    if (!currentGame || !confirm('Discard this game without saving?')) return;
    currentGame = null; scoringPlayer = null; persistActive(); showView('home');
  }

  // ---------------- Rounds (shared by every game) ----------------
  function commitRound(deltas, mode, detail) {
    const prev = currentGame.players.map((p) => p.score);
    currentGame.players.forEach((p, i) => { p.score = prev[i] + (Number(deltas[i]) || 0); });
    if (isCatan()) {
      currentGame.players.forEach((p) => { if (p.score < 0) p.score = 0; });
      if (detail && detail.breakdown) {
        const p = currentGame.players[detail.player];
        CATAN_CATS.forEach((c) => { p.breakdown[c.key] = (p.breakdown[c.key] || 0) + (detail.breakdown[c.key] || 0); });
      }
    }
    currentGame.rounds.push({ ts: new Date().toISOString(), by: scoringPlayer, mode, prev, deltas: currentGame.players.map((p, i) => p.score - prev[i]), detail: detail || null });
    scoringPlayer = null;
    persistActive();
    renderActive();
  }
  function undoLastRound() {
    if (!currentGame || !currentGame.rounds.length) return null;
    const r = currentGame.rounds.pop();
    currentGame.players.forEach((p, i) => { p.score = Array.isArray(r.prev) ? r.prev[i] : p.score - (r.deltas[i] || 0); });
    if (isCatan() && r.detail && r.detail.breakdown) {
      const p = currentGame.players[r.detail.player];
      CATAN_CATS.forEach((c) => { p.breakdown[c.key] = Math.max(0, (p.breakdown[c.key] || 0) - (r.detail.breakdown[c.key] || 0)); });
    }
    scoringPlayer = null;
    persistActive();
    renderActive();
    return r;
  }
  function onlyFor(idx, pts) { return currentGame.players.map((_, i) => (i === idx ? pts : 0)); }

  function computeWinner(game) {
    const g = gameById(game.type);
    if (!game.players.length) return '';
    const scores = game.players.map((p) => p.score);
    const best = g.low ? Math.min(...scores) : Math.max(...scores);
    return game.players.filter((p) => p.score === best).map((p) => p.name).join(', ');
  }
  function endGame() {
    if (!currentGame) return null;
    const finished = { ...currentGame, endTime: new Date().toISOString() };
    finished.winner = computeWinner(finished);
    history.unshift(finished);
    currentGame = null; scoringPlayer = null;
    persistActive();
    saveCache(true);
    showView('history');
    saveData();
    return finished;
  }

  // ---------------- Active game ----------------
  function renderActive() {
    applyTheme();
    if (!currentGame) {
      byId('gen-title').textContent = 'No active game';
      byId('gen-sub').textContent = 'Tap Play to start one.';
      byId('gen-leaderboard').innerHTML = '';
      setHidden(byId('gen-pad'), true); setHidden(byId('gen-undo'), true);
      return;
    }
    if (isCatan()) renderCatan(); else renderGeneric();
  }

  // ----- Generic (neutral) games -----
  function renderGeneric() {
    const g = gameById(currentGame.type);
    byId('gen-title').textContent = g.name;
    const t = currentGame.target;
    byId('gen-sub').textContent = [currentGame.version, t ? (g.low ? `Ends at ${t} · lowest wins` : `First to ${t}`) : '', `Round ${currentGame.rounds.length + 1}`].filter(Boolean).join(' · ');
    const sorted = currentGame.players.map((p, idx) => ({ ...p, idx })).sort((a, b) => (g.low ? a.score - b.score : b.score - a.score) || a.idx - b.idx);
    const lead = sorted.length ? sorted[0].score : null;
    byId('gen-leaderboard').innerHTML = sorted.map((p, r) => `
      <div class="player-row ${p.idx === scoringPlayer ? 'selected' : ''} ${currentGame.rounds.length && p.score === lead ? 'leader' : ''}" data-player-idx="${p.idx}" onclick="openPad(${p.idx})">
        <div class="flex"><span class="rank">${r + 1}</span><strong class="p-name">${esc(p.name)}</strong></div>
        <div class="p-score">${p.score}</div>
      </div>`).join('');
    setHidden(byId('gen-undo'), !currentGame.rounds.length);
    if (scoringPlayer === null) { setHidden(byId('gen-pad'), true); byId('gen-pad').innerHTML = ''; }
  }
  function openPad(idx) {
    if (!currentGame || !currentGame.players[idx]) return;
    scoringPlayer = idx;
    if (isCatan()) { byId('pad').style.display = 'block'; renderCatanLeaderboard(); setCatanMode(padMode); return; }
    renderGeneric();
    const g = gameById(currentGame.type);
    const pad = byId('gen-pad');
    setHidden(pad, false);
    pad.innerHTML = `
      <div class="small">Scoring for <strong>${esc(currentGame.players[idx].name)}</strong></div>
      ${g.detailedLabel ? `<div class="mode-toggle-n">
        <button type="button" class="btn ${padMode === 'simple' ? 'active' : ''}" id="gen-mode-simple" onclick="setPadMode('simple')">Simple Points</button>
        <button type="button" class="btn ${padMode === 'detailed' ? 'active' : ''}" id="gen-mode-detailed" onclick="setPadMode('detailed')">${esc(g.detailedLabel)}</button>
      </div>` : ''}
      <div id="gen-form"></div>`;
    renderGenericForm();
  }
  function setPadMode(m) {
    padMode = m === 'detailed' ? 'detailed' : 'simple';
    ['simple', 'detailed'].forEach((k) => { const b = byId('gen-mode-' + k); if (b) b.classList.toggle('active', k === padMode); });
    renderGenericForm();
  }
  function closePad() { scoringPlayer = null; renderActive(); }
  const cancelBtn = '<button class="btn" type="button" onclick="closePad()">Cancel</button>';

  function renderGenericForm() {
    const form = byId('gen-form');
    if (!form) return;
    const g = gameById(currentGame.type);
    if (padMode === 'simple' || !g.detailedLabel) {
      form.innerHTML = `<label class="small" for="simple-pts">Points this round (negative allowed)</label>
        <input type="number" id="simple-pts" value="0" inputmode="numeric">
        <div class="action-bar"><button class="btn primary" type="button" id="commit-simple" onclick="commitSimplePoints()">Add</button>${cancelBtn}</div>`;
      return;
    }
    const v = currentGame.version || '';
    const row = (id, label, extra) => `<div class="form-row"><span>${label}</span><input type="number" id="${id}" value="0" inputmode="numeric" oninput="updateGenericPreview()" ${extra || ''}></div>`;
    const box = (id, label) => `<label class="form-row"><span>${label}</span><input type="checkbox" id="${id}" onchange="updateGenericPreview()"></label>`;
    const commit = `<div class="preview" id="gen-preview"></div><div class="action-bar"><button class="btn primary" type="button" id="commit-detailed" onclick="commitGenericDetailed()">Add</button>${cancelBtn}</div>`;
    switch (g.id) {
      case 'flip7': {
        flip = { numbers: [], x2: false, mods: [], bust: false };
        form.innerHTML = `
          <div class="key-grid-5">${Object.keys(FLIP7_COLORS).map((n) => `<div class="key" id="f7n${n}" style="background:${FLIP7_COLORS[n]}" onclick="flipToggle('n', ${n})">${n}</div>`).join('')}</div>
          <div class="key-grid-6"><div class="key" id="f7x2" style="background:#1e293b" onclick="flipToggle('x2')">×2</div>
            ${[2, 4, 6, 8, 10].map((m) => `<div class="key" id="f7m${m}" style="background:#1e293b" onclick="flipToggle('m', ${m})">+${m}</div>`).join('')}</div>
          <div class="key" id="f7bust" style="background:#3f1d2a" onclick="flipToggle('bust')">Bust (0 this round)</div>${commit}`;
        break;
      }
      case '7wonders': {
        const cats = [['w-mil', 'Military'], ['w-coin', 'Treasury (coins)'], ['w-won', 'Wonder'], ['w-civ', 'Civilian (blue)'], ['w-com', 'Commercial (yellow)'], ['w-gld', 'Guilds (purple)'], ['w-sci', 'Science (green)']];
        if (/Leaders/.test(v)) cats.push(['w-ldr', 'Leaders']);
        if (/Cities/.test(v)) cats.push(['w-cty', 'Cities (black)']);
        if (/Armada/.test(v)) cats.push(['w-arm', 'Armada (naval)']);
        if (/Other/.test(v)) cats.push(['w-oth', 'Expansion extras']);
        form.innerHTML = cats.map(([id, l]) => row(id, l)).join('') + commit;
        form.dataset.fields = cats.map((c) => c[0]).join(',');
        break;
      }
      case 'carcassonne': {
        const cats = [['ca-cit', 'Cities'], ['ca-road', 'Roads'], ['ca-mon', 'Monasteries'], ['ca-field', 'Fields / farms']];
        if (/Inns|other/.test(v)) cats.push(['ca-ext', 'Expansion bonuses']);
        form.innerHTML = cats.map(([id, l]) => row(id, l)).join('') + commit;
        form.dataset.fields = cats.map((c) => c[0]).join(',');
        break;
      }
      case 'ohhell':
        form.innerHTML = row('oh-bid', 'Bid', 'min="0"') + row('oh-tricks', 'Tricks taken', 'min="0"') + `<div class="small">${esc(v)}</div>` + commit;
        break;
      case 'hearts':
        form.innerHTML = row('h-hearts', 'Hearts taken (0-13)', 'min="0" max="13"') + box('h-queen', 'Queen of Spades (+13)') +
          (/Jack/.test(v) ? box('h-jack', 'Jack of Diamonds (−10)') : '') + box('h-moon', 'Shot the moon (everyone else +26)') + commit;
        break;
      case 'nertz':
        form.innerHTML = row('n-played', 'Cards played to center (+1)', 'min="0"') + row('n-left', 'Left in Nertz pile (−2)', 'min="0"') +
          (/No bonus/.test(v) ? '' : box('n-called', 'Called Nertz (+10)')) + commit;
        break;
      default:
        form.innerHTML = row('simple-pts', 'Points') + commit;
    }
    updateGenericPreview();
  }
  function flipCalc() {
    if (!flip || flip.bust) return 0;
    let s = flip.numbers.reduce((a, b) => a + b, 0);
    if (flip.x2) s *= 2;
    s += flip.mods.reduce((a, b) => a + b, 0);
    if (flip.numbers.length === 7) s += 15;
    return s;
  }
  function flipToggle(kind, val) {
    if (!flip) return;
    const tog = (arr, x) => { const i = arr.indexOf(x); i >= 0 ? arr.splice(i, 1) : arr.push(x); };
    if (kind === 'n') { tog(flip.numbers, val); byId('f7n' + val).classList.toggle('active', flip.numbers.includes(val)); }
    if (kind === 'm') { tog(flip.mods, val); byId('f7m' + val).classList.toggle('active', flip.mods.includes(val)); }
    if (kind === 'x2') { flip.x2 = !flip.x2; byId('f7x2').classList.toggle('active', flip.x2); }
    if (kind === 'bust') { flip.bust = !flip.bust; byId('f7bust').classList.toggle('active', flip.bust); }
    updateGenericPreview();
  }
  function genericDetailedDeltas() {
    const g = gameById(currentGame.type), idx = scoringPlayer, v = currentGame.version || '';
    const form = byId('gen-form');
    switch (g.id) {
      case 'flip7': return { deltas: onlyFor(idx, flipCalc()), detail: { ...flip } };
      case '7wonders': case 'carcassonne': {
        const fields = (form.dataset.fields || '').split(',').filter(Boolean);
        const parts = Object.fromEntries(fields.map((f) => [f, num(f)]));
        return { deltas: onlyFor(idx, Object.values(parts).reduce((a, b) => a + b, 0)), detail: parts };
      }
      case 'ohhell': {
        const bid = num('oh-bid'), took = num('oh-tricks'), exact = bid === took;
        const pts = /1 per trick/.test(v) ? took + (exact ? 10 : 0) : (exact ? 10 + bid : 0);
        return { deltas: onlyFor(idx, pts), detail: { bid, took } };
      }
      case 'hearts': {
        if (checked('h-moon')) return { deltas: currentGame.players.map((_, i) => (i === idx ? 0 : 26)), detail: { moon: true } };
        const pts = Math.max(0, Math.min(13, num('h-hearts'))) + (checked('h-queen') ? 13 : 0) - (checked('h-jack') ? 10 : 0);
        return { deltas: onlyFor(idx, pts), detail: { hearts: num('h-hearts'), queen: checked('h-queen'), jack: checked('h-jack') } };
      }
      case 'nertz': {
        const pts = num('n-played') - 2 * num('n-left') + (checked('n-called') ? 10 : 0);
        return { deltas: onlyFor(idx, pts), detail: { played: num('n-played'), left: num('n-left'), called: checked('n-called') } };
      }
      default: return { deltas: onlyFor(idx, num('simple-pts')), detail: null };
    }
  }
  function updateGenericPreview() {
    const el = byId('gen-preview');
    if (!el || scoringPlayer === null) return;
    const { deltas } = genericDetailedDeltas();
    const name = currentGame.players[scoringPlayer].name;
    if (currentGame.type === 'hearts' && checked('h-moon')) el.textContent = `${name} shot the moon: everyone else +26`;
    else el.textContent = `This round: ${signed(deltas[scoringPlayer])}` + (currentGame.type === 'flip7' && flip && flip.numbers.length === 7 && !flip.bust ? ' (includes Flip 7 +15)' : '');
  }
  function commitSimplePoints() {
    if (!currentGame || scoringPlayer === null) return;
    commitRound(onlyFor(scoringPlayer, num('simple-pts')), 'simple');
  }
  function commitGenericDetailed() {
    if (!currentGame || scoringPlayer === null) return;
    const { deltas, detail } = genericDetailedDeltas();
    commitRound(deltas, 'detailed', detail);
    const g = gameById(currentGame ? currentGame.type : 'other');
    if (currentGame && currentGame.target && currentGame.players.some((p) => p.score >= currentGame.target)) {
      const t = byId('gen-sub'); if (t) t.textContent += g.low ? ' · Target reached — lowest score wins' : ' · Target reached!';
    }
  }

  // ----- Catan (parchment theme) -----
  function renderCatan() {
    const t = currentGame.targetVp || 10;
    byId('catan-title').textContent = 'Catan';
    byId('catan-sub').textContent = `FIRST TO ${t} VICTORY POINTS`;
    renderCatanLeaderboard();
    if (scoringPlayer === null) byId('pad').style.display = 'none';
  }
  function renderCatanLeaderboard() {
    const UI = global.ScoreTrackerUI, t = currentGame.targetVp || 10;
    const sorted = currentGame.players.map((p, idx) => ({ ...p, idx })).sort((a, b) => (b.score - a.score) || (a.idx - b.idx));
    byId('leaderboard').innerHTML = sorted.map((p) => {
      const win = p.score >= t;
      const cls = ['player-row', p.idx === scoringPlayer ? 'selected' : '', win ? 'winner' : ''].filter(Boolean).join(' ');
      return `<div class="${cls}" data-player-idx="${p.idx}" onclick="openPad(${p.idx})" role="button" tabindex="0">
          <div class="shield-wrap">${UI.shieldSvg(p.idx, p.name)}</div>
          <div class="player-meta">
            <div class="player-name-line"><span class="player-name">${esc(p.name)}</span>${win ? `<span class="winner-badge">${UI.crownSvg()} Winner</span>` : ''}</div>
            ${UI.starsHtml(p.score, t)}
          </div>
          <div class="vp-badge"><div class="vp-num">${p.score}</div><div class="vp-label">VP</div></div>
        </div>`;
    }).join('');
    setHidden(byId('btn-undo'), !currentGame.rounds.length);
  }
  function setCatanMode(m) {
    padMode = m === 'detailed' ? 'detailed' : 'simple';
    ['simple', 'detailed'].forEach((k) => { const b = byId('mode-' + k); if (b) { b.classList.toggle('active', k === padMode); b.setAttribute('aria-selected', String(k === padMode)); } });
    if (!isCatan() || scoringPlayer === null) return;
    const p = currentGame.players[scoringPlayer];
    byId('pad-player-banner').innerHTML = `<span class="shield-wrap">${global.ScoreTrackerUI.shieldSvg(scoringPlayer, p.name)}</span><span>${esc(p.name)}</span><span class="pad-current">· ${p.score} VP</span>`;
    if (padMode === 'simple') { catanAdj = 1; renderCatanSimple(); } else { catanDraft = emptyBreakdown(); renderCatanDetailed(); }
  }
  function renderCatanSimple() {
    const name = esc(currentGame.players[scoringPlayer].name);
    byId('score-form').innerHTML = `<div class="adj-box">
        <button type="button" class="adj-btn" id="catan-minus" onclick="catanStep(-1)" aria-label="Decrease">−</button>
        <div id="adj-val">${signed(catanAdj)}</div>
        <button type="button" class="adj-btn" id="catan-plus" onclick="catanStep(1)" aria-label="Increase">+</button>
      </div>
      <button type="button" id="commit-simple-btn" class="btn gold" onclick="commitCatanSimple()" ${catanAdj === 0 ? 'disabled' : ''}>${catanAdj >= 0 ? `Add ${signed(catanAdj)} VP to ${name}` : `Adjust ${catanAdj} VP for ${name}`}</button>`;
  }
  function catanStep(d) { catanAdj += d; renderCatanSimple(); }
  function commitCatanSimple() { if (isCatan() && scoringPlayer !== null && catanAdj !== 0) commitRound(onlyFor(scoringPlayer, catanAdj), 'simple'); }
  function renderCatanDetailed() {
    const UI = global.ScoreTrackerUI, name = esc(currentGame.players[scoringPlayer].name), total = catanTotal(catanDraft);
    byId('score-form').innerHTML = `<div class="cat-list">${CATAN_CATS.map((c) => {
      const n = catanDraft[c.key] || 0;
      return `<div class="cat-row ${n > 0 ? 'has-count' : ''}" data-cat="${c.key}" onclick="catanCat('${c.key}', 1)">
          <div class="cat-icon ${c.icon}">${UI.categoryIconSvg(c.ui)}</div>
          <div class="cat-info"><div class="cat-name">${c.label}</div><div class="cat-vp">+${c.vp} VP</div></div>
          <div class="cat-right">
            <button type="button" class="cat-step-btn cat-dec" onclick="event.stopPropagation(); catanCat('${c.key}', -1)" aria-label="Remove ${c.label}" ${n <= 0 ? 'disabled' : ''}>−</button>
            <span class="cat-count" id="cat-count-${c.key}">${n}</span>
            <button type="button" class="cat-step-btn cat-inc" onclick="event.stopPropagation(); catanCat('${c.key}', 1)" aria-label="Add ${c.label}" ${n >= c.max ? 'disabled' : ''}>+</button>
          </div></div>`;
    }).join('')}</div>
      <div class="round-summary"><div id="round-total">Round Total: +${total} VP</div><button type="button" class="btn-link-reset" onclick="catanReset()">Reset</button></div>
      <button type="button" id="commit-detailed-btn" class="btn gold" onclick="commitCatanDetailed()" ${total === 0 ? 'disabled' : ''}>Add +${total} VP to ${name}</button>`;
  }
  function catanCat(key, d) {
    const c = CATAN_CATS.find((x) => x.key === key);
    if (!c) return;
    catanDraft[key] = Math.max(0, Math.min(c.max, (catanDraft[key] || 0) + d));
    renderCatanDetailed();
  }
  function catanReset() { catanDraft = emptyBreakdown(); renderCatanDetailed(); }
  function commitCatanDetailed() {
    if (!isCatan() || scoringPlayer === null) return;
    const total = catanTotal(catanDraft);
    if (!total) return;
    const idx = scoringPlayer, bd = { ...catanDraft };
    catanDraft = emptyBreakdown();
    commitRound(onlyFor(idx, total), 'detailed', { player: idx, breakdown: bd });
  }

  // ---------------- History ----------------
  function renderHistory() {
    const el = byId('history-list');
    if (!history.length) { el.innerHTML = '<p class="small">Nothing here yet.</p>'; return; }
    el.innerHTML = history.map((g, i) => `
      <div class="history-item">
        <div class="flex space-between" style="flex-wrap:nowrap">
          <div><strong>${esc(gameLabel(g))}</strong>${g.version ? ` <span class="small">· ${esc(g.version)}</span>` : ''}
            <div class="small">${esc(new Date(g.endTime || g.startTime || Date.now()).toLocaleDateString())}</div></div>
          <button class="btn danger sm" type="button" aria-label="Delete game" onclick="deleteGame(${i})">×</button>
        </div>
        <div style="margin-top:.3rem">${[...(g.players || [])].sort((a, b) => (gameById(g.type).low ? a.score - b.score : b.score - a.score)).map((p) => `${esc(p.name)}: <strong>${p.score}</strong>`).join(' · ')}</div>
        <div class="winner">Winner: ${esc(g.winner || '—')}</div>
      </div>`).join('');
  }
  function deleteGame(i) {
    if (!history[i] || !confirm('Delete this game from history?')) return;
    history.splice(i, 1); renderHistory(); saveData();
  }

  // Enter key on the add-player input
  document.addEventListener('DOMContentLoaded', () => {
    const input = byId('new-player-name');
    if (input) input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addPlayer(); } });
  });

  Object.assign(global, {
    onAuthReady, onAuthSignedOut, showView, selectGame, togglePlayer, addPlayer, removePlayer, startGame, discardGame,
    openPad, setPadMode, closePad, flipToggle, updateGenericPreview, commitSimplePoints, commitGenericDetailed,
    setCatanMode, catanStep, commitCatanSimple, catanCat, catanReset, commitCatanDetailed,
    undoLastRound, undoLastAction: undoLastRound, endGame, deleteGame,
    ScoreTracker: { GAMES, getState: () => ({ players: [...players], history: [...history], currentGame, currentView, scoringPlayer, padMode, pendingSync }) }
  });
})(window);

</script>

<script id="score-auth-script">
(function () {
  const SUPABASE_URL = 'https://lezfdnqqfejqyxqwlcfg.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_HEGO45Fw5dl1s8sAbFnSkg_VzWU_guj';
  const REDIRECT = 'https://rand50.github.io/score-tracker/game_tracker.html';

  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    const showOffline = () => {
      const lv = document.getElementById('login-view'), as = document.getElementById('app-shell');
      if (as) { as.hidden = true; as.classList.add('auth-hidden', 'hidden'); }
      if (lv) { lv.hidden = false; lv.classList.remove('auth-hidden'); lv.style.display = 'flex'; }
      const m = document.getElementById('login-msg');

    }

  let currentUser = null;
  let readyUserId = null;
  let wasSignedIn = false;

  function getEls() {
    return {
      loginView: document.getElementById('login-view'),
      appShell: document.getElementById('app-shell'),
      emailInput: document.getElementById('email'),
      googleBtn: document.getElementById('btn-google-signin'),
      emailBtn: document.getElementById('btn-email-signin'),
      msgEl: document.getElementById('login-msg'),
      formEl: document.getElementById('magic-link-form')
    };

  function setMsg(text, tone) {
    const { msgEl } = getEls();
    if (!msgEl) return;
    msgEl.textContent = text || '';
    if (tone) msgEl.setAttribute('data-tone', tone);
    else msgEl.removeAttribute('data-tone');

  function setBusy(busy) {
    const { googleBtn, emailBtn, emailInput } = getEls();

    if (emailBtn) emailBtn.disabled = busy;
    if (emailInput) emailInput.disabled = busy;
  }

  function hideBothInitially() {
    const { loginView, appShell } = getEls();
    if (loginView) {
      loginView.hidden = true;
      loginView.classList.add('auth-hidden');
      loginView.classList.remove('active');
      loginView.style.display = 'none';
    }
    if (appShell) {
      appShell.hidden = true;
      appShell.classList.add('auth-hidden');
      appShell.style.display = 'none';
    }
  }

  function showSignedInUI() {
    const { loginView, appShell } = getEls();
    if (loginView) {
      loginView.hidden = true;
      loginView.classList.add('auth-hidden');
      loginView.classList.remove('active');
      loginView.style.setProperty('display', 'none', 'important');
    }
    if (appShell) {
      appShell.hidden = false;
      appShell.classList.remove('auth-hidden', 'hidden');
      appShell.style.display = 'block';

    document.body.classList.remove('theme-catan');

      appShell.hidden = true;
      appShell.classList.add('auth-hidden', 'hidden');
      appShell.style.setProperty('display', 'none', 'important');

      loginView.hidden = false;
      loginView.classList.remove('auth-hidden');
      loginView.classList.add('active');
      loginView.style.display = 'flex';
    }
  }

  function readAndCleanAuthUrlParams() {
    try {
      const url = new URL(window.location.href);
      const searchParams = url.searchParams;
      const hashParams = new URLSearchParams(url.hash.replace(/^#/, ''));
      const errDesc =
        searchParams.get('error_description') ||
        hashParams.get('error_description') ||
        searchParams.get('error') ||
        hashParams.get('error');

      const authKeys = [
        'code',
        'error',
        'error_code',
        'error_description',
        'access_token',
        'refresh_token',
        'expires_in',
        'expires_at',
        'token_type',
        'provider_token',
        'type'
      ];

      let dirty = false;
      authKeys.forEach((k) => {
        if (searchParams.has(k)) {
          searchParams.delete(k);
          dirty = true;
        }
        if (hashParams.has(k)) {
          hashParams.delete(k);
          dirty = true;
        }
      });

      if (dirty && window.history && window.history.replaceState) {
        const cleanSearch = searchParams.toString();
        const cleanHash = hashParams.toString();
        const nextUrl =
          url.origin +
          url.pathname +
          (cleanSearch ? '?' + cleanSearch : '') +
          (cleanHash ? '#' + cleanHash : '');
        window.history.replaceState({}, document.title, nextUrl);
      }

      return errDesc || null;
    } catch (_) {
      return null;
    }
  }

  function applySession(session, eventName) {
    if (session && session.user) {
      currentUser = session.user;
      wasSignedIn = true;
      setBusy(false);
      setMsg('', '');
      showSignedInUI();
      readAndCleanAuthUrlParams();

      if (readyUserId !== session.user.id) {

        if (typeof window.onAuthReady === 'function') {
          try {
            window.onAuthReady(session.user);

            console.error('onAuthReady error:', err);

      const shouldNotifySignedOut = wasSignedIn || eventName === 'SIGNED_OUT';

      showSignedOutUI();

  async function signInWithGoogle() {

    if (evt && typeof evt.preventDefault === 'function') evt.preventDefault();

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setMsg('Please enter a valid email address.', 'error');
      if (emailInput) emailInput.focus();
      return;
    }

    setBusy(true);
    setMsg('Sending magic link…', '');
    try {
      const { error } = await sb.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: REDIRECT }
      });
      setBusy(false);
      if (error) {
        setMsg(error.message || 'Could not send magic link.', 'error');
      } else {
        setMsg('Check your email for your sign-in link.', 'success');
      }
    } catch (err) {
      setBusy(false);
      setMsg((err && err.message) || 'Could not send magic link.', 'error');
    }
  }

  async function signOut() {
    try {
      await sb.auth.signOut();
    } catch (err) {
      console.error('signOut error:', err);
    }
    applySession(null, 'SIGNED_OUT');
  }

  async function getUser() {
    if (currentUser) return currentUser;
    const { data: { session } } = await sb.auth.getSession();

  // Wire UI listeners
  function bindEvents() {

      googleBtn.dataset.bound = '1';

    }
    if (formEl && !formEl.dataset.bound) {
      formEl.dataset.bound = '1';
      formEl.addEventListener('submit', signInWithEmail);
    }
  }

  // Expose public API + legacy globals
  window.ScoreAuth = { signInWithGoogle, signInWithEmail, signOut, getUser };
  window.signInWithGoogle = signInWithGoogle;
  window.signInWithEmail = signInWithEmail;
  window.signOut = signOut;

  async function initAuth() {
    hideBothInitially();
    bindEvents();

    // Capture any OAuth error before Supabase finishes URL handling
    const urlError = (() => {
      try {
        const u = new URL(window.location.href);
        const h = new URLSearchParams(u.hash.replace(/^#/, ''));
        return u.searchParams.get('error_description') || h.get('error_description') || u.searchParams.get('error') || h.get('error');
      } catch (_) {
        return null;
      }
    })();

    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') {
        applySession(null, 'SIGNED_OUT');
      } else if (session) {
        applySession(session, event);
      }
    });

    try {
      const { data: { session }, error } = await sb.auth.getSession();
      if (error) {
        applySession(null, 'INIT_ERROR');
        setMsg(error.message || 'Unable to verify session.', 'error');
        return;
      }
      applySession(session, 'INITIAL_SESSION');
      if (!session && urlError) {
        readAndCleanAuthUrlParams();
        setMsg(urlError, 'error');
      }
    } catch (err) {
      applySession(null, 'INIT_ERROR');
      setMsg((err && err.message) || 'Unable to verify session.', 'error');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAuth, { once: true });
  } else {
    initAuth();
  }
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>

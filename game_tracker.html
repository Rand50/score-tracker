<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Score Tracker</title>
<style>
:root { --bg:#1a120b; --parchment:#f5e6c8; --text:#3d2914; --gold:#b8860b; --border:#8b6914; }
body { margin:0; font-family:Georgia,serif; background:var(--bg); color:var(--text); padding-bottom:70px; }
.view { display:none; padding:0.8rem; max-width:500px; margin:0 auto; }
.view.active { display:block; }
.parchment { background:var(--parchment); border:3px solid var(--border); border-radius:8px; padding:1rem; margin-bottom:0.8rem; }
.header-title { text-align:center; font-size:1.5rem; margin:0; }
.header-sub { text-align:center; font-size:0.75rem; letter-spacing:2px; color:var(--border); }
.section-title { text-align:center; font-size:0.85rem; letter-spacing:2px; color:var(--border); font-weight:bold; margin:0.4rem 0; }
.player-row { display:flex; align-items:center; padding:0.5rem 0; border-bottom:1px dashed #c4a574; cursor:pointer; }
.shield { width:32px; height:32px; border-radius:4px; margin-right:0.6rem; }
.stars { color:var(--gold); font-size:0.8rem; }
.vp-num { font-size:1.3rem; font-weight:bold; color:var(--border); margin-left:auto; }
.adj-box { display:flex; align-items:center; justify-content:center; gap:1rem; }
.adj-btn { width:36px; height:36px; border:2px solid var(--border); background:#3d2914; color:var(--parchment); font-size:1.2rem; cursor:pointer; border-radius:4px; }
.cat-row { display:flex; align-items:center; padding:0.6rem; background:#faf3e0; border:1px solid #c4a574; border-radius:4px; margin:0.3rem 0; cursor:pointer; }
.cat-icon { width:36px; height:36px; border-radius:4px; margin-right:0.6rem; }
.btn { background:#3d2914; color:var(--parchment); border:none; padding:0.7rem; border-radius:4px; width:100%; margin-top:0.5rem; cursor:pointer; }
.btn.gold { background:linear-gradient(135deg,var(--gold),var(--border)); }
.mode-toggle { display:flex; gap:0.4rem; margin:0.4rem 0; }
.mode-toggle button { flex:1; padding:0.5rem; border:1px solid var(--border); background:#e8d4a8; cursor:pointer; }
.mode-toggle button.active { background:var(--border); color:var(--parchment); }
input { width:100%; padding:0.6rem; border:1px solid #c4a574; border-radius:4px; background:#faf3e0; }
.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:#2a1f14; display:flex; justify-content:space-around; padding:0.5rem 0; }
.bottom-nav button { background:none; border:none; color:#c4a574; }
.bottom-nav button.active { color:var(--gold); }
#login-view { display:block; }
</style>
</head>
<body>
<div id="login-view" class="view active">
  <div class="parchment">
    <h1 class="header-title">Score Tracker</h1>
    <button class="btn" style="background:#fff;color:#333" onclick="signInWithGoogle()">Continue with Google</button>
    <input type="email" id="email" placeholder="Or email" style="margin-top:0.8rem">
    <button class="btn gold" onclick="signInWithEmail()">Send magic link</button>
    <p id="login-msg" style="font-size:0.8rem;color:var(--border)"></p>
  </div>
</div>

<div id="app-shell" class="hidden">
  <div id="view-home" class="view">
    <div class="parchment">
      <h1 class="header-title">Score Tracker</h1>
      <button class="btn gold" onclick="showView('new')">Start a Game</button>
    </div>
  </div>
  <div id="view-new" class="view">
    <div class="parchment">
      <div class="section-title">Players</div>
      <div id="player-chips"></div>
      <div style="display:flex;gap:0.4rem;margin-top:0.5rem"><input id="new-player-name" placeholder="Add player"><button class="btn" style="width:auto" onclick="addPlayer()">+</button></div>
      <button class="btn gold" onclick="startGame()">Start Playing</button>
    </div>
  </div>
  <div id="view-active" class="view">
    <div class="parchment">
      <h1 class="header-title">Score Tracker</h1>
      <p class="header-sub">FIRST TO 10 VICTORY POINTS</p>
    </div>
    <div class="parchment">
      <div class="section-title">VICTORY POINTS</div>
      <div id="leaderboard"></div>
    </div>
    <div class="parchment" id="pad" style="display:none">
      <div class="section-title">ADJUST VICTORY POINTS</div>
      <div class="mode-toggle">
        <button id="mode-simple" class="active" onclick="setMode('simple')">Simple</button>
        <button id="mode-detailed" onclick="setMode('detailed')">Detailed</button>
      </div>
      <div id="score-form"></div>
    </div>
    <button class="btn" onclick="endGame()">Save Game</button>
  </div>
  <div id="view-history" class="view">
    <div class="parchment"><div id="history-list"></div></div>
  </div>
  <nav class="bottom-nav">
    <button onclick="showView('home')" id="nav-home">Home</button>
    <button onclick="showView('new')" id="nav-new">Play</button>
    <button onclick="showView('history')" id="nav-history">History</button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://lezfdnqqfejqyxqwlcfg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_HEGO45Fw5dl1s8sAbFnSkg_VzWU_guj';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const REDIRECT = 'https://rand50.github.io/score-tracker/game_tracker.html';
const SHIELDS = ['#c0392b','#27ae60','#2980b9','#8e44ad'];

let players = [];
let history = [];
let currentGame = null;
let scoringPlayer = null;
let mode = 'simple';
let adjVal = 1;
let roundTotal = 0;

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    document.getElementById('login-view').classList.remove('active');
    document.getElementById('app-shell').classList.remove('hidden');
    document.getElementById('app-shell').style.display = 'block';
    await loadData();
    const saved = localStorage.getItem('gst_active');
    if (saved) { try { currentGame = JSON.parse(saved); } catch(e){} }
    showView(currentGame ? 'active' : 'home');
  }
}
async function signInWithGoogle() { await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo:REDIRECT } }); }
async function signInWithEmail() {
  const email = document.getElementById('email').value;
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo:REDIRECT } });
  document.getElementById('login-msg').textContent = error ? error.message : 'Check your email';
}
async function signOut() { await sb.auth.signOut(); location.reload(); }

async function loadData() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  const { data } = await sb.from('score_history').select('*').eq('user_id', user.id).maybeSingle();
  if (data) { players = data.players || []; history = data.history || []; }
}
async function saveData() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  await sb.from('score_history').upsert({ user_id:user.id, players, history, updated_at:new Date().toISOString() });
}
function persist() { if (currentGame) localStorage.setItem('gst_active', JSON.stringify(currentGame)); else localStorage.removeItem('gst_active'); }

function showView(v) {
  document.querySelectorAll('#app-shell .view').forEach(el => el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-'+v)?.classList.add('active');
  if (v === 'new') renderNew();
  if (v === 'active' && currentGame) renderLeaderboard();
  if (v === 'history') renderHistory();
}

function renderNew() {
  document.getElementById('player-chips').innerHTML = players.map(p=>`<span>${p} </span>`).join('') || 'Add players';
}
function addPlayer() {
  const name = document.getElementById('new-player-name').value.trim();
  if (name && !players.includes(name)) { players.push(name); document.getElementById('new-player-name').value=''; saveData(); renderNew(); }
}
function startGame() {
  if (!players.length) { alert('Add players'); return; }
  currentGame = { type:'catan', players:players.map(n=>({name:n,score:0})), rounds:[] };
  persist();
  showView('active');
}

function renderLeaderboard() {
  const sorted = [...currentGame.players].map((p,i)=>({...p,idx:i})).sort((a,b)=>b.score-a.score);
  document.getElementById('leaderboard').innerHTML = sorted.map(p => `
    <div class="player-row" onclick="openPad(${p.idx})">
      <div class="shield" style="background:${SHIELDS[p.idx%SHIELDS.length]}"></div>
      <div style="flex:1">${p.name}</div>
      <div class="stars">${'★'.repeat(Math.min(p.score,10))}</div>
      <div class="vp-num">${p.score}</div>
    </div>
  `).join('');
  document.getElementById('pad').style.display = 'none';
}

function openPad(idx) {
  scoringPlayer = idx;
  document.getElementById('pad').style.display = 'block';
  setMode(mode);
}

function setMode(m) {
  mode = m;
  document.getElementById('mode-simple').classList.toggle('active', m==='simple');
  document.getElementById('mode-detailed').classList.toggle('active', m==='detailed');
  const form = document.getElementById('score-form');
  const name = currentGame.players[scoringPlayer].name;
  if (m === 'simple') {
    adjVal = 1;
    form.innerHTML = `<div class="adj-box"><button class="adj-btn" onclick="adj(-1)">−</button><div id="adj-val">1</div><button class="adj-btn" onclick="adj(1)">+</button></div><button class="btn gold" onclick="commitSimple()">Add to ${name}</button>`;
  } else {
    roundTotal = 0;
    form.innerHTML = `
      <div class="cat-row" onclick="addCat(1)"><div class="cat-icon" style="background:#c0392b"></div><div><strong>Settlements</strong><br><span style="font-size:0.8rem;color:#8b6914">+1 VP</span></div></div>
      <div class="cat-row" onclick="addCat(2)"><div class="cat-icon" style="background:#b8860b"></div><div><strong>Cities</strong><br><span style="font-size:0.8rem;color:#8b6914">+2 VP</span></div></div>
      <div class="cat-row" onclick="addCat(2)"><div class="cat-icon" style="background:#27ae60"></div><div><strong>Longest Road</strong><br><span style="font-size:0.8rem;color:#8b6914">+2 VP</span></div></div>
      <div class="cat-row" onclick="addCat(2)"><div class="cat-icon" style="background:#8e44ad"></div><div><strong>Largest Army</strong><br><span style="font-size:0.8rem;color:#8b6914">+2 VP</span></div></div>
      <div class="cat-row" onclick="addCat(1)"><div class="cat-icon" style="background:#d4a017"></div><div><strong>VP Card</strong><br><span style="font-size:0.8rem;color:#8b6914">+1 VP</span></div></div>
      <div id="round-total" style="text-align:center;margin:0.4rem 0">Round: 0</div>
      <button class="btn gold" onclick="commitDetailed()">Add to Score</button>
    `;
  }
}

function adj(n) { adjVal = Math.max(1, adjVal+n); document.getElementById('adj-val').textContent = adjVal; }
function addCat(n) { roundTotal += n; document.getElementById('round-total').textContent = 'Round: ' + roundTotal; }
function commitSimple() { currentGame.players[scoringPlayer].score += adjVal; persist(); renderLeaderboard(); }
function commitDetailed() { currentGame.players[scoringPlayer].score += roundTotal; roundTotal=0; persist(); renderLeaderboard(); }

function endGame() {
  currentGame.endTime = new Date().toISOString();
  history.unshift(currentGame);
  saveData();
  localStorage.removeItem('gst_active');
  currentGame = null;
  showView('history');
}
function renderHistory() {
  document.getElementById('history-list').innerHTML = history.map(g=>`<div>${g.type}: ${g.players.map(p=>p.name+':'+p.score).join(', ')}</div>`).join('') || 'No history';
}

checkSession();
sb.auth.onAuthStateChange(()=>checkSession());
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Score Tracker</title>
<style>
:root { --bg:#0b1220; --surface:#151c2c; --surface2:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --accent:#22d3ee; --accent-dim:#0891b2; --border:rgba(255,255,255,0.08); }
body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); padding-bottom:80px; transition:background .3s; }
.view { padding:0 1rem; max-width:900px; margin:0 auto; }
.hidden { display:none !important; }
.card { background:var(--surface); border-radius:16px; padding:1.25rem; margin-bottom:1rem; border:1px solid var(--border); }
.btn { background:var(--surface2); color:var(--text); border:1px solid var(--border); padding:0.7rem 1.2rem; border-radius:12px; font-weight:600; cursor:pointer; }
.btn.primary { background:linear-gradient(135deg,var(--accent),var(--accent-dim)); color:#0b1220; border:none; }
.btn.google { background:#fff; color:#333; border:none; }
input, select { background:#0b1220; border:1px solid var(--border); color:var(--text); padding:0.7rem; border-radius:10px; width:100%; font-size:1rem; }
.game-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:0.75rem; margin:1rem 0; }
.game-card { background:var(--surface2); border-radius:14px; height:180px; cursor:pointer; position:relative; background-size:contain; background-repeat:no-repeat; background-position:center; border:2px solid transparent; }
.game-card.selected { border-color:var(--accent); }
.game-card .overlay { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,rgba(0,0,0,.85)); padding:.6rem; color:white; font-weight:600; }
.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:rgba(15,23,42,.95); display:flex; justify-content:space-around; padding:.6rem 0; }
.bottom-nav button { background:none; border:none; color:var(--muted); }
.bottom-nav button.active { color:var(--accent); }
.small { color:var(--muted); font-size:.85rem; }
.flex { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
.key { border-radius:10px; padding:0.85rem 0.3rem; text-align:center; font-weight:700; font-size:1.15rem; cursor:pointer; border:1px solid #334155; }
.key.active { outline:3px solid var(--accent); }
.player-row { background:var(--surface2); border-radius:14px; padding:0.9rem 1.1rem; margin:0.45rem 0; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
.rank { width:28px; font-weight:700; color:var(--muted); }
</style>
</head>
<body>
<div id="login-view" class="view">
  <div class="card" style="max-width:400px;margin:4rem auto;text-align:center">
    <h1>Score Tracker</h1>
    <button class="btn google" style="width:100%" onclick="signInWithGoogle()">Continue with Google</button>
    <input type="email" id="email" placeholder="Or email" style="margin-top:1rem">
    <button class="btn primary" style="width:100%;margin-top:.8rem" onclick="signInWithEmail()">Send magic link</button>
    <p id="login-msg" class="small"></p>
  </div>
</div>

<div id="app-view" class="hidden">
  <header style="padding:1rem;display:flex;justify-content:space-between;align-items:center">
    <h1 style="margin:0">Score Tracker</h1>
    <button class="btn" onclick="signOut()">Sign out</button>
  </header>
  <div id="view-home" class="view">
    <div class="card" style="text-align:center">
      <div style="font-size:3rem">🎲</div>
      <h2>Ready to play?</h2>
      <button class="btn primary" style="width:100%;max-width:280px" onclick="showView('new')">Start a Game</button>
    </div>
    <div class="card"><h3>Recent</h3><div id="recent-list"></div></div>
  </div>
  <div id="view-new" class="view hidden">
    <div class="card">
      <h2 style="margin-top:0">Choose Game</h2>
      <div class="game-grid" id="game-grid"></div>
      <label class="small">Version</label>
      <select id="version-select"></select>
      <h3>Players</h3>
      <div id="player-chips" style="margin:.5rem 0"></div>
      <div class="flex">
        <input id="new-player-name" placeholder="Add player" style="flex:1">
        <button class="btn" onclick="addPlayer()">+</button>
      </div>
      <button class="btn primary" style="width:100%;margin-top:1.2rem" onclick="startGame()">Start Playing</button>
    </div>
  </div>
  <div id="view-active" class="view hidden">
    <div class="card" id="active-card">
      <h2 id="active-title" style="margin-top:0"></h2>
      <div id="leaderboard"></div>
      <div id="pad" class="hidden"></div>
      <div class="flex" style="margin-top:1rem">
        <button class="btn primary" onclick="endGame()">Save Game</button>
      </div>
    </div>
  </div>
  <div id="view-history" class="view hidden"><div class="card"><h2>History</h2><div id="history-list"></div></div></div>
  <nav class="bottom-nav">
    <button onclick="showView('home')" id="nav-home" class="active">Home</button>
    <button onclick="showView('new')" id="nav-new">Play</button>
    <button onclick="showView('history')" id="nav-history">History</button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://lezfdnqqfejqyxqwlcfg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_HEGO45Fw5dl1s8sAbFnSkg_VzWU_guj';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const REDIRECT = 'https://rand50.github.io/score-tracker/game_tracker.html';

const CARD_COLORS = {
  0:'#1a1a1a',1:'#4a90d9',2:'#f4d03f',3:'#e74c3c',4:'#27ae60',
  5:'#2ecc71',6:'#8e44ad',7:'#e67e22',8:'#16a085',9:'#d35400',
  10:'#c0392b',11:'#2c3e50',12:'#7f8c8d'
};

const THEMES = {
  flip7: { bg:'#0b1220', accent:'#22d3ee', surface:'#151c2c' },
  '7wonders': { bg:'#0a1a1a', accent:'#d4a017', surface:'#1a2a2a' },
  carcassonne: { bg:'#1a1f14', accent:'#7cb342', surface:'#2a3320' },
  catan: { bg:'#1a120b', accent:'#e67e22', surface:'#2a1f14' },
  ohhell: { bg:'#0d1a0d', accent:'#4caf50', surface:'#1a2a1a' },
  hearts: { bg:'#1a0d0d', accent:'#e74c3c', surface:'#2a1515' },
  nertz: { bg:'#1a140d', accent:'#f4d03f', surface:'#2a2214' },
  other: { bg:'#0b1220', accent:'#22d3ee', surface:'#151c2c' }
};

let players = [];
let history = [];
let currentGame = null;
let selectedGame = 'flip7';
let scoringPlayer = null;
let currentRoundState = null;

const games = [
  { id:'flip7', name:'Flip 7', img:'flip7.jpg', versions:['Standard (to 200)','With a Vengeance'], theme:'flip7' },
  { id:'7wonders', name:'7 Wonders', img:'7wonders.jpg', versions:['Base','With Leaders','With Cities'], theme:'7wonders' },
  { id:'carcassonne', name:'Carcassonne', img:'', versions:['Classic','Inns & Cathedrals'], theme:'carcassonne' },
  { id:'catan', name:'Catan', img:'', versions:['Base (to 10)','Cities & Knights'], theme:'catan' },
  { id:'ohhell', name:'Oh Hell', img:'ohhell.jpg', versions:['Exact = 10+bid'], theme:'ohhell' },
  { id:'hearts', name:'Hearts', img:'', versions:['Standard (to 100)'], theme:'hearts' },
  { id:'nertz', name:'Nertz', img:'nertz.png', versions:['Standard'], theme:'nertz' },
  { id:'other', name:'Custom', img:'', versions:['Custom'], theme:'other' }
];

function applyTheme(themeKey) {
  const t = THEMES[themeKey] || THEMES.other;
  document.documentElement.style.setProperty('--bg', t.bg);
  document.documentElement.style.setProperty('--accent', t.accent);
  document.documentElement.style.setProperty('--surface', t.surface);
  document.body.style.background = t.bg;
}

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('app-view').classList.remove('hidden');
    await loadData();
    restoreActiveGame();
    showView(currentGame ? 'active' : 'home');
  }
}
async function signInWithGoogle() {
  await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo:REDIRECT } });
}
async function signInWithEmail() {
  const email = document.getElementById('email').value;
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo:REDIRECT } });
  document.getElementById('login-msg').textContent = error ? error.message : 'Check your email';
}
async function signOut() { await sb.auth.signOut(); location.reload(); }

async function loadData() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  const { data } = await sb.from('score_history').select('*').eq('user_id', user.id).maybeSingle();
  if (data) { players = data.players || []; history = data.history || []; }
}
async function saveData() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  await sb.from('score_history').upsert({ user_id:user.id, players, history, updated_at:new Date().toISOString() });
}

function persistActive() {
  if (currentGame) localStorage.setItem('gst_active', JSON.stringify(currentGame));
  else localStorage.removeItem('gst_active');
}
function restoreActiveGame() {
  const saved = localStorage.getItem('gst_active');
  if (saved) try { currentGame = JSON.parse(saved); } catch(e) {}
}

function showView(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.add('hidden'));
  document.getElementById('view-'+v).classList.remove('hidden');
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-'+v)?.classList.add('active');
  if (v==='home') { applyTheme('other'); renderRecent(); }
  if (v==='new') { applyTheme('other'); renderNew(); }
  if (v==='history') { applyTheme('other'); renderHistory(); }
  if (v==='active' && currentGame) {
    const g = games.find(x=>x.id===currentGame.type);
    applyTheme(g?.theme || 'other');
    renderLeaderboard();
  }
}

function renderNew() {
  document.getElementById('game-grid').innerHTML = games.map(g => `
    <div class="game-card ${g.id===selectedGame?'selected':''}" onclick="selectGame('${g.id}')"
         style="${g.img?`background-image:url('${g.img}')`:''}"><div class="overlay">${g.name}</div></div>
  `).join('');
  const g = games.find(x=>x.id===selectedGame);
  document.getElementById('version-select').innerHTML = (g.versions||['Standard']).map(v=>`<option>${v}</option>`).join('');
  document.getElementById('player-chips').innerHTML = players.map(p=>`<span class="small">${p} </span>`).join('') || '<span class="small">Add players below</span>';
}
function selectGame(id){ selectedGame=id; renderNew(); }
function addPlayer(){
  const name = document.getElementById('new-player-name').value.trim();
  if (name && !players.includes(name)) { players.push(name); document.getElementById('new-player-name').value=''; saveData(); renderNew(); }
}

function startGame(){
  if (!players.length){ alert('Add players'); return; }
  currentGame = { type:selectedGame, version:document.getElementById('version-select').value, players:players.map(n=>({name:n,score:0})), rounds:[] };
  persistActive();
  showView('active');
}

function renderLeaderboard(){
  const g = games.find(x=>x.id===currentGame.type);
  document.getElementById('active-title').textContent = g.name;
  const sorted = [...currentGame.players].map((p,i)=>({...p,idx:i})).sort((a,b)=>b.score-a.score);
  document.getElementById('leaderboard').innerHTML = sorted.map((p, rank) => `
    <div class="player-row" onclick="openPad(${p.idx})">
      <div class="flex"><span class="rank">${rank+1}</span><strong>${p.name}</strong></div>
      <div style="font-size:1.4rem;color:var(--accent)">${p.score}</div>
    </div>
  `).join('');
  document.getElementById('pad').classList.add('hidden');
}

function openPad(idx){
  scoringPlayer = idx;
  const g = games.find(x=>x.id===currentGame.type);
  document.getElementById('pad').classList.remove('hidden');
  document.getElementById('pad').innerHTML = `
    <div class="small" style="margin:.6rem 0">Score for <strong>${currentGame.players[idx].name}</strong></div>
    <div class="flex" style="margin-bottom:.6rem">
      <button class="btn" id="mode-simple" onclick="setMode('simple')">Simple Points</button>
      <button class="btn" id="mode-detailed" onclick="setMode('detailed')">Detailed</button>
    </div>
    <div id="score-form"></div>
  `;
  setMode('simple');
}

function setMode(mode){
  const g = games.find(x=>x.id===currentGame.type);
  const form = document.getElementById('score-form');
  if (mode === 'simple') {
    form.innerHTML = `
      <input type="number" id="simple-pts" value="0" placeholder="Points / VP">
      <div class="flex" style="margin-top:.6rem">
        <button class="btn primary" onclick="commitSimple()">Add</button>
        <button class="btn" onclick="renderLeaderboard()">Cancel</button>
      </div>
    `;
  } else {
    if (g.theme === 'flip7') form.innerHTML = getFlip7Form();
    else if (g.theme === '7wonders') form.innerHTML = get7WondersForm();
    else if (g.theme === 'catan') form.innerHTML = getCatanForm();
    else if (g.theme === 'carcassonne') form.innerHTML = getCarcassonneForm();
    else if (g.theme === 'ohhell') form.innerHTML = getOhHellForm();
    else if (g.theme === 'hearts') form.innerHTML = getHeartsForm();
    else if (g.theme === 'nertz') form.innerHTML = getNertzForm();
    else form.innerHTML = `<input type="number" id="simple-pts" value="0"><button class="btn primary" onclick="commitSimple()">Add</button>`;
  }
}

function getFlip7Form(){ return `<div class="small">Use the card pad on the main Flip 7 flow, or switch to Simple Points.</div>`; }
function get7WondersForm(){
  return `
    <div class="flex" style="margin:.3rem 0"><span style="width:90px">Military</span><input type="number" id="w-mil" value="0" style="width:80px"></div>
    <div class="flex" style="margin:.3rem 0"><span style="width:90px">Science</span><input type="number" id="w-sci" value="0" style="width:80px"></div>
    <div class="flex" style="margin:.3rem 0"><span style="width:90px">Civilian</span><input type="number" id="w-civ" value="0" style="width:80px"></div>
    <div class="flex" style="margin:.3rem 0"><span style="width:90px">Wonder</span><input type="number" id="w-won" value="0" style="width:80px"></div>
    <div class="flex" style="margin:.3rem 0"><span style="width:90px">Coins</span><input type="number" id="w-coin" value="0" style="width:80px"></div>
    <button class="btn primary" style="margin-top:.6rem" onclick="commit7Wonders()">Add</button>
  `;
}
function getCatanForm(){
  return `
    <div class="flex" style="margin:.3rem 0"><span style="width:110px">Settlements</span><input type="number" id="c-set" value="0" style="width:70px"></div>
    <div class="flex" style="margin:.3rem 0"><span style="width:110px">Cities</span><input type="number" id="c-cit" value="0" style="width:70px"></div>
    <div class="flex" style="margin:.3rem 0"><span style="width:110px">Longest Road</span><input type="number" id="c-lr" value="0" style="width:70px"></div>
    <div class="flex" style="margin:.3rem 0"><span style="width:110px">Largest Army</span><input type="number" id="c-la" value="0" style="width:70px"></div>
    <div class="flex" style="margin:.3rem 0"><span style="width:110px">Dev cards</span><input type="number" id="c-dev" value="0" style="width:70px"></div>
    <button class="btn primary" style="margin-top:.6rem" onclick="commitCatan()">Add VP</button>
  `;
}
function getCarcassonneForm(){
  return `
    <div class="flex" style="margin:.3rem 0"><span style="width:100px">Cities</span><input type="number" id="ca-cit" value="0" style="width:80px"></div>
    <div class="flex" style="margin:.3rem 0"><span style="width:100px">Roads</span><input type="number" id="ca-road" value="0" style="width:80px"></div>
    <div class="flex" style="margin:.3rem 0"><span style="width:100px">Monasteries</span><input type="number" id="ca-mon" value="0" style="width:80px"></div>
    <div class="flex" style="margin:.3rem 0"><span style="width:100px">Fields</span><input type="number" id="ca-field" value="0" style="width:80px"></div>
    <button class="btn primary" style="margin-top:.6rem" onclick="commitCarcassonne()">Add</button>
  `;
}
function getOhHellForm(){
  return `
    <div class="flex"><input type="number" id="oh-bid" placeholder="Bid" style="width:80px"><input type="number" id="oh-tricks" placeholder="Tricks" style="width:80px"></div>
    <button class="btn primary" style="margin-top:.6rem" onclick="commitOhHell()">Add</button>
  `;
}
function getHeartsForm(){
  return `
    <div class="flex"><span style="width:100px">Hearts</span><input type="number" id="h-hearts" value="0" style="width:70px"></div>
    <div class="flex" style="margin-top:.4rem"><span style="width:100px">Queen</span><select id="h-queen"><option value="0">No</option><option value="13">Yes (+13)</option></select></div>
    <button class="btn primary" style="margin-top:.6rem" onclick="commitHearts()">Add</button>
  `;
}
function getNertzForm(){
  return `
    <div class="flex"><span style="width:120px">Cards played</span><input type="number" id="n-played" value="0" style="width:70px"></div>
    <div class="flex" style="margin-top:.4rem"><span style="width:120px">Left in Nertz</span><input type="number" id="n-left" value="0" style="width:70px"></div>
    <button class="btn primary" style="margin-top:.6rem" onclick="commitNertz()">Add</button>
  `;
}

function commitSimple(){
  currentGame.players[scoringPlayer].score += +document.getElementById('simple-pts').value || 0;
  persistActive();
  renderLeaderboard();
}
function commit7Wonders(){
  const pts = (+document.getElementById('w-mil').value||0) + (+document.getElementById('w-sci').value||0) + (+document.getElementById('w-civ').value||0) + (+document.getElementById('w-won').value||0) + (+document.getElementById('w-coin').value||0);
  currentGame.players[scoringPlayer].score += pts;
  persistActive();
  renderLeaderboard();
}
function commitCatan(){
  const pts = (+document.getElementById('c-set').value||0) + (+document.getElementById('c-cit').value||0)*2 + (+document.getElementById('c-lr').value||0) + (+document.getElementById('c-la').value||0) + (+document.getElementById('c-dev').value||0);
  currentGame.players[scoringPlayer].score += pts;
  persistActive();
  renderLeaderboard();
}
function commitCarcassonne(){
  const pts = (+document.getElementById('ca-cit').value||0) + (+document.getElementById('ca-road').value||0) + (+document.getElementById('ca-mon').value||0) + (+document.getElementById('ca-field').value||0);
  currentGame.players[scoringPlayer].score += pts;
  persistActive();
  renderLeaderboard();
}
function commitOhHell(){
  const bid = +document.getElementById('oh-bid').value || 0;
  const tricks = +document.getElementById('oh-tricks').value || 0;
  currentGame.players[scoringPlayer].score += (bid === tricks) ? 10 + bid : 0;
  persistActive();
  renderLeaderboard();
}
function commitHearts(){
  currentGame.players[scoringPlayer].score += (+document.getElementById('h-hearts').value||0) + (+document.getElementById('h-queen').value||0);
  persistActive();
  renderLeaderboard();
}
function commitNertz(){
  const played = +document.getElementById('n-played').value || 0;
  const left = +document.getElementById('n-left').value || 0;
  currentGame.players[scoringPlayer].score += played - (left * 2);
  persistActive();
  renderLeaderboard();
}

function endGame(){
  currentGame.endTime = new Date().toISOString();
  history.unshift(currentGame);
  saveData();
  localStorage.removeItem('gst_active');
  currentGame = null;
  showView('history');
}
function renderRecent(){
  document.getElementById('recent-list').innerHTML = history.slice(0,5).map(g=>`<div>${games.find(x=>x.id===g.type)?.name||g.type} · ${new Date(g.endTime||Date.now()).toLocaleDateString()}</div>`).join('') || '<p class="small">No games yet</p>';
}
function renderHistory(){
  document.getElementById('history-list').innerHTML = history.map(g=>`<div class="card"><strong>${games.find(x=>x.id===g.type)?.name||g.type}</strong><br>${g.players.map(p=>p.name+': '+p.score).join(' · ')}</div>`).join('') || '<p class="small">No history</p>';
}

checkSession();
sb.auth.onAuthStateChange(()=>checkSession());
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Score Tracker</title>
<style>
:root { --bg:#0b1220; --surface:#151c2c; --surface2:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --accent:#22d3ee; --accent-dim:#0891b2; --border:rgba(255,255,255,0.08); }
body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); padding-bottom:80px; }
.view { padding:0 1rem; max-width:900px; margin:0 auto; }
.hidden { display:none !important; }
.card { background:var(--surface); border-radius:16px; padding:1.25rem; margin-bottom:1rem; border:1px solid var(--border); }
.btn { background:var(--surface2); color:var(--text); border:1px solid var(--border); padding:0.7rem 1.2rem; border-radius:12px; font-weight:600; cursor:pointer; }
.btn.primary { background:linear-gradient(135deg,var(--accent),var(--accent-dim)); color:#0b1220; border:none; }
.btn.google { background:#fff; color:#333; border:none; }
input,select { background:#0b1220; border:1px solid var(--border); color:var(--text); padding:0.6rem; border-radius:8px; }
.game-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:0.6rem; }
.game-card { background:var(--surface2); border-radius:12px; height:140px; cursor:pointer; position:relative; background-size:cover; background-position:center; border:2px solid transparent; }
.game-card.selected { border-color:var(--accent); }
.game-card .overlay { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,rgba(0,0,0,.85)); padding:.5rem; color:white; font-weight:600; font-size:.85rem; }
.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:rgba(15,23,42,.95); display:flex; justify-content:space-around; padding:.6rem 0; }
.bottom-nav button { background:none; border:none; color:var(--muted); }
.bottom-nav button.active { color:var(--accent); }
.small { color:var(--muted); font-size:.85rem; }
.flex { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
.mod-btn { padding:.4rem .7rem; border-radius:8px; border:1px solid var(--border); background:var(--surface2); cursor:pointer; }
.mod-btn.active { background:var(--accent); color:#0b1220; }
</style>
</head>
<body>
<div id="login-view" class="view">
  <div class="card" style="max-width:400px;margin:4rem auto;text-align:center">
    <h1>Score Tracker</h1>
    <button class="btn google" style="width:100%" onclick="signInWithGoogle()">Continue with Google</button>
    <input type="email" id="email" placeholder="Or email" style="margin-top:1rem;width:100%">
    <button class="btn primary" style="width:100%;margin-top:.8rem" onclick="signInWithEmail()">Send magic link</button>
    <p id="login-msg" class="small"></p>
  </div>
</div>

<div id="app-view" class="hidden">
  <header style="padding:1rem;display:flex;justify-content:space-between;align-items:center">
    <h1 style="margin:0">Score Tracker</h1>
    <button class="btn" onclick="signOut()">Sign out</button>
  </header>
  <div id="view-home" class="view">
    <div class="card" style="text-align:center">
      <div style="font-size:3rem">🎲</div>
      <h2>Ready to play?</h2>
      <button class="btn primary" style="width:100%;max-width:280px" onclick="showView('new')">Start a Game</button>
    </div>
    <div class="card"><h3>Recent</h3><div id="recent-list"></div></div>
  </div>
  <div id="view-new" class="view hidden">
    <div class="card">
      <h2>Choose Game</h2>
      <div class="game-grid" id="game-grid"></div>
      <label>Version</label><select id="version-select"></select>
      <h3>Players</h3>
      <div id="player-chips"></div>
      <div class="flex"><input id="new-player-name" placeholder="Add player"><button class="btn" onclick="addPlayer()">+</button></div>
      <button class="btn primary" style="width:100%;margin-top:1rem" onclick="startGame()">Start Playing</button>
    </div>
  </div>
  <div id="view-active" class="view hidden">
    <div class="card">
      <h2 id="active-title"></h2>
      <div id="active-scores"></div>
      <div id="active-content"></div>
      <div class="flex" style="margin-top:1rem">
        <button class="btn primary" onclick="endGame()">Save Game</button>
      </div>
    </div>
  </div>
  <div id="view-history" class="view hidden"><div class="card"><h2>History</h2><div id="history-list"></div></div></div>
  <nav class="bottom-nav">
    <button onclick="showView('home')" id="nav-home" class="active">Home</button>
    <button onclick="showView('new')" id="nav-new">Play</button>
    <button onclick="showView('history')" id="nav-history">History</button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://lezfdnqqfejqyxqwlcfg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_HEGO45Fw5dl1s8sAbFnSkg_VzWU_guj';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const REDIRECT = 'https://rand50.github.io/score-tracker/game_tracker.html';

let players = [];
let history = [];
let currentGame = null;
let selectedGame = 'flip7';

const games = [
  { id:'flip7', name:'Flip 7', img:'flip7.jpg', versions:['Standard (to 200)','With a Vengeance'] },
  { id:'7wonders', name:'7 Wonders', img:'7wonders.jpg', versions:['Base','With Leaders'] },
  { id:'ohhell', name:'Oh Hell', img:'ohhell.jpg', versions:['Exact = 10+bid'] },
  { id:'nertz', name:'Nertz', img:'nertz.png', versions:['Standard'] },
  { id:'other', name:'Custom', img:'', versions:['Custom'] }
];

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('app-view').classList.remove('hidden');
    await loadData();
    showView('home');
  }
}
async function signInWithGoogle() {
  await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo:REDIRECT } });
}
async function signInWithEmail() {
  const email = document.getElementById('email').value;
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo:REDIRECT } });
  document.getElementById('login-msg').textContent = error ? error.message : 'Check your email';
}
async function signOut() { await sb.auth.signOut(); location.reload(); }

async function loadData() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  const { data } = await sb.from('score_history').select('*').eq('user_id', user.id).maybeSingle();
  if (data) { players = data.players || []; history = data.history || []; }
}
async function saveData() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  await sb.from('score_history').upsert({ user_id:user.id, players, history, updated_at:new Date().toISOString() });
}

function showView(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.add('hidden'));
  document.getElementById('view-'+v).classList.remove('hidden');
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-'+v)?.classList.add('active');
  if (v==='home') renderRecent();
  if (v==='new') renderNew();
  if (v==='history') renderHistory();
}

function renderNew() {
  document.getElementById('game-grid').innerHTML = games.map(g => `
    <div class="game-card ${g.id===selectedGame?'selected':''}" onclick="selectGame('${g.id}')"
         style="${g.img?`background-image:url('${g.img}')`:''}"><div class="overlay">${g.name}</div></div>
  `).join('');
  const g = games.find(x=>x.id===selectedGame);
  document.getElementById('version-select').innerHTML = (g.versions||[]).map(v=>`<option>${v}</option>`).join('');
  document.getElementById('player-chips').innerHTML = players.map(p=>`<span class="small">${p} </span>`).join('') || '<span class="small">Add players</span>';
}
function selectGame(id){ selectedGame=id; renderNew(); }
function addPlayer(){
  const name = document.getElementById('new-player-name').value.trim();
  if (name && !players.includes(name)) { players.push(name); document.getElementById('new-player-name').value=''; saveData(); renderNew(); }
}

function startGame(){
  if (!players.length){ alert('Add players'); return; }
  currentGame = { type:selectedGame, version:document.getElementById('version-select').value, players:players.map(n=>({name:n,score:0})), rounds:[] };
  showView('active');
  renderActive();
}

function renderActive(){
  const g = games.find(x=>x.id===currentGame.type);
  document.getElementById('active-title').textContent = g.name + ' · ' + currentGame.version;
  document.getElementById('active-scores').innerHTML = currentGame.players.map(p=>`<div style="display:inline-block;margin:.4rem;padding:.6rem;background:var(--surface2);border-radius:10px;text-align:center"><div class="small">${p.name}</div><div style="font-size:1.5rem;color:var(--accent)">${p.score}</div></div>`).join('');
  renderRoundForm();
}

function renderRoundForm(){
  const type = currentGame.type;
  const content = document.getElementById('active-content');
  if (type === 'flip7') {
    content.innerHTML = `<p class="small">Round ${currentGame.rounds.length+1} — official order: numbers → ×2 → +mods → +15 Flip7</p>` +
      currentGame.players.map((p,i)=>`
        <div style="margin-bottom:1rem;padding:.8rem;background:var(--surface2);border-radius:12px">
          <strong>${p.name}</strong>
          <div style="margin:.5rem 0"><label>Number cards sum</label><input type="number" id="f7n${i}" value="0" style="width:100px"></div>
          <div class="flex" style="margin:.5rem 0">
            <button type="button" class="mod-btn" id="f7x2-${i}" onclick="this.classList.toggle('active')">×2</button>
            <button type="button" class="mod-btn" id="f7p2-${i}" onclick="this.classList.toggle('active')">+2</button>
            <button type="button" class="mod-btn" id="f7p4-${i}" onclick="this.classList.toggle('active')">+4</button>
            <button type="button" class="mod-btn" id="f7p6-${i}" onclick="this.classList.toggle('active')">+6</button>
            <button type="button" class="mod-btn" id="f7p8-${i}" onclick="this.classList.toggle('active')">+8</button>
            <button type="button" class="mod-btn" id="f7p10-${i}" onclick="this.classList.toggle('active')">+10</button>
            <button type="button" class="mod-btn" id="f7flip-${i}" onclick="this.classList.toggle('active')">Flip 7 (+15)</button>
            <button type="button" class="mod-btn" id="f7bust-${i}" onclick="this.classList.toggle('active')">Bust</button>
          </div>
        </div>`).join('') + `<button class="btn primary" onclick="submitFlip7()">Score Round</button>`;
  } else {
    content.innerHTML = `<p class="small">Enter points</p>` +
      currentGame.players.map((p,i)=>`<div class="flex"><span style="width:100px">${p.name}</span><input type="number" id="s${i}" value="0"></div>`).join('') +
      `<button class="btn primary" onclick="submitGeneric()">Add</button>`;
  }
}

function submitFlip7(){
  currentGame.players.forEach((p,i)=>{
    if (document.getElementById('f7bust-'+i).classList.contains('active')) {
      p.score += 0;
      return;
    }
    let nums = +document.getElementById('f7n'+i).value || 0;
    if (document.getElementById('f7x2-'+i).classList.contains('active')) nums *= 2;
    let mods = 0;
    if (document.getElementById('f7p2-'+i).classList.contains('active')) mods += 2;
    if (document.getElementById('f7p4-'+i).classList.contains('active')) mods += 4;
    if (document.getElementById('f7p6-'+i).classList.contains('active')) mods += 6;
    if (document.getElementById('f7p8-'+i).classList.contains('active')) mods += 8;
    if (document.getElementById('f7p10-'+i).classList.contains('active')) mods += 10;
    if (document.getElementById('f7flip-'+i).classList.contains('active')) mods += 15;
    p.score += nums + mods;
  });
  currentGame.rounds.push({});
  renderActive();
}
function submitGeneric(){
  currentGame.players.forEach((p,i)=> p.score += +document.getElementById('s'+i).value||0);
  currentGame.rounds.push({});
  renderActive();
}

function endGame(){
  currentGame.endTime = new Date().toISOString();
  history.unshift(currentGame);
  saveData();
  currentGame = null;
  showView('history');
}

function renderRecent(){
  document.getElementById('recent-list').innerHTML = history.slice(0,5).map(g=>`<div>${games.find(x=>x.id===g.type)?.name||g.type} · ${new Date(g.endTime||Date.now()).toLocaleDateString()}</div>`).join('') || '<p class="small">No games yet</p>';
}
function renderHistory(){
  document.getElementById('history-list').innerHTML = history.map(g=>`<div class="card"><strong>${games.find(x=>x.id===g.type)?.name||g.type}</strong><br>${g.players.map(p=>p.name+': '+p.score).join(' · ')}</div>`).join('') || '<p class="small">No history</p>';
}

checkSession();
sb.auth.onAuthStateChange(()=>checkSession());
</script>
</body>
</html>

<!-- ===================== NEUTRAL (GAME-AGNOSTIC) THEME ===================== -->
<style id="neutral-theme">
:root {

/* ---------- Login (neutral navy) ---------- */

.auth-card { width: 100%; max-width: 390px; background: var(--surface); border: 1px solid rgba(148,163,184,0.18); border-radius: 18px; padding: 1.9rem 1.5rem 1.5rem; box-shadow: 0 20px 45px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04); }
.auth-crest { width: 54px; height: 54px; margin: 0 auto 0.8rem; border-radius: 16px; display: flex; align-items: center; justify-content: center;

.auth-subtitle { margin: 0.35rem 0 1.4rem; text-align: center; font-size: 0.74rem; font-weight: 600; letter-spacing: 1.8px; text-transform: uppercase; color: var(--muted); }
.auth-btn { width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 0.8rem 1rem; border-radius: 12px; font: 600 0.98rem var(--font); cursor: pointer; transition: transform .08s ease, filter .15s ease, opacity .15s ease; }

.auth-btn-google { background: #fff; color: #1f2937; border: 1px solid #e2e8f0; box-shadow: 0 2px 6px rgba(0,0,0,0.25); }

.auth-btn-primary { margin-top: 0.7rem; border: none; color: #0b1220; background: linear-gradient(135deg, var(--accent), var(--accent-dim)); box-shadow: 0 4px 14px rgba(34,211,238,0.25); }

.auth-divider::before, .auth-divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(148,163,184,0.35), transparent); }
.auth-label { display: block; font-size: 0.76rem; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
#login-view .auth-input { width: 100%; padding: 0.75rem 0.85rem; border: 1px solid rgba(148,163,184,0.25); border-radius: 12px; background: var(--bg); color: var(--text); font: 0.98rem var(--font); outline: none; }
#login-view .auth-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34,211,238,0.18); }
#login-msg { min-height: 1.25rem; margin: 0.9rem 0 0; text-align: center; font-size: 0.85rem; line-height: 1.35; color: var(--muted); }
#login-msg[data-tone="error"] { color: var(--danger); }
#login-msg[data-tone="success"] { color: var(--success); }

/* ---------- App shell (neutral navy) ---------- */
#app-shell { position: relative; z-index: 1; }
.app-header { padding: 1.1rem 1.1rem 0.6rem; display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto; }
.app-header h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
.view { display: none; padding: 0 1rem 1rem; max-width: 900px; margin: 0 auto; }
.view.active { display: block; }
.card { background: var(--surface); border-radius: var(--radius); padding: 1.2rem; margin-bottom: 1rem; border: 1px solid var(--border); box-shadow: var(--shadow); }
.card h2 { margin: 0 0 .6rem; font-size: 1.25rem; }
.card h3 { margin: 0 0 .5rem; font-size: 1rem; }
.btn { background: var(--surface2); color: var(--text); border: 1px solid var(--border); padding: 0.7rem 1.2rem; border-radius: 12px; font: 600 0.98rem var(--font); cursor: pointer; transition: transform .1s, filter .15s; }
.btn:active { transform: scale(0.98); }

.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-dim)); color: #0b1220; border: none; }
.btn.success { background: var(--success); color: #0b1220; border: none; }
.btn.danger { background: var(--danger); color: #fff; border: none; }
.btn.sm { padding: 0.4rem 0.75rem; font-size: 0.85rem; }
.btn.block { width: 100%; }
input, select, textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.7rem; border-radius: 10px; width: 100%; font: 1rem var(--font); }

label.small, .field-label { display: block; margin: 0.7rem 0 0.3rem; color: var(--muted); font-size: 0.85rem; }
.small { color: var(--muted); font-size: .85rem; }
.flex { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.space-between { justify-content: space-between; }
.hero { text-align: center; padding: 1.6rem 1rem; }

.hero h2 { margin: 0 0 .35rem; }

#sync-status { margin: .6rem 0 0; font-size: .78rem; color: var(--muted); }

.recent-item { padding: .6rem 0; border-bottom: 1px solid var(--border); }
.recent-item:last-child { border-bottom: none; }

/* Choose game */
.game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.7rem; margin: 0.8rem 0 0.4rem; }
.game-card { position: relative; height: 150px; border-radius: 14px; overflow: hidden; cursor: pointer; background-color: var(--surface2); background-size: contain; background-repeat: no-repeat; background-position: center top; border: 2px solid transparent; transition: transform .15s, border-color .15s; }
.game-card:hover { transform: translateY(-2px); }

.game-card .game-art.contain { object-fit: contain; inset: 0 0 30px 0; height: calc(100% - 30px); padding: 6px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.5)); }
.game-card .game-art-bg { position: absolute; inset: -12px; width: calc(100% + 24px); height: calc(100% + 24px); object-fit: cover; filter: blur(10px) brightness(.55) saturate(1.2); pointer-events: none; }
.game-card .game-icon { position: absolute; inset: 0 0 34px 0; display: flex; align-items: center; justify-content: center; font-size: 2.6rem; color: var(--accent); }
.game-card .overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,.88)); padding: 1.1rem .5rem .55rem; color: #fff; font-weight: 600; font-size: .9rem; text-align: center; }
.player-list { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0; }
.player-chip { background: var(--surface2); padding: .4rem .7rem; border-radius: 20px; display: inline-flex; align-items: center; gap: .45rem; font-size: .92rem; border: 1px solid var(--border); }
.player-chip .chip-remove { background: none; border: none; color: var(--danger); font-size: 1.05rem; cursor: pointer; padding: 0 .1rem; line-height: 1; }

/* Generic active game */
.active-head { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }
.active-head h2 { margin: 0; }
.player-row { background: var(--surface2); border-radius: 14px; padding: 0.85rem 1rem; margin: 0.45rem 0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid transparent; }
.player-row.selected { border-color: var(--accent); }
.player-row.leader .p-score { color: var(--success); }
.rank { width: 28px; font-weight: 700; color: var(--muted); }
.p-score { font-size: 1.45rem; font-weight: 700; color: var(--accent); }
#gen-pad { margin-top: .9rem; padding-top: .9rem; border-top: 1px solid var(--border); }
.mode-toggle-n { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; margin: .5rem 0 .8rem; }
.mode-toggle-n button.active { background: var(--accent); color: #0b1220; border-color: var(--accent); }
.key { border-radius: 10px; padding: 0.8rem 0.3rem; text-align: center; font-weight: 700; font-size: 1.1rem; cursor: pointer; border: 1px solid #334155; color: #fff; user-select: none; }
.key.active { outline: 3px solid var(--accent); outline-offset: 1px; }
.key-grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 8px; }
.key-grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 10px; }
.form-row { display: flex; align-items: center; gap: .6rem; margin: .35rem 0; }

.preview { margin: .6rem 0; font-weight: 600; color: var(--accent); }
.action-bar { display: flex; gap: .5rem; margin-top: 1rem; }

.history-item:last-child { border-bottom: none; }

.bottom-nav button .icon { font-size: 1.3rem; line-height: 1; }
.bottom-nav button.active { color: var(--accent); }

/* ---------- No tap-zoom / no tap-select (all themes) ---------- */
html, body, button, a, input, select, textarea, label, [role="button"], [role="option"], [onclick] { touch-action: manipulation; }
button, a, [role="button"], [role="option"], [onclick], .btn, .key, .game-card, .player-row, .player-chip, .bottom-nav button,
.cg-row, .cg-act, .cg-wood-btn, .cg-wood-bar, .cg-reset, .auth-btn, #catan-minus, #catan-plus {
  touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, select, textarea, #login-view .auth-input { font-size: 16px !important; }
input, textarea { -webkit-user-select: text; user-select: text; }

/* Catan board is only shown when theme-catan is on */
#catan-board { display: none; }
body.theme-catan #catan-board { display: block; }
body.theme-catan #generic-board { display: none; }
body.theme-catan .app-header { display: none; }

</style>

(function (global) {

    { id: 'nertz', name: 'Nertz', img: 'nertz.png', fit: 'contain', icon: '🂠',
      versions: ['Standard (+1/-2, optional bonus)', 'To 100', 'To 150', 'No bonus for calling'],
      target: (v) => (/150/.test(v || '') ? 150 : 100), detailedLabel: 'Round' },
    { id: 'other', name: 'Custom', img: 'assets/games/custom.svg', icon: '✏️',

  const gameById = (id) => GAMES.find((g) => g.id === id) || GAMES[GAMES.length - 1];

  const FLIP7_COLORS = {
    0: '#1a1a1a', 1: '#4a90d9', 2: '#f4d03f', 3: '#e74c3c', 4: '#27ae60', 5: '#2ecc71', 6: '#8e44ad',

  };

  const CATAN_CATS = [
    { key: 'settlements', label: 'Settlements',  vp: 1, max: 5, ui: 'settlement', icon: 'cat-icon--settlement' },
    { key: 'cities',      label: 'Cities',       vp: 2, max: 4, ui: 'city',       icon: 'cat-icon--city' },
    { key: 'longestRoad', label: 'Longest Road', vp: 2, max: 1, ui: 'road',       icon: 'cat-icon--road' },
    { key: 'largestArmy', label: 'Largest Army', vp: 2, max: 1, ui: 'army',       icon: 'cat-icon--army' },
    { key: 'vpCards',     label: 'VP Dev Card',      vp: 1, max: 5, ui: 'vpcard',     icon: 'cat-icon--vpcard' }
  ];
  const emptyBreakdown = () => ({ settlements: 0, cities: 0, longestRoad: 0, largestArmy: 0, vpCards: 0 });

  let selectedGame = 'flip7', selectedVersion = null;
  const deselected = new Set();

  // ---------------- Utils ----------------
  const byId = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  const isCatan = () => !!(currentGame && currentGame.type === 'catan');

  // ---------------- Persistence ----------------
  function persistActive() {
    try { currentGame ? localStorage.setItem(KEY_ACTIVE, JSON.stringify(currentGame)) : localStorage.removeItem(KEY_ACTIVE); }
    catch (e) { console.warn('[tracker] persist failed', e); }
  }
  function loadActive() {
    try {
      const raw = localStorage.getItem(KEY_ACTIVE);
      if (!raw) return null;
      const g = JSON.parse(raw);
      if (!g || !Array.isArray(g.players)) return null;
      g.rounds = Array.isArray(g.rounds) ? g.rounds : [];
      g.players.forEach((p) => { p.score = Number(p.score) || 0; if (g.type === 'catan') p.breakdown = { ...emptyBreakdown(), ...(p.breakdown || {}) }; });

  }
  function loadCache(userId) {
    try {
      const c = JSON.parse(localStorage.getItem(KEY_CACHE) || 'null');
      if (!c || (c.userId && userId && c.userId !== userId)) return null;

    [...(a || []), ...(b || [])].forEach((n) => { n = String(n || '').trim(); if (n && !seen.has(n.toLowerCase())) { seen.add(n.toLowerCase()); out.push(n); } });

  function syncStatus(text, isErr) { const el = byId('sync-status'); if (el) { el.textContent = text || ''; el.dataset.state = isErr ? 'error' : 'ok'; } }

  async function loadData() {

    if (cached) { players = [...cached.players]; history = [...cached.history]; pendingSync = cached.pendingSync; }
    const client = sb();
    if (!user || !client) return;
    try {
      const { data, error } = await client.from('score_history').select('*').eq('user_id', user.id).maybeSingle();
      if (error) { syncStatus('Offline — using local data', true); return; }
      const rp = data && Array.isArray(data.players) ? data.players : [];
      const rh = data && Array.isArray(data.history) ? data.history : [];
      if (pendingSync) { players = mergePlayers(players, rp); history = mergeHistory(history, rh); saveCache(true); await saveData(); }

  // ---------------- Auth lifecycle ----------------
  async function onAuthReady(user) {

  // ---------------- Theme + navigation ----------------

  // ---------------- Rounds (shared by every game) ----------------
  function commitRound(deltas, mode, detail) {
    const prev = currentGame.players.map((p) => p.score);
    currentGame.players.forEach((p, i) => { p.score = prev[i] + (Number(deltas[i]) || 0); });
    if (isCatan()) {

  function flipCalc() {
    if (!flip || flip.bust) return 0;
    let s = flip.numbers.reduce((a, b) => a + b, 0);
    if (flip.x2) s *= 2;
    s += flip.mods.reduce((a, b) => a + b, 0);
    if (flip.numbers.length === 7) s += 15;
    return s;
  }
  function flipToggle(kind, val) {
    if (!flip) return;
    const tog = (arr, x) => { const i = arr.indexOf(x); i >= 0 ? arr.splice(i, 1) : arr.push(x); };
    if (kind === 'n') { tog(flip.numbers, val); byId('f7n' + val).classList.toggle('active', flip.numbers.includes(val)); }
    if (kind === 'm') { tog(flip.mods, val); byId('f7m' + val).classList.toggle('active', flip.mods.includes(val)); }
    if (kind === 'x2') { flip.x2 = !flip.x2; byId('f7x2').classList.toggle('active', flip.x2); }

        const pts = Math.max(0, Math.min(13, num('h-hearts'))) + (checked('h-queen') ? 13 : 0) - (checked('h-jack') ? 10 : 0);

  function updateGenericPreview() {

  const CG_ICONS = { settlements: 'icon-settlements.svg', cities: 'icon-cities.svg', longestRoad: 'icon-road.svg', largestArmy: 'icon-army.svg', vpCards: 'icon-vpcard.svg' };
  const CG_ASSET = './assets/catan/';

  function cgSelected() {

  function cgFeedback(selectors) {

    requestAnimationFrame(() => (selectors || []).forEach((sel) => document.querySelectorAll(sel).forEach((el) => {
      const cls = el.classList.contains('cg-act') ? 'cg-flash' : 'cg-pulse';
      el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);

  }
  let cgToastTimer = null;

  }
  // Every Catan change is one undoable round that snapshots scores + breakdowns.
  function commitCatan(mutate, mode, detail) {
    const prev = currentGame.players.map((p) => p.score);
    const prevBd = currentGame.players.map((p) => ({ ...emptyBreakdown(), ...(p.breakdown || {}) }));
    currentGame.players.forEach((p) => { p.breakdown = { ...emptyBreakdown(), ...(p.breakdown || {}) }; });
    mutate(currentGame.players);
    currentGame.players.forEach((p) => { p.score = Math.max(0, Number(p.score) || 0); });
    const deltas = currentGame.players.map((p, i) => p.score - prev[i]);
    if (deltas.every((d) => d === 0) && JSON.stringify(prevBd) === JSON.stringify(currentGame.players.map((p) => p.breakdown))) return false;
    currentGame.rounds.push({ ts: new Date().toISOString(), by: scoringPlayer, mode, prev, prevBd, deltas, detail: detail || null });
    persistActive();
    renderCatan();
    return true;
  }
  function renderCatan() {
    const t = currentGame.targetVp || 10;
    byId('catan-title').textContent = 'Score Tracker';
    byId('catan-sub').textContent = `FIRST TO ${t} VICTORY POINTS`;
    cgSelected();
    renderCatanLeaderboard();
    renderCatanPad();
    renderCatanActions();
    const u = byId('btn-undo'); if (u) u.disabled = !currentGame.rounds.length;
  }
  function renderCatanLeaderboard() {
    const t = currentGame.targetVp || 10;
    const sorted = currentGame.players.map((p, idx) => ({ ...p, idx })).sort((a, b) => (b.score - a.score) || (a.idx - b.idx));
    byId('leaderboard').innerHTML = sorted.map((p) => {
      const win = p.score >= t, sel = p.idx === scoringPlayer;
      const n = Math.max(0, p.score);
      return `<div class="cg-row${sel ? ' selected' : ''}${win ? ' winner' : ''}" data-player-idx="${p.idx}" data-color="${CG_SHIELDS[p.idx % CG_SHIELDS.length]}" role="option" aria-selected="${sel}" tabindex="0"
          onclick="selectCatanPlayer(${p.idx})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectCatanPlayer(${p.idx})}">
          <img class="cg-shield" src="${CG_ASSET}shield-${CG_SHIELDS[p.idx % CG_SHIELDS.length]}.svg" alt="" width="44" height="47" draggable="false">
          <div class="cg-name">${esc(p.name)}${win ? cgCrown : ''}</div>
          <div class="cg-stars${n > 10 ? ' xs' : n > 8 ? ' sm' : n > 6 ? ' md' : ''}" aria-label="${n} stars">${cgStar.repeat(n)}</div>
          <div class="cg-vp vp-num" data-vp="${p.idx}">${p.score}</div>
        </div>`;
    }).join('');
  }
  function renderCatanPad() {
    const idx = scoringPlayer, p = idx === null ? null : currentGame.players[idx];
    byId('adj-val').textContent = p ? String(p.score) : '0';
    byId('pad-player-banner').innerHTML = p ? `Selected: <b>${esc(p.name)}</b>` : 'Selected: —';
    byId('catan-minus').disabled = !p || p.score <= 0;
    byId('catan-plus').disabled = !p;
  }
  function renderCatanActions() {
    const p = scoringPlayer === null ? null : currentGame.players[scoringPlayer];
    byId('score-form').innerHTML = CATAN_CATS.map((c) => {
      const have = p && p.breakdown ? (p.breakdown[c.key] || 0) : 0;
      const held = UNIQUE_CATS.includes(c.key) && have > 0;
      return `<button type="button" class="cg-act${held ? ' held' : ''}" data-cat="${c.key}" onclick="catanAction('${c.key}')" aria-label="${c.label}: add ${c.vp} VP">
          <img class="cg-act-ic" src="${CG_ASSET}${CG_ICONS[c.key]}" alt="" width="70" height="46" draggable="false">
          <span class="cg-act-txt"><span class="cg-act-title">${c.label}</span><span class="cg-act-vp">+${c.vp} VP${have ? `<span class="cg-act-count">${held ? '· held' : '· ×' + have}</span>` : ''}</span></span>
          <span class="cg-act-chev" aria-hidden="true"><svg viewBox="0 0 12 18"><path d="M2.5 2.5l7 6.5-7 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>`;
    }).join('');
  }
  function selectCatanPlayer(idx) {
    if (!isCatan() || !currentGame.players[idx]) return;
    scoringPlayer = idx;
    renderCatanLeaderboard(); renderCatanPad(); renderCatanActions();
    try { if (navigator.vibrate) navigator.vibrate(6); } catch (e) { /* ignore */ }
  }
  function catanStep(d) {
    const idx = cgSelected(); if (idx === null) return;
    const ok = commitCatan((ps) => { ps[idx].score += d; }, 'simple', { player: idx, step: d });
    if (ok) cgFeedback([`.cg-vp[data-vp="${idx}"]`, '#adj-val']);
  }
  function catanAction(key) {
    const c = CATAN_CATS.find((x) => x.key === key); const idx = cgSelected();
    if (!c || idx === null) return;
    const me = currentGame.players[idx];
    if (UNIQUE_CATS.includes(key) && (me.breakdown || {})[key] > 0) { cgToast(`${me.name} already holds ${c.label}`); return; }
    let from = null;
    const ok = commitCatan((ps) => {
      if (UNIQUE_CATS.includes(key)) {
        ps.forEach((q, i) => { if (i !== idx && (q.breakdown[key] || 0) > 0) { from = i; q.breakdown[key] = 0; q.score -= c.vp; } });
      }
      ps[idx].breakdown[key] = (ps[idx].breakdown[key] || 0) + 1;
      ps[idx].score += c.vp;
    }, 'detailed', { player: idx, breakdown: { [key]: 1 } });
    if (!ok) return;
    cgFeedback([`.cg-vp[data-vp="${idx}"]`, '#adj-val', `.cg-act[data-cat="${key}"]`].concat(from !== null ? [`.cg-vp[data-vp="${from}"]`] : []));
    cgToast(`+${c.vp} VP ${me.name} · ${c.label}${from !== null ? ` (from ${currentGame.players[from].name})` : ''}`);
  }
  function resetCatanScores() {
    if (!isCatan() || !currentGame.players.some((p) => p.score || Object.values(p.breakdown || {}).some(Boolean))) { cgToast('Scores are already 0'); return; }
    if (!confirm('Reset every player to 0 VP? (You can Undo this.)')) return;
    commitCatan((ps) => ps.forEach((p) => { p.score = 0; p.breakdown = emptyBreakdown(); }), 'reset', { reset: true });
    cgFeedback(['.cg-vp']);
    cgToast('Scores reset');
  }

  // ---------------- History ----------------
  function renderHistory() {
    const el = byId('history-list');
    if (!history.length) { el.innerHTML = '<p class="small">Nothing here yet.</p>'; return; }
    el.innerHTML = history.map((g, i) => `
      <div class="history-item">
        <div class="flex space-between" style="flex-wrap:nowrap">
          <div><strong>${esc(gameLabel(g))}</strong>${g.version ? ` <span class="small">· ${esc(g.version)}</span>` : ''}
            <div class="small">${esc(new Date(g.endTime || g.startTime || Date.now()).toLocaleDateString())}</div></div>
          <button class="btn danger sm" type="button" aria-label="Delete game" onclick="deleteGame(${i})">×</button>
        </div>
        <div style="margin-top:.3rem">${[...(g.players || [])].sort((a, b) => (gameById(g.type).low ? a.score - b.score : b.score - a.score)).map((p) => `${esc(p.name)}: <strong>${p.score}</strong>`).join(' · ')}</div>
        <div class="winner">Winner: ${esc(g.winner || '—')}</div>
      </div>`).join('');
  }
  function deleteGame(i) {
    if (!history[i] || !confirm('Delete this game from history?')) return;
    history.splice(i, 1); renderHistory(); saveData();
  }

  // Enter key on the add-player input
  document.addEventListener('DOMContentLoaded', () => {
    const input = byId('new-player-name');
    if (input) input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addPlayer(); } });
  });

  Object.assign(global, {
    onAuthReady, onAuthSignedOut, showView, selectGame, togglePlayer, addPlayer, removePlayer, startGame, discardGame,
    openPad, setPadMode, closePad, flipToggle, updateGenericPreview, commitSimplePoints, commitGenericDetailed,
    selectCatanPlayer, catanStep, catanAction, resetCatanScores,
    undoLastRound, undoLastAction: undoLastRound, endGame, deleteGame,
    ScoreTracker: { GAMES, getState: () => ({ players: [...players], history: [...history], currentGame, currentView, scoringPlayer, padMode, pendingSync }) }
  });
})(window);

</script>

<!-- Auth -->
<script id="score-auth-script">
(function () {
  const SUPABASE_URL = 'https://lezfdnqqfejqyxqwlcfg.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_HEGO45Fw5dl1s8sAbFnSkg_VzWU_guj';
  const REDIRECT = 'https://rand50.github.io/score-tracker/game_tracker.html';

  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    const showOffline = () => {
      const lv = document.getElementById('login-view'), as = document.getElementById('app-shell');
      if (as) { as.hidden = true; as.classList.add('auth-hidden', 'hidden'); }
      if (lv) { lv.hidden = false; lv.classList.remove('auth-hidden'); lv.style.display = 'flex'; }
      const m = document.getElementById('login-msg');
      if (m) { m.textContent = 'Could not load the sign-in service. Check your connection and reload.'; m.setAttribute('data-tone', 'error'); }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showOffline, { once: true }); else showOffline();
    return;
  }
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  });
  window.sb = sb;

  let currentUser = null;
  let readyUserId = null;
  let wasSignedIn = false;

  function getEls() {
    return {
      loginView: document.getElementById('login-view'),
      appShell: document.getElementById('app-shell'),
      emailInput: document.getElementById('email'),
      googleBtn: document.getElementById('btn-google-signin'),
      emailBtn: document.getElementById('btn-email-signin'),
      msgEl: document.getElementById('login-msg'),
      formEl: document.getElementById('magic-link-form')
    };
  }

  function setMsg(text, tone) {
    const { msgEl } = getEls();
    if (!msgEl) return;
    msgEl.textContent = text || '';
    if (tone) msgEl.setAttribute('data-tone', tone);
    else msgEl.removeAttribute('data-tone');
  }

  function setBusy(busy) {
    const { googleBtn, emailBtn, emailInput } = getEls();
    if (googleBtn) googleBtn.disabled = busy;
    if (emailBtn) emailBtn.disabled = busy;
    if (emailInput) emailInput.disabled = busy;
  }

  function hideBothInitially() {
    const { loginView, appShell } = getEls();
    if (loginView) {
      loginView.hidden = true;
      loginView.classList.add('auth-hidden');
      loginView.classList.remove('active');
      loginView.style.display = 'none';
    }
    if (appShell) {
      appShell.hidden = true;
      appShell.classList.add('auth-hidden');
      appShell.style.display = 'none';
    }
  }

  function showSignedInUI() {
    const { loginView, appShell } = getEls();
    if (loginView) {
      loginView.hidden = true;
      loginView.classList.add('auth-hidden');
      loginView.classList.remove('active');
      loginView.style.setProperty('display', 'none', 'important');
    }
    if (appShell) {
      appShell.hidden = false;
      appShell.classList.remove('auth-hidden', 'hidden');
      appShell.style.display = 'block';
    }
  }

  function showSignedOutUI() {
    document.body.classList.remove('theme-catan');
    const { loginView, appShell } = getEls();
    if (appShell) {
      appShell.hidden = true;
      appShell.classList.add('auth-hidden', 'hidden');
      appShell.style.setProperty('display', 'none', 'important');
    }
    if (loginView) {
      loginView.hidden = false;
      loginView.classList.remove('auth-hidden');
      loginView.classList.add('active');
      loginView.style.display = 'flex';
    }
  }

  function readAndCleanAuthUrlParams() {
    try {
      const url = new URL(window.location.href);
      const searchParams = url.searchParams;
      const hashParams = new URLSearchParams(url.hash.replace(/^#/, ''));
      const errDesc =
        searchParams.get('error_description') ||
        hashParams.get('error_description') ||
        searchParams.get('error') ||
        hashParams.get('error');

      const authKeys = [
        'code',
        'error',
        'error_code',
        'error_description',
        'access_token',
        'refresh_token',
        'expires_in',
        'expires_at',
        'token_type',
        'provider_token',
        'type'
      ];

      let dirty = false;
      authKeys.forEach((k) => {
        if (searchParams.has(k)) {
          searchParams.delete(k);
          dirty = true;
        }
        if (hashParams.has(k)) {
          hashParams.delete(k);
          dirty = true;
        }
      });

      if (dirty && window.history && window.history.replaceState) {
        const cleanSearch = searchParams.toString();
        const cleanHash = hashParams.toString();
        const nextUrl =
          url.origin +
          url.pathname +
          (cleanSearch ? '?' + cleanSearch : '') +
          (cleanHash ? '#' + cleanHash : '');
        window.history.replaceState({}, document.title, nextUrl);
      }

      return errDesc || null;
    } catch (_) {
      return null;
    }
  }

  function applySession(session, eventName) {
    if (session && session.user) {
      currentUser = session.user;
      wasSignedIn = true;
      setBusy(false);
      setMsg('', '');
      showSignedInUI();
      readAndCleanAuthUrlParams();

      if (readyUserId !== session.user.id) {
        readyUserId = session.user.id;
        if (typeof window.onAuthReady === 'function') {
          try {
            window.onAuthReady(session.user);
          } catch (err) {
            console.error('onAuthReady error:', err);
          }
        }
      }
    } else {
      const shouldNotifySignedOut = wasSignedIn || eventName === 'SIGNED_OUT';
      currentUser = null;
      readyUserId = null;
      wasSignedIn = false;
      setBusy(false);
      showSignedOutUI();

      if (shouldNotifySignedOut && typeof window.onAuthSignedOut === 'function') {
        try {
          window.onAuthSignedOut();
        } catch (err) {
          console.error('onAuthSignedOut error:', err);
        }
      }
    }
  }

  async function signInWithGoogle() {
    setBusy(true);
    setMsg('Redirecting to Google…', '');
    try {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: REDIRECT }
      });
      if (error) {
        setBusy(false);
        setMsg(error.message || 'Google sign-in failed.', 'error');
      }
    } catch (err) {
      setBusy(false);
      setMsg((err && err.message) || 'Google sign-in failed.', 'error');
    }
  }

  async function signInWithEmail(evt) {
    if (evt && typeof evt.preventDefault === 'function') evt.preventDefault();
    const { emailInput } = getEls();
    const email = emailInput ? emailInput.value.trim() : '';
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setMsg('Please enter a valid email address.', 'error');
      if (emailInput) emailInput.focus();
      return;
    }

    setBusy(true);
    setMsg('Sending magic link…', '');
    try {
      const { error } = await sb.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: REDIRECT }
      });
      setBusy(false);
      if (error) {
        setMsg(error.message || 'Could not send magic link.', 'error');
      } else {
        setMsg('Check your email for your sign-in link.', 'success');
      }
    } catch (err) {
      setBusy(false);
      setMsg((err && err.message) || 'Could not send magic link.', 'error');
    }
  }

  async function signOut() {
    try {
      await sb.auth.signOut();
    } catch (err) {
      console.error('signOut error:', err);
    }
    applySession(null, 'SIGNED_OUT');
  }

  async function getUser() {
    if (currentUser) return currentUser;
    const { data: { session } } = await sb.auth.getSession();
    currentUser = session ? session.user : null;
    return currentUser;
  }

  // Wire UI listeners
  function bindEvents() {
    const { googleBtn, formEl } = getEls();
    if (googleBtn && !googleBtn.dataset.bound) {
      googleBtn.dataset.bound = '1';
      googleBtn.addEventListener('click', signInWithGoogle);
    }
    if (formEl && !formEl.dataset.bound) {
      formEl.dataset.bound = '1';
      formEl.addEventListener('submit', signInWithEmail);
    }
  }

  // Expose public API + legacy globals
  window.ScoreAuth = { signInWithGoogle, signInWithEmail, signOut, getUser };
  window.signInWithGoogle = signInWithGoogle;
  window.signInWithEmail = signInWithEmail;
  window.signOut = signOut;

  async function initAuth() {
    hideBothInitially();
    bindEvents();

    // Capture any OAuth error before Supabase finishes URL handling
    const urlError = (() => {
      try {
        const u = new URL(window.location.href);
        const h = new URLSearchParams(u.hash.replace(/^#/, ''));
        return u.searchParams.get('error_description') || h.get('error_description') || u.searchParams.get('error') || h.get('error');
      } catch (_) {
        return null;
      }
    })();

    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') {
        applySession(null, 'SIGNED_OUT');
      } else if (session) {
        applySession(session, event);
      }
    });

    try {
      const { data: { session }, error } = await sb.auth.getSession();
      if (error) {
        applySession(null, 'INIT_ERROR');
        setMsg(error.message || 'Unable to verify session.', 'error');
        return;
      }
      applySession(session, 'INITIAL_SESSION');
      if (!session && urlError) {
        readAndCleanAuthUrlParams();
        setMsg(urlError, 'error');
      }
    } catch (err) {
      applySession(null, 'INIT_ERROR');
      setMsg((err && err.message) || 'Unable to verify session.', 'error');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAuth, { once: true });
  } else {
    initAuth();
  }
})();
</script>

if ('serviceWorker' in navigator) {

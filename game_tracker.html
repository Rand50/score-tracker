<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Score Tracker</title>
<style>
:root { --bg:#2a1f14; --parchment:#f5e6c8; --parchment-dark:#e8d4a8; --text:#3d2914; --gold:#b8860b; --border:#8b6914; }
body { margin:0; font-family:Georgia, serif; background:#1a120b; color:var(--text); padding-bottom:80px; }
.view { padding:0.8rem; max-width:500px; margin:0 auto; }
.hidden { display:none !important; }
.parchment { background:var(--parchment); border:3px solid var(--border); border-radius:8px; padding:1rem; margin-bottom:0.8rem; box-shadow:inset 0 0 20px rgba(0,0,0,0.05); }
.header-title { text-align:center; font-size:1.6rem; font-weight:bold; color:#3d2914; margin:0; letter-spacing:1px; }
.header-sub { text-align:center; font-size:0.75rem; letter-spacing:2px; color:#8b6914; margin:0.3rem 0 0; }
.section-title { text-align:center; font-size:0.9rem; letter-spacing:2px; color:#8b6914; margin:0.5rem 0; font-weight:bold; }
.player-row { display:flex; align-items:center; padding:0.6rem 0; border-bottom:1px dashed #c4a574; }
.player-row:last-child { border-bottom:none; }
.shield { width:36px; height:36px; border-radius:6px; margin-right:0.7rem; display:flex; align-items:center; justify-content:center; font-size:1.2rem; }
.player-name { flex:1; font-weight:600; }
.stars { color:#b8860b; letter-spacing:2px; font-size:0.9rem; }
.vp-num { font-size:1.4rem; font-weight:bold; color:#8b6914; min-width:30px; text-align:right; }
.adjust-box { display:flex; align-items:center; justify-content:center; gap:1rem; padding:0.6rem; }
.adj-btn { width:40px; height:40px; border-radius:6px; border:2px solid #8b6914; background:#3d2914; color:#f5e6c8; font-size:1.3rem; cursor:pointer; }
.adj-val { font-size:1.5rem; font-weight:bold; min-width:40px; text-align:center; }
.cat-row { display:flex; align-items:center; padding:0.7rem; background:#faf3e0; border:1px solid #c4a574; border-radius:6px; margin:0.4rem 0; cursor:pointer; }
.cat-icon { width:40px; height:40px; border-radius:6px; margin-right:0.7rem; display:flex; align-items:center; justify-content:center; font-size:1.3rem; }
.cat-text { flex:1; }
.cat-text strong { display:block; }
.cat-text span { font-size:0.8rem; color:#8b6914; }
.btn { background:#3d2914; color:#f5e6c8; border:none; padding:0.7rem 1.2rem; border-radius:6px; font-weight:600; cursor:pointer; width:100%; margin-top:0.5rem; }
.btn.gold { background:linear-gradient(135deg,#b8860b,#8b6914); }
.mode-toggle { display:flex; gap:0.5rem; margin:0.5rem 0; }
.mode-toggle button { flex:1; background:#e8d4a8; border:1px solid #8b6914; padding:0.5rem; border-radius:6px; cursor:pointer; }
.mode-toggle button.active { background:#8b6914; color:#f5e6c8; }
input { background:#faf3e0; border:1px solid #c4a574; padding:0.6rem; border-radius:6px; width:100%; font-size:1rem; }
.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:#2a1f14; display:flex; justify-content:space-around; padding:0.6rem 0; }
.bottom-nav button { background:none; border:none; color:#c4a574; }
.bottom-nav button.active { color:#b8860b; }
.login-card { background:#f5e6c8; border:3px solid #8b6914; border-radius:8px; padding:2rem; max-width:400px; margin:4rem auto; text-align:center; }
</style>
</head>
<body>
<div id="login-view" class="view">
  <div class="login-card">
    <h1 class="header-title">Score Tracker</h1>
    <button class="btn" style="background:#fff;color:#333;margin-top:1rem" onclick="signInWithGoogle()">Continue with Google</button>
    <input type="email" id="email" placeholder="Or email" style="margin-top:1rem">
    <button class="btn gold" style="margin-top:0.8rem" onclick="signInWithEmail()">Send magic link</button>
    <p id="login-msg" style="font-size:0.85rem;color:#8b6914"></p>
  </div>
</div>

<div id="app-view" class="hidden">
  <div class="view">
    <div class="parchment">
      <h1 class="header-title">Score Tracker</h1>
      <p class="header-sub">FIRST TO 10 VICTORY POINTS</p>
    </div>
    <div class="parchment">
      <div class="section-title">VICTORY POINTS</div>
      <div id="leaderboard"></div>
    </div>
    <div class="parchment" id="pad" class="hidden">
      <div class="section-title">ADJUST VICTORY POINTS</div>
      <div class="mode-toggle">
        <button id="mode-simple" class="active" onclick="setMode('simple')">Simple</button>
        <button id="mode-detailed" onclick="setMode('detailed')">Detailed</button>
      </div>
      <div id="score-form"></div>
    </div>
    <button class="btn" onclick="endGame()">Save Game</button>
    <button class="btn" onclick="signOut()" style="background:#5a3d1a">Sign out</button>
  </div>
  <nav class="bottom-nav">
    <button onclick="showView('home')" id="nav-home" class="active">Home</button>
    <button onclick="showView('new')" id="nav-new">Play</button>
    <button onclick="showView('history')" id="nav-history">History</button>
  </nav>
</div>

<div id="view-home" class="view hidden"><div class="parchment"><button class="btn gold" onclick="showView('new')">Start a Game</button></div></div>
<div id="view-new" class="view hidden">
  <div class="parchment">
    <h2 class="section-title">Players</h2>
    <div id="player-chips"></div>
    <div style="display:flex;gap:0.5rem;margin-top:0.5rem"><input id="new-player-name" placeholder="Add player"><button class="btn" style="width:auto" onclick="addPlayer()">+</button></div>
    <button class="btn gold" style="margin-top:1rem" onclick="startGame()">Start Playing</button>
  </div>
</div>
<div id="view-history" class="view hidden"><div class="parchment"><div id="history-list"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://lezfdnqqfejqyxqwlcfg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_HEGO45Fw5dl1s8sAbFnSkg_VzWU_guj';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const REDIRECT = 'https://rand50.github.io/score-tracker/game_tracker.html';

const SHIELDS = ['#c0392b','#27ae60','#2980b9','#8e44ad','#d35400','#16a085'];
let players = [];
let history = [];
let currentGame = null;
let scoringPlayer = null;
let mode = 'simple';
let adjVal = 1;

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('app-view').classList.remove('hidden');
    await loadData();
    restoreActive();
    showView(currentGame ? 'active' : 'home');
  }
}
async function signInWithGoogle() { await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo:REDIRECT } }); }
async function signInWithEmail() {
  const email = document.getElementById('email').value;
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo:REDIRECT } });
  document.getElementById('login-msg').textContent = error ? error.message : 'Check your email';
}
async function signOut() { await sb.auth.signOut(); location.reload(); }

async function loadData() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  const { data } = await sb.from('score_history').select('*').eq('user_id', user.id).maybeSingle();
  if (data) { players = data.players || []; history = data.history || []; }
}
async function saveData() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  await sb.from('score_history').upsert({ user_id:user.id, players, history, updated_at:new Date().toISOString() });
}
function persistActive() { if (currentGame) localStorage.setItem('gst_active', JSON.stringify(currentGame)); else localStorage.removeItem('gst_active'); }
function restoreActive() { const s = localStorage.getItem('gst_active'); if (s) try { currentGame = JSON.parse(s); } catch(e){} }

function showView(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.add('hidden'));
  if (v === 'home') document.getElementById('view-home').classList.remove('hidden');
  else if (v === 'new') { document.getElementById('view-new').classList.remove('hidden'); renderNew(); }
  else if (v === 'history') { document.getElementById('view-history').classList.remove('hidden'); renderHistory(); }
  else if (v === 'active' && currentGame) { document.getElementById('app-view').classList.remove('hidden'); renderLeaderboard(); }
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-'+v)?.classList.add('active');
}

function renderNew() {
  document.getElementById('player-chips').innerHTML = players.map(p=>`<span>${p} </span>`).join('') || 'Add players';
}
function addPlayer() {
  const name = document.getElementById('new-player-name').value.trim();
  if (name && !players.includes(name)) { players.push(name); document.getElementById('new-player-name').value=''; saveData(); renderNew(); }
}
function startGame() {
  if (!players.length) { alert('Add players'); return; }
  currentGame = { type:'catan', players:players.map(n=>({name:n,score:0})), rounds:[] };
  persistActive();
  showView('active');
}

function renderLeaderboard() {
  const sorted = [...currentGame.players].map((p,i)=>({...p,idx:i})).sort((a,b)=>b.score-a.score);
  document.getElementById('leaderboard').innerHTML = sorted.map((p, rank) => `
    <div class="player-row" onclick="openPad(${p.idx})">
      <div class="shield" style="background:${SHIELDS[p.idx % SHIELDS.length]}">🏰</div>
      <div class="player-name">${p.name}</div>
      <div class="stars">${'★'.repeat(Math.min(p.score,10))}</div>
      <div class="vp-num">${p.score}</div>
    </div>
  `).join('');
  document.getElementById('pad').classList.add('hidden');
}

function openPad(idx) {
  scoringPlayer = idx;
  document.getElementById('pad').classList.remove('hidden');
  setMode(mode);
}

function setMode(m) {
  mode = m;
  document.getElementById('mode-simple').classList.toggle('active', m==='simple');
  document.getElementById('mode-detailed').classList.toggle('active', m==='detailed');
  const form = document.getElementById('score-form');
  const name = currentGame.players[scoringPlayer].name;
  if (m === 'simple') {
    form.innerHTML = `
      <div class="adjust-box">
        <button class="adj-btn" onclick="adj(-1)">−</button>
        <div class="adj-val" id="adj-val">1</div>
        <button class="adj-btn" onclick="adj(1)">+</button>
      </div>
      <button class="btn gold" onclick="commitSimple()">Add ${adjVal} VP to ${name}</button>
    `;
    adjVal = 1;
  } else {
    form.innerHTML = `
      <div class="cat-row" onclick="addCat(1)"><div class="cat-icon" style="background:#c0392b">🏠</div><div class="cat-text"><strong>Settlements</strong><span>+1 VP</span></div></div>
      <div class="cat-row" onclick="addCat(2)"><div class="cat-icon" style="background:#b8860b">🏙️</div><div class="cat-text"><strong>Cities</strong><span>+2 VP</span></div></div>
      <div class="cat-row" onclick="addCat(2)"><div class="cat-icon" style="background:#27ae60">🛤️</div><div class="cat-text"><strong>Longest Road</strong><span>+2 VP</span></div></div>
      <div class="cat-row" onclick="addCat(2)"><div class="cat-icon" style="background:#8e44ad">⚔️</div><div class="cat-text"><strong>Largest Army</strong><span>+2 VP</span></div></div>
      <div class="cat-row" onclick="addCat(1)"><div class="cat-icon" style="background:#d4a017">📜</div><div class="cat-text"><strong>VP Card</strong><span>+1 VP</span></div></div>
      <div id="cat-total" style="text-align:center;margin:0.5rem 0">Round: 0</div>
      <button class="btn gold" onclick="commitDetailed()">Add to Score</button>
    `;
    window._round = 0;
  }
}

function adj(n) { adjVal = Math.max(1, adjVal + n); document.getElementById('adj-val').textContent = adjVal; document.querySelector('#score-form .btn.gold').textContent = `Add ${adjVal} VP to ${currentGame.players[scoringPlayer].name}`; }
function addCat(n) { window._round = (window._round||0) + n; document.getElementById('cat-total').textContent = 'Round: ' + window._round; }
function commitSimple() { currentGame.players[scoringPlayer].score += adjVal; persistActive(); renderLeaderboard(); }
function commitDetailed() { currentGame.players[scoringPlayer].score += window._round||0; window._round=0; persistActive(); renderLeaderboard(); }

function endGame() {
  currentGame.endTime = new Date().toISOString();
  history.unshift(currentGame);
  saveData();
  localStorage.removeItem('gst_active');
  currentGame = null;
  showView('history');
}
function renderHistory() {
  document.getElementById('history-list').innerHTML = history.map(g=>`<div>${g.type}: ${g.players.map(p=>p.name+':'+p.score).join(', ')}</div>`).join('') || 'No history';
}

checkSession();
sb.auth.onAuthStateChange(()=>checkSession());
</script>
</body>
</html>
